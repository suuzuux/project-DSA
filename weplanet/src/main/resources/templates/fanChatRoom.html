<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팬 채팅방</title>
    <!-- SockJS/Stomp : 웹소켓 연결과 실시간 메시지 송수신을 도와주는 외부 자바스크립트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<h1>아티스트 <span th:text="${artistId}"></span>번과의 채팅 (팬 화면)</h1>
<p>오늘 남은 메시지 수: <b id="remainingCount" th:text="${remaining}"></b></p>
<hr>

<!-- 표(table) 하나로 감싸서 대화 내용이 담기는 상자처럼 보이게 함 (CSS 없이 테두리를 만드는 방법) -->
<table border="1" cellpadding="8" cellspacing="0" width="100%">
    <tr>
        <td>
            <div id="messages"></div>
        </td>
    </tr>
</table>

<!--
    hidden : 이 태그를 화면에서 숨기는 순수 HTML 속성 (CSS의 display:none과 달리 style이 아님).
    자바스크립트에서 warningBanner.hidden = true/false 로 보이거나 숨길 수 있음
-->
<p id="warningBanner" hidden></p>

<input type="text" id="messageInput" placeholder="메시지를 입력하세요">
<button id="sendButton">보내기</button>

<script th:inline="javascript">
    // Thymeleaf가 서버에서 넘겨준 실제 값(아티스트/팬 번호)을 자바스크립트 변수로 바꿔치기해줌
    const artistId = /*[[${artistId}]]*/ 0;
    const fanId = /*[[${fanId}]]*/ 0;

    // 웹소켓 연결 시작 (SockJS는 흉내내기용 안전장치, Stomp는 그 위에서 채널 규칙을 관리해주는 도구)
    const socket = new SockJS('/ws-chat');
    const stompClient = Stomp.over(socket);

    // 채팅 메시지 하나를 화면(messages) 밑에 이어붙이는 함수
    function appendMessage(data) {
        const div = document.getElementById('messages');
        div.innerHTML += '<p><b>' + data.senderNickname + '</b> : ' + data.content + '</p>';
        div.scrollTop = div.scrollHeight; // 항상 최신 메시지가 보이도록 스크롤을 맨 아래로 내림
    }

    // 경고 문구를 잠깐 보여줬다가 몇 초 뒤 자동으로 사라지게 하는 함수 (alert() 팝업 대신 사용)
    let warningTimer = null;

    function showWarning(message) {
        const banner = document.getElementById('warningBanner');
        banner.textContent = '[경고] ' + message;
        banner.hidden = false;

        clearTimeout(warningTimer); // 이전에 걸어둔 "숨기기 예약"이 있으면 취소함
        warningTimer = setTimeout(function () {
            banner.hidden = true;
        }, 3500); // 3.5초 뒤에 자동으로 숨김
    }

    // 서버와 웹소켓 연결이 맺어지면, 이 화면에서 구독(실시간으로 받아볼)할 채널들을 등록함
    stompClient.connect({}, function () {
        // 아티스트가 전체 팬에게 보내는 방송 채널
        stompClient.subscribe('/topic/chat.' + artistId, function (message) {
            appendMessage(JSON.parse(message.body));
        });

        // 나(이 팬)와 아티스트만 볼 수 있는 개인 채널 - 다른 팬은 이 채널을 구독조차 할 수 없음
        stompClient.subscribe('/topic/chat.' + artistId + '.fan.' + fanId, function (message) {
            const data = JSON.parse(message.body);
            appendMessage(data);

            if (data.remaining !== undefined) {
                document.getElementById('remainingCount').textContent = data.remaining;
            }
        });

        // 필터(금칙어)에 걸리거나 한도를 다 써서 거부된 내 메시지에 대한 경고를 받는 채널
        stompClient.subscribe('/topic/chat.error.' + fanId, function (message) {
            const data = JSON.parse(message.body);
            showWarning(data.message);
        });
    });

    // 입력창의 내용을 서버로 전송하는 함수
    function sendMessage() {
        const content = document.getElementById('messageInput').value;
        if (!content) return; // 빈 값이면 전송하지 않음

        // stompClient.send(채널, 헤더, 내용) : 웹소켓으로 서버에 메시지를 보냄.
        // JSON.stringify(...) : 자바스크립트 객체를 문자열로 바꿔서 보냄 (서버의 ChatMessageRequest가 이걸 받아줌)
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            artistId: artistId,
            fanId: fanId,
            senderId: fanId,
            content: content
        }));

        document.getElementById('messageInput').value = ''; // 전송 후 입력창 비움
    }

    document.getElementById('sendButton').addEventListener('click', sendMessage);

    // 입력창에서 엔터 키를 누르면, 버튼을 누른 것과 똑같이 전송되게 함
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
