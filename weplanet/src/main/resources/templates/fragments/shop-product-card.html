<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<article th:fragment="shopProductCard(product, fromCommunity)"
         class="product-card"
         th:classappend="${product.soldOut()} ? ' is-sold-out'"
         th:attr="data-category=${product.category()},data-types=${product.typeKeysAttr()},data-title=${product.title()},data-product-id=${product.id()}">
  <div class="product-card__media">
    <th:block th:replace="~{fragments/shop-product-thumb :: shopThumb(
      ${product},
      @{/shop/products/{id}(id=${product.id()},from=${fromCommunity ? 'community' : null})},
      'product-card__thumb',
      false)}"></th:block>
    <button type="button"
            class="product-card__cart-btn"
            data-shop-add-cart="1"
            th:attr="data-product-id=${product.id()}"
            th:disabled="${product.soldOut()}"
            th:title="${product.soldOut()} ? '품절' : '장바구니 담기'"
            aria-label="장바구니 담기">🛒</button>
  </div>
  <a class="product-card__body"
     th:href="@{/shop/products/{id}(id=${product.id()},from=${fromCommunity ? 'community' : null})}">
    <span class="product-card__artist" th:text="${product.artistName()}">아티스트</span>
    <h3 class="product-card__title" th:text="${product.title()}">상품명</h3>
    <p class="product-card__price">
      <span th:text="${product.formattedPrice()}">₩ 0</span>
      <small th:if="${product.priceSuffix() != null}" th:text="${product.priceSuffix()}">다운로드</small>
    </p>
    <p th:if="${product.lowStock()}"
       class="product-card__stock product-card__stock--low"
       th:text="|재고 ${product.stockQuantity()}개 남음|">재고 3개 남음</p>
    <p th:if="${product.soldOut()}" class="product-card__stock product-card__stock--sold">SOLD OUT</p>
  </a>
</article>

<article th:fragment="shopMarqueeCard(product)"
         class="shop-marquee-card"
         th:classappend="${product.soldOut()} ? ' is-sold-out'">
  <div class="shop-marquee-card__media">
    <th:block th:replace="~{fragments/shop-product-thumb :: shopThumb(
      ${product},
      @{/shop/products/{id}(id=${product.id()})},
      'shop-marquee-card__thumb',
      true)}"></th:block>
    <button type="button"
            class="product-card__cart-btn product-card__cart-btn--sm"
            data-shop-add-cart="1"
            th:attr="data-product-id=${product.id()}"
            th:disabled="${product.soldOut()}"
            th:title="${product.soldOut()} ? '품절' : '장바구니 담기'"
            aria-label="장바구니 담기">🛒</button>
  </div>
  <a class="shop-marquee-card__body" th:href="@{/shop/products/{id}(id=${product.id()})}">
    <strong th:text="${product.title()}">상품명</strong>
    <span th:text="${product.formattedPrice()}">₩ 0</span>
    <small th:if="${product.lowStock()}"
           class="product-card__stock product-card__stock--low"
           th:text="|재고 ${product.stockQuantity()}개 남음|">재고 3개 남음</small>
  </a>
</article>
</body>
</html>
