<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>가상계좌 발급 완료 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a class="brand" th:href="@{/}">
      <span class="brand__mark">W</span>
      <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
  </div>
</header>

<main class="container section" style="max-width:560px;padding-top:56px;">
  <h1 id="paymentTitle" style="font-size:20px;font-weight:700;margin-bottom:8px;"
      th:text="${result.paid()} ? '입금이 확인되었어요' : '가상계좌가 발급되었어요'">가상계좌가 발급되었어요</h1>
  <p id="paymentDesc" class="text-muted" style="margin-bottom:24px;line-height:1.6;"
     th:text="${result.paid()} ? '프로젝트 참여가 확정되었습니다.' : '아래 계좌로 입금기한 안에 입금하면 참여가 확정돼요.'">
    아래 계좌로 입금기한 안에 입금하면 참여가 확정돼요.
  </p>

  <div style="border:1px solid var(--wp-hairline, #e5e5e5);border-radius:12px;padding:20px;display:grid;gap:12px;">
    <div class="flex-between"><span class="text-muted">프로젝트</span><strong th:text="${result.projectTitle()}">프로젝트</strong></div>
    <div class="flex-between"><span class="text-muted">참여 금액</span>
      <strong th:text="${#numbers.formatInteger(result.amount(), 1, 'COMMA')} + '원'">10,000원</strong></div>
    <div class="flex-between"><span class="text-muted">입금 은행</span><strong th:text="${result.bankName()}">은행</strong></div>
    <div class="flex-between"><span class="text-muted">계좌번호</span><strong th:text="${result.accountNumber()}">000-0000-0000</strong></div>
    <div class="flex-between"><span class="text-muted">입금 기한</span>
      <strong th:text="${#temporals.format(result.dueDate(), 'yyyy.MM.dd HH:mm')} + ' 까지'">기한</strong></div>
  </div>

  <div id="depositWaiting" th:unless="${result.paid()}">
    <p class="text-xs text-muted" style="margin-top:12px;line-height:1.6;">
      입금기한이 지나면 주문은 자동으로 취소돼요. 입금이 확인되면 이 화면이 자동으로 바뀌어요.
    </p>
    <div class="flex-center" style="gap:10px;justify-content:center;margin-top:16px;">
      <button type="button" id="checkDepositButton" class="btn btn--soft">입금 확인하기</button>
    </div>
    <p id="checkDepositHint" class="text-xs text-muted" style="margin-top:8px;text-align:center;" hidden></p>
  </div>

  <div class="flex-center" style="gap:10px;justify-content:center;margin-top:28px;">
    <a class="btn btn--ghost" th:href="@{/community/{id}/project(id=${result.artistId()})}">프로젝트로 돌아가기</a>
    <a class="btn btn--primary" th:href="@{/collection}">참여 내역 보기</a>
  </div>
</main>

<!--/* 입금 확인 폴링: 토스 웹훅은 로컬(localhost)로 오지 않고 스케줄러는 5분 주기라,
       이 화면이 열려 있는 동안만 해당 주문을 토스에 직접 확인해서 바로 반영한다. */-->
<script th:unless="${result.paid()}" th:inline="javascript">
  (function () {
    const orderNo = /*[[${result.orderNo()}]]*/ "";
    if (!orderNo) return;

    const POLL_INTERVAL_MS = 3000;
    const POLL_LIMIT_MS = 3 * 60 * 1000; // 3분 뒤에는 멈춘다. 이후는 5분 주기 스케줄러가 처리
    const MAX_ERRORS = 3;

    const waitingArea = document.getElementById("depositWaiting");
    const button = document.getElementById("checkDepositButton");
    const hint = document.getElementById("checkDepositHint");
    const title = document.getElementById("paymentTitle");
    const desc = document.getElementById("paymentDesc");

    const deadline = Date.now() + POLL_LIMIT_MS;
    let timer = null;
    let errorCount = 0;
    let checking = false;

    function stopPolling() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function showHint(message) {
      hint.textContent = message;
      hint.hidden = !message;
    }

    function applyResult(data) {
      if (data.paid) {
        stopPolling();
        title.textContent = "입금이 확인되었어요";
        desc.textContent = "프로젝트 참여가 확정되었습니다.";
        waitingArea.hidden = true;
        return;
      }
      if (data.finished) {
        // 기한 만료·취소 등 더 기다려도 바뀌지 않는 상태
        stopPolling();
        title.textContent = "입금이 확인되지 않았어요";
        desc.textContent = "주문 상태: " + data.displayName;
        waitingArea.hidden = true;
      }
    }

    function check(manual) {
      if (checking) return;
      checking = true;
      if (manual) {
        button.disabled = true;
        showHint("확인하는 중이에요…");
      }

      fetch("/payments/toss/orders/" + encodeURIComponent(orderNo) + "/status", {
        // 오류도 JSON으로 받기 위한 프로젝트 공통 표시 (GlobalExceptionHandler)
        headers: { "X-Requested-With": "fetch" }
      })
        .then(function (response) {
          if (!response.ok) throw new Error("상태 조회 실패");
          return response.json();
        })
        .then(function (data) {
          errorCount = 0;
          applyResult(data);
          if (manual && !data.paid && !data.finished) {
            showHint("아직 입금이 확인되지 않았어요. 입금 후 잠시 기다려주세요.");
          }
        })
        .catch(function () {
          errorCount += 1;
          if (errorCount >= MAX_ERRORS) stopPolling();
          if (manual) showHint("확인에 실패했어요. 잠시 후 다시 시도해주세요.");
        })
        .finally(function () {
          checking = false;
          if (manual) button.disabled = false;
        });
    }

    timer = setInterval(function () {
      // 다른 탭을 보고 있는 동안에는 토스에 묻지 않는다
      if (document.hidden) return;
      if (Date.now() > deadline) {
        stopPolling();
        showHint("자동 확인을 멈췄어요. 입금하셨다면 '입금 확인하기'를 눌러주세요.");
        return;
      }
      check(false);
    }, POLL_INTERVAL_MS);

    button.addEventListener("click", function () {
      check(true);
    });
  })();
</script>

</body>
</html>
