<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>결제 실패 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a class="brand" th:href="@{/}">
      <span class="brand__mark">W</span>
      <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
  </div>
</header>

<main class="container section" style="max-width:560px;text-align:center;padding-top:72px;">
  <h1 style="font-size:20px;font-weight:700;margin-bottom:10px;">결제를 완료하지 못했어요</h1>
  <p class="text-muted" style="font-size:15px;line-height:1.7;"
     th:text="${message}">결제에 실패했습니다.</p>

  <div class="flex-center" style="gap:10px;justify-content:center;margin-top:28px;">
    <button type="button" class="btn btn--ghost" onclick="history.go(-2)">이전 화면으로</button>
    <a class="btn btn--primary" th:href="@{/}">홈으로</a>
  </div>
</main>

</body>
</html>
