<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글쓰기</title>
</head>
<body>

<h1 th:text="${post} != null ? '게시글 수정' : ${boardType} + ' 게시판 글쓰기'"></h1>

<form th:action="${post} != null ? @{/posts/detail/{id}/edit(id=${post.id})} : @{/posts/{boardType}/new(boardType=${boardType})}"
      method="post">
    <p>
        테스트 작성자
        <select name="testUserId">
            <option value="1">1번 - 팬 계정</option>
            <option value="2">2번 - 아티스트 계정</option>
            <option value="3">3번 - 관리자 계정</option>
        </select>
    </p>
    <p>제목 <input type="text" name="title" th:value="${post} != null ? ${post.title} : ''"></p>
    <p>내용 <textarea name="content" th:text="${post} != null ? ${post.content} : ''"></textarea></p>
    <p><input type="submit" th:value="${post} != null ? '수정' : '작성'"></p>
</form>

</body>
</html>
