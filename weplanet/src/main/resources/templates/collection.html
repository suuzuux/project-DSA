<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 컬렉션 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" th:href="@{/css/collection.css}" />
</head>
<body data-shell="fan" data-base="/">

<header class="site-header">
  <div class="header-left">
    <button type="button" class="menu-toggle" data-shell-open="menu" aria-label="메뉴">☰</button>
    <a class="brand" th:href="@{/}">
      <span class="brand__mark">W</span>
      <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
  </div>
  <div class="header-actions">
    <button type="button" class="icon-btn">🔔</button>
    <form th:action="@{/logout}" method="post" style="display:inline;">
      <button type="submit" class="btn btn--ghost btn--sm">로그아웃</button>
    </form>
  </div>
</header>

<main class="container section">

  <div class="flex-between mb-24">
    <h1 class="section__title" style="font-size:var(--wp-fs-xl);">
      My Collection
      <span class="text-muted" th:text="${cards.size()}">0</span>
    </h1>
    <a class="btn btn--ghost btn--sm" th:href="@{/}">← 홈</a>
  </div>

  <!-- 가입한 커뮤니티별 카드 -->
  <div class="collection-grid" th:if="${!cards.isEmpty()}">
    <article class="collection-card" th:each="card : ${cards}">

      <div class="collection-card__head">
        <div>
          <strong th:text="${card.artistNickname()}">아티스트명</strong>
          <p class="collection-card__count">
            뱃지 <span th:text="${card.basicCount()}">0</span>
            <span class="collection-card__dot">·</span>
            스페셜 <span th:text="${card.specialCount()}">0</span>
          </p>
        </div>
        <button type="button"
                class="btn btn--soft btn--sm"
                th:attr="data-artist-id=${card.artistId()}, data-artist-name=${card.artistNickname()}"
                data-collection-open>전체보기 →</button>
      </div>

      <div class="badge-row">
        <span class="badge-icon" th:each="badge : ${card.previewBadges()}"
              th:title="${badge.badgeName()}">
          <img th:if="${badge.hasImage()}" th:src="${badge.imageUrl()}" th:alt="${badge.badgeName()}" />
          <span th:unless="${badge.hasImage()}" th:text="${badge.icon()}">🏅</span>
        </span>
        <span class="collection-card__empty" th:if="${card.previewBadges().isEmpty()}">
          아직 획득한 배지가 없어요
        </span>
      </div>
    </article>
  </div>

  <p class="text-muted" style="padding:32px 0;" th:if="${cards.isEmpty()}">
    가입한 커뮤니티가 없습니다. 커뮤니티에 가입하면 배지를 모을 수 있어요.
  </p>

  <!-- 내가 참여한 팬 프로젝트 -->
  <section class="project-history">
    <div class="project-history__head">
      <h2>내 프로젝트 참여 기록</h2>
      <span class="text-muted"
            th:text="${projectParticipations.size()} + '건'">
      0건
    </span>
    </div>

    <div class="project-history__list"
         th:if="${!projectParticipations.isEmpty()}">

      <article class="project-history-card"
               th:each="participation : ${projectParticipations}">

        <div class="project-history-card__head">
          <strong th:text="${participation.projectTitle()}">
            프로젝트 제목
          </strong>

          <span class="project-history-card__status"
                th:text="${participation.paymentStatus() == 'PAID'
                        ? '참여 완료'
                        : participation.paymentStatus()}">
          참여 완료
        </span>
        </div>

        <dl class="project-history-card__info">
          <div>
            <dt>참여 금액</dt>
            <dd th:text="${#numbers.formatInteger(
                          participation.amount(), 0, 'COMMA'
                        )} + '원'">
              10,000원
            </dd>
          </div>

          <div>
            <dt>참여 방식</dt>
            <dd th:text="${participation.anonymous()
                        ? '익명 참여'
                        : '닉네임 공개'}">
              익명 참여
            </dd>
          </div>

          <div>
            <dt>참여 일시</dt>
            <dd th:text="${#temporals.format(
                          participation.participatedAt(),
                          'yyyy.MM.dd HH:mm'
                        )}">
              2026.08.29 16:19
            </dd>
          </div>
        </dl>
      </article>
    </div>

    <p class="project-history__empty text-muted"
       th:if="${projectParticipations.isEmpty()}">
      아직 참여한 팬 프로젝트가 없습니다.
    </p>
  </section>
</main>

<!-- 전체보기 모달 (내용은 자바스크립트가 채움) -->
<div class="modal-backdrop" id="collectionDetail">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal__head">
      <h2 class="modal__title" id="collectionArtistName">아티스트명</h2>
      <button type="button" class="modal__close" data-modal-close>✕</button>
    </div>

    <div class="modal__body">
      <div class="achievement">
        <div class="achievement__label">
          <span>배지 달성률</span>
          <strong id="achievementRate">0%</strong>
        </div>
        <div class="achievement__bar">
          <div class="achievement__fill" id="achievementFill" style="width:0"></div>
        </div>
        <p class="achievement__count">
          Badge <span id="earnedCount">0</span> / <span id="totalCount">0</span>
        </p>
      </div>

      <section class="badge-section">
        <h3 class="badge-section__title">일반 배지</h3>
        <div class="badge-grid" id="basicBadgeGrid"></div>
      </section>

      <section class="badge-section">
        <h3 class="badge-section__title">스페셜 배지</h3>
        <div class="badge-grid" id="specialBadgeGrid"></div>
      </section>
    </div>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/shell.js}"></script>
<script th:src="@{/js/collection.js}"></script>
</body>
</html>
