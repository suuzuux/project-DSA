<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{media.agency.title}">미디어 (소속사)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body>

<header class="community-top">
    <div class="community-top__left">
        <a class="home-link" th:href="@{/}">🏠</a>
        <h1 class="community-top__name" th:text="#{media.board.artist}">ARTIST 게시판</h1>
    </div>
</header>

<nav class="tabs" style="width:min(100% - 40px, 1120px);margin:16px auto 0;">
    <span class="text-muted">Highlight</span>
    <span class="text-muted">Notice</span>
    <a th:href="@{/posts/fan}">Fan</a>
    <a th:href="@{/posts/artist}">Artist</a>
    <a class="is-active" th:href="@{/board/media(role='AGENCY')}">Media</a>
    <span class="text-muted">Live</span>
</nav>

<div style="width:min(100% - 40px, 1120px);margin:16px auto;">
    <h1 th:text="#{media.agency.title}">미디어 (소속사)</h1>

    <p th:if="${msg}" th:text="${msg}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <button type="button" onclick="document.getElementById('writeDialog').showModal()" th:text="#{media.agency.write}">글쓰기</button>
    <button type="button" th:attr="data-alert=#{media.agency.reorderSoon}" onclick="WePlaNet.alert(this.dataset.alert)" th:text="#{media.agency.reorder}">편집</button>

    <p th:if="${list.isEmpty()}" class="list-empty" th:text="#{media.emptyYet}">아직 등록된 미디어가 없습니다.</p>

    <div th:each="post : ${list}">
        <hr/>
        <h3 th:text="${post.title}">제목</h3>
        <p th:text="${post.content}">설명</p>

        <div>
            <span th:each="file : ${post.files}">
                <img th:if="${file.mediaType == 'IMAGE'}"
                     th:src="@{/board/media/file/{id}(id=${file.id})}" width="150"/>
                <video th:if="${file.mediaType == 'VIDEO'}"
                       th:src="@{/board/media/file/{id}(id=${file.id})}" width="150" controls></video>
            </span>
        </div>

        <p th:text="#{community.media.fileCount(${post.fileCount})}">첨부 개수</p>

        <form th:action="@{/board/media/{id}/delete(id=${post.id})}" method="post"
              th:attr="data-confirm=#{community.media.deleteConfirm}"
              onsubmit="return WePlaNet.confirmSubmit(this, this.dataset.confirm);">
            <input type="hidden" name="groupId" th:value="${groupId}"/>
            <button type="submit" th:text="#{common.delete}">삭제</button>
        </form>
    </div>
</div>

<dialog id="writeDialog">
    <h2 th:text="#{media.agency.newTitle}">새 미디어 글쓰기</h2>
    <form th:action="@{/board/media/upload}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="groupId" th:value="${groupId}"/>

        <p><span th:text="#{media.agency.titleField}">제목:</span> <input type="text" name="title" required/></p>
        <p><span th:text="#{media.agency.contentField}">설명:</span><br/><textarea name="content" rows="3" cols="30"></textarea></p>
        <p><span th:text="#{media.agency.filesField}">파일(여러 개 선택 가능):</span><br/>
           <input type="file" name="files" accept="image/*,video/*" multiple required/></p>

        <button type="submit" th:text="#{schedule.submit}">등록</button>
        <button type="reset" th:text="#{media.agency.reset}">초기화</button>
        <button type="button" onclick="document.getElementById('writeDialog').close()" th:text="#{common.cancel}">취소</button>
    </form>
</dialog>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
