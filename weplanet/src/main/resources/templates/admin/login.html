<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN LOGIN | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body class="admin-login">
<div class="admin-login__split">

  <!-- 좌측 비주얼 패널 -->
  <aside class="admin-login__visual">
    <div>
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>
      <h1 class="admin-login__visual-title">서비스 전체를<br />안전하게 관리합니다.</h1>
      <p class="admin-login__visual-desc">
        회원, 아티스트, 소속사, 커뮤니티와 신고 내역을 통합 관리하는<br />
        최고관리자 전용 공간입니다.
      </p>
    </div>

    <svg class="admin-login__deco" viewBox="0 0 320 90" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="0" y1="88" x2="320" y2="88" stroke="currentColor" stroke-opacity="0.35" />
      <line x1="40" y1="88" x2="40" y2="18" stroke="currentColor" stroke-opacity="0.35" />
      <line x1="140" y1="88" x2="140" y2="40" stroke="currentColor" stroke-opacity="0.35" />
      <line x1="240" y1="88" x2="240" y2="55" stroke="currentColor" stroke-opacity="0.35" />
    </svg>
  </aside>

  <!-- 우측 로그인 폼 패널 -->
  <section class="admin-login__panel">
    <div class="admin-login__card">
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>
      <h2 class="admin-login__title">ADMIN LOGIN</h2>

      <!-- 로그인 실패 / 로그아웃 안내 -->
      <p th:if="${errorMessage}" th:text="${errorMessage}" class="admin-login__notice admin-login__notice--error">
        오류
      </p>
      <p th:if="${param.logout}" class="admin-login__notice admin-login__notice--success">
        로그아웃되었습니다.
      </p>

      <form id="adminLoginForm" th:action="@{/admin/login}" method="post">
        <div class="form-group">
          <label class="form-label" for="username">관리자 계정</label>
          <input class="form-input" id="username" name="username"
                 placeholder="계정 입력" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" id="password" name="password" type="password"
                 placeholder="비밀번호 입력" required autocomplete="current-password" />
        </div>

        <!-- 인증번호 전송 버튼을 눌러야만 아래 인증번호 입력칸이 나타난다 -->
        <button type="button" id="sendCodeBtn" class="btn btn--ghost btn--block admin-login__send-btn">
          인증번호 전송
        </button>

        <!-- [인증번호 전송]을 눌러야 나타나는 영역 : 입력칸 + [인증하기] + [재전송] 한 줄 -->
        <div class="form-group" id="codeGroup" style="display:none;">
          <label class="form-label" for="code">보안 인증번호</label>
          <div class="admin-otp-row">
            <input class="form-input" id="code" name="code"
                   inputmode="numeric" maxlength="6" placeholder="숫자만 입력"
                   autocomplete="one-time-code" />
            <button type="button" id="verifyCodeBtn" class="btn btn--primary btn--sm">인증하기</button>
            <button type="button" id="resendCodeBtn" class="btn btn--ghost btn--sm">재전송</button>
          </div>
          <!-- 전송/남은시간/인증결과 안내 (JS가 채움) -->
          <p id="codeStatus" class="admin-otp-status"></p>
        </div>

        <!-- 1단계에서 받은 인증 키. 2단계 제출 때 같이 보낸다 -->
        <input type="hidden" id="verificationKey" name="verificationKey" />

        <button type="submit" class="btn btn--primary btn--block btn--lg">관리자 시스템 접속 →</button>
      </form>
    </div>
  </section>
</div>

<script>
  (function () {
    "use strict";

    const form = document.getElementById("adminLoginForm");
    const sendBtn = document.getElementById("sendCodeBtn");
    const verifyBtn = document.getElementById("verifyCodeBtn");
    const resendBtn = document.getElementById("resendCodeBtn");
    const codeGroup = document.getElementById("codeGroup");
    const codeInput = document.getElementById("code");
    const status = document.getElementById("codeStatus");
    const keyInput = document.getElementById("verificationKey");

    let expiresAt = null;   // 서버가 알려준 만료 시각(ms)
    let timerId = null;
    let verified = false;   // 인증하기까지 마쳤는지

    function setStatus(html, state) {
      status.innerHTML = html;
      status.className = "admin-otp-status" + (state ? " is-" + state : "");
    }

    // 남은 시간을 "n분nn초" 로 표시
    function formatLeft(ms) {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return m + "분" + String(s).padStart(2, "0") + "초";
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function tick() {
      const left = expiresAt - Date.now();

      if (left <= 0) {
        stopTimer();
        setStatus("시간이 초과되었습니다. 인증번호를 다시 받아주세요.", "error");
        verifyBtn.disabled = true;
        codeInput.readOnly = true;
        return;
      }

      setStatus(
        '인증번호가 전송되었습니다. <span class="admin-otp-left">' + formatLeft(left) + "</span>",
        "success"
      );
    }

    function startTimer() {
      stopTimer();
      tick();
      timerId = setInterval(tick, 1000);
    }

    // 아이디/비번을 서버에 보내 확인받고 인증번호를 발송시킨다
    async function requestCode(triggerBtn) {
      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        setStatus("계정과 비밀번호를 먼저 입력해주세요.", "error");
        return;
      }

      triggerBtn.disabled = true;

      try {
        const body = new URLSearchParams({ username, password });
        const res = await fetch("/admin/login/code", { method: "POST", body });
        const data = await res.json();

        if (!data.success) {
          stopTimer();
          setStatus(data.message, "error");
          triggerBtn.disabled = false;
          return;
        }

        keyInput.value = data.verificationKey;
        expiresAt = new Date(data.expiresAt).getTime();

        // [인증번호 전송]을 눌렀을 때만 인증번호 입력 영역을 보여준다
        codeGroup.style.display = "block";
        sendBtn.style.display = "none";

        // 재전송하면 이전 인증 상태와 입력값을 초기화한다
        verified = false;
        codeInput.readOnly = false;
        codeInput.classList.remove("is-locked");
        codeInput.value = "";
        verifyBtn.disabled = false;
        codeInput.focus();

        startTimer();
      } catch (e) {
        stopTimer();
        setStatus("인증번호 발송에 실패했습니다.", "error");
      } finally {
        // 재전송에는 쿨다운을 두지 않는다
        triggerBtn.disabled = false;
      }
    }

    // [인증하기] 버튼 - 입력한 인증번호가 맞는지 미리 확인
    async function verifyCode() {
      const code = codeInput.value.trim();

      if (!code) {
        setStatus("인증번호를 입력해주세요.", "error");
        return;
      }

      verifyBtn.disabled = true;

      try {
        const body = new URLSearchParams({
          username: form.username.value.trim(),
          password: form.password.value,
          verificationKey: keyInput.value,
          code: code
        });
        const res = await fetch("/admin/login/verify", { method: "POST", body });
        const data = await res.json();

        if (data.success) {
          // 인증 완료 - 타이머를 멈추고 입력칸을 잠근다
          verified = true;
          stopTimer();
          setStatus("인증되었습니다.", "success");
          // disabled 가 아니라 readOnly 를 쓴다. disabled 면 폼 제출 때 값이 안 실린다.
          codeInput.readOnly = true;
          codeInput.classList.add("is-locked");
        } else {
          setStatus(data.message, "error");
          verifyBtn.disabled = false;
        }
      } catch (e) {
        setStatus("인증에 실패했습니다.", "error");
        verifyBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", function () {
      setStatus("인증번호를 보내는 중...", null);
      requestCode(sendBtn);
    });

    resendBtn.addEventListener("click", function () {
      setStatus("인증번호를 다시 보내는 중...", null);
      requestCode(resendBtn);
    });

    verifyBtn.addEventListener("click", verifyCode);

    // 엔터로도 인증되게
    codeInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!verifyBtn.disabled) {
          verifyCode();
        }
      }
    });

    // 인증을 마치지 않으면 제출을 막는다 (서버에서도 다시 확인함)
    form.addEventListener("submit", function (e) {
      if (!verified) {
        e.preventDefault();
        setStatus(
          keyInput.value
            ? "인증번호를 인증해주세요."
            : "먼저 [인증번호 전송] 버튼을 눌러 인증번호를 받아주세요.",
          "error"
        );
      }
    });
  })();
</script>
</body>
</html>
