<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN LOGIN | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body class="admin-login">
<div class="admin-login__card">
  <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>
  <h1 class="admin-login__title">ADMIN LOGIN</h1>
  <p class="admin-login__desc">
    서비스 전체를 안전하게 관리합니다.<br />
    회원, 아티스트, 소속사, 커뮤니티와 신고 내역을 통합 관리하는 최고관리자 전용 공간입니다.
  </p>

  <!-- 로그인 실패 / 로그아웃 안내 -->
  <p th:if="${errorMessage}" th:text="${errorMessage}"
     style="margin-bottom:16px;padding:10px 12px;border-radius:8px;background:#3a1f1f;color:#ffb4b4;font-size:13px;">
    오류
  </p>
  <p th:if="${param.logout}"
     style="margin-bottom:16px;padding:10px 12px;border-radius:8px;background:#1f3a30;color:#8fe3c0;font-size:13px;">
    로그아웃되었습니다.
  </p>

  <form id="adminLoginForm" th:action="@{/admin/login}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">관리자 아이디</label>
      <input class="form-input" id="username" name="username"
             placeholder="아이디 입력" required autocomplete="username" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">비밀번호</label>
      <input class="form-input" id="password" name="password" type="password"
             placeholder="비밀번호 입력" required autocomplete="current-password" />
    </div>

    <div class="form-group">
      <label class="form-label" for="code">보안 인증번호</label>
      <div class="form-row">
        <input class="form-input" id="code" name="code"
               inputmode="numeric" maxlength="6" placeholder="숫자만 입력"
               autocomplete="one-time-code" />
        <button type="button" id="sendCodeBtn" class="btn btn--ghost btn--sm">인증</button>
      </div>
      <!-- 발송 결과 안내 (JS가 채움) -->
      <p id="codeStatus" class="text-xs" style="margin-top:8px;min-height:18px;"></p>
    </div>

    <!-- 1단계에서 받은 인증 키. 2단계 제출 때 같이 보낸다 -->
    <input type="hidden" id="verificationKey" name="verificationKey" />

    <button type="submit" class="btn btn--primary btn--block btn--lg">관리자 시스템 접속 →</button>
  </form>
</div>

<script>
  (function () {
    "use strict";

    const form = document.getElementById("adminLoginForm");
    const sendBtn = document.getElementById("sendCodeBtn");
    const status = document.getElementById("codeStatus");
    const keyInput = document.getElementById("verificationKey");

    function setStatus(text, ok) {
      status.textContent = text;
      status.style.color = ok ? "#8fe3c0" : "#ffb4b4";
    }

    // [인증] 버튼 - 아이디/비번을 서버에 보내 확인받고 인증번호를 발송시킨다
    sendBtn.addEventListener("click", async function () {
      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        setStatus("아이디와 비밀번호를 먼저 입력해주세요.", false);
        return;
      }

      sendBtn.disabled = true;
      setStatus("인증번호를 보내는 중...", true);

      try {
        const body = new URLSearchParams({ username, password });
        const res = await fetch("/admin/login/code", { method: "POST", body });
        const data = await res.json();

        setStatus(data.message, data.success);

        if (data.success) {
          keyInput.value = data.verificationKey;
          // 재발송 쿨다운이 60초라 버튼도 같이 잠근다
          startCooldown(60);
        } else {
          sendBtn.disabled = false;
        }
      } catch (e) {
        setStatus("인증번호 발송에 실패했습니다.", false);
        sendBtn.disabled = false;
      }
    });

    // 60초 카운트다운 후 버튼 다시 활성화
    function startCooldown(seconds) {
      let left = seconds;
      sendBtn.textContent = left + "초";
      const timer = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(timer);
          sendBtn.disabled = false;
          sendBtn.textContent = "인증";
          return;
        }
        sendBtn.textContent = left + "초";
      }, 1000);
    }

    // 인증번호를 안 받고 제출하는 것을 막는다 (서버에서도 다시 확인함)
    form.addEventListener("submit", function (e) {
      if (!keyInput.value) {
        e.preventDefault();
        setStatus("먼저 [인증] 버튼을 눌러 인증번호를 받아주세요.", false);
      }
    });
  })();
</script>
</body>
</html>
