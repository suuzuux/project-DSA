<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN LOGIN | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>

<body class="admin-login">
<div class="admin-login__split">

  <aside class="admin-login__visual">
    <div>
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>

      <h1 class="admin-login__visual-title">
        서비스 전체를<br />
        안전하게 관리합니다.
      </h1>

      <p class="admin-login__visual-desc">
        회원, 아티스트, 소속사, 커뮤니티와 신고 내역을 통합 관리하는<br />
        최고관리자 전용 공간입니다.
      </p>
    </div>

    <svg
            class="admin-login__deco"
            viewBox="0 0 320 90"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">

      <line
              x1="0"
              y1="88"
              x2="320"
              y2="88"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="40"
              y1="88"
              x2="40"
              y2="18"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="140"
              y1="88"
              x2="140"
              y2="40"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="240"
              y1="88"
              x2="240"
              y2="55"
              stroke="currentColor"
              stroke-opacity="0.35" />
    </svg>
  </aside>

  <section class="admin-login__panel">
    <div class="admin-login__card">
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>
      <h2 class="admin-login__title">ADMIN LOGIN</h2>

      <p
              th:if="${param.error}"
              class="admin-login__notice admin-login__notice--error">
        아이디 또는 비밀번호가 올바르지 않습니다.
      </p>

      <p
              th:if="${param.logout}"
              class="admin-login__notice admin-login__notice--success">
        로그아웃되었습니다.
      </p>

      <form th:action="@{/login}" method="post">
        <input type="hidden" name="adminLogin" value="true" />

        <div class="form-group">
          <label class="form-label" for="adminId">
            관리자 아이디
          </label>

          <input
                  class="form-input"
                  id="adminId"
                  name="username"
                  type="text"
                  placeholder="아이디 입력"
                  required
                  autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPw">
            비밀번호
          </label>

          <input
                  class="form-input"
                  id="adminPw"
                  name="password"
                  type="password"
                  placeholder="비밀번호 입력"
                  required
                  autocomplete="current-password" />
        </div>

        <button
                type="submit"
                class="btn btn--primary btn--block btn--lg">
          관리자 시스템 접속 →
        </button>
      </form>

      <p
              class="text-xs mt-24"
              style="color:#5a7a78;text-align:center;">

        <a th:href="@{/}" style="color:#7a9593;">
          ← 메인 사이트로
        </a>
      </p>
    </div>
  </section>

</div>
</body>
</html>
