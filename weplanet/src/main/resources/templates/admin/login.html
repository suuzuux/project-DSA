<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN LOGIN | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
  <style>
    .lang-menu__item { display:block; width:100%; text-align:left; padding:8px 12px; border:none; background:none; border-radius:8px; cursor:pointer; font-size:14px; color:#333; font-family:inherit; }
    .lang-menu__item:hover { background:#f2f2f2; }
  </style>
</head>

<body class="admin-login">

<!-- 언어 전환: 로그인 전이라 헤더/사이드바가 없어서 화면 우상단에 고정 배치. 클릭하면 한국어/日本語/English 메뉴가 뜨고, 항목 선택 시 그 언어로 전환 -->
<div style="position:fixed;top:20px;right:20px;z-index:50;">
  <button type="button" class="icon-btn" id="langToggleBtn" data-icon="language"
          th:aria-label="#{layout.header.languageLabel}" aria-haspopup="true" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
  </button>
  <div id="langMenu" hidden
       style="position:absolute;top:48px;right:0;min-width:128px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;">
    <button type="button" class="lang-menu__item" data-lang="ko">한국어</button>
    <button type="button" class="lang-menu__item" data-lang="ja">日本語</button>
    <button type="button" class="lang-menu__item" data-lang="en">English</button>
  </div>
</div>

<div class="admin-login__split">


  <aside class="admin-login__visual">
    <div>
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>

      <h1 class="admin-login__visual-title">
        <th:block th:text="#{admin.login.visual.title1}">서비스 전체를</th:block><br />
        <th:block th:text="#{admin.login.visual.title2}">안전하게 관리합니다.</th:block>
      </h1>

      <p class="admin-login__visual-desc">
        <th:block th:text="#{admin.login.visual.desc1}">회원, 아티스트, 소속사, 커뮤니티와 신고 내역을 통합 관리하는</th:block><br />
        <th:block th:text="#{admin.login.visual.desc2}">최고관리자 전용 공간입니다.</th:block>
      </p>
    </div>

    <svg
            class="admin-login__deco"
            viewBox="0 0 320 90"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">

      <line
              x1="0"
              y1="88"
              x2="320"
              y2="88"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="40"
              y1="88"
              x2="40"
              y2="18"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="140"
              y1="88"
              x2="140"
              y2="40"
              stroke="currentColor"
              stroke-opacity="0.35" />

      <line
              x1="240"
              y1="88"
              x2="240"
              y2="55"
              stroke="currentColor"
              stroke-opacity="0.35" />
    </svg>
  </aside>

  <section class="admin-login__panel">
    <div class="admin-login__card">
      <p class="admin-login__eyebrow">AUTHORIZED PERSONNEL ONLY</p>
      <h2 class="admin-login__title">ADMIN LOGIN</h2>

      <p
              th:if="${param.error}"
              class="admin-login__notice admin-login__notice--error"
              th:text="#{admin.login.error.badCredentials}">
        아이디 또는 비밀번호가 올바르지 않습니다.
      </p>

      <p
              th:if="${param.expired}"
              class="admin-login__notice admin-login__notice--error"
              th:text="#{admin.login.error.expired}">
        세션이 만료되어 다시 로그인해주세요.
      </p>

      <p
              th:if="${param.duplicateLogin}"
              class="admin-login__notice admin-login__notice--error"
              th:text="#{admin.login.error.duplicateLogin}">
        다른 기기에서 로그인되어 로그아웃되었습니다.
      </p>

      <p
              th:if="${param.logout}"
              class="admin-login__notice admin-login__notice--success"
              th:text="#{admin.login.loggedOut}">
        로그아웃되었습니다.
      </p>

      <form th:action="@{/login}" method="post">
        <input type="hidden" name="adminLogin" value="true" />

        <div class="form-group">
          <label class="form-label" for="adminId" th:text="#{admin.login.username}">
            관리자 아이디
          </label>

          <input
                  class="form-input"
                  id="adminId"
                  name="username"
                  type="text"
                  placeholder="아이디 입력"
                  th:placeholder="#{admin.login.username.placeholder}"
                  required
                  autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPw" th:text="#{admin.login.password}">
            비밀번호
          </label>

          <input
                  class="form-input"
                  id="adminPw"
                  name="password"
                  type="password"
                  placeholder="비밀번호 입력"
                  th:placeholder="#{admin.login.password.placeholder}"
                  required
                  autocomplete="current-password" />
        </div>

        <button
                type="submit"
                class="btn btn--primary btn--block btn--lg"
                th:text="|#{admin.login.submit} →|">
          관리자 시스템 접속 →
        </button>
      </form>

      <p
              class="text-xs mt-24"
              style="color:#5a7a78;text-align:center;">

        <a th:href="@{/}" style="color:#7a9593;" th:text="|← #{admin.login.backToMain}|">
          ← 메인 사이트로
        </a>
      </p>
    </div>
  </section>

</div>

<script>
  (function () {
    var btn = document.getElementById("langToggleBtn");
    var menu = document.getElementById("langMenu");
    if (!btn || !menu) return;

    function closeMenu() {
      menu.hidden = true;
      btn.setAttribute("aria-expanded", "false");
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var willOpen = menu.hidden;
      menu.hidden = !willOpen;
      btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    });

    menu.querySelectorAll("[data-lang]").forEach(function (item) {
      item.addEventListener("click", function () {
        fetch("/language", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "language=" + encodeURIComponent(item.getAttribute("data-lang").toUpperCase())
        }).finally(function () {
          window.location.reload();
        });
      });
    });

    document.addEventListener("click", function (e) {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) closeMenu();
    });
  })();
</script>
</body>
</html>
