<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${notice} != null ? #{admin.noticeForm.pageTitleEdit} : #{admin.noticeForm.pageTitleNew}">공지 글쓰기 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">
  <div class="portal-shell">
    <aside class="portal-sidebar portal-sidebar--admin">
      <div class="portal-sidebar__org">
        <div class="agency">WEPLANET</div>
        <div class="artist">ADMIN</div>
      </div>

      <nav class="portal-sidebar__nav">
        <!-- 통합 대시보드 하위 메뉴 - 오른쪽 화살표로 열고 닫는다 (details/summary, JS 없음) -->
        <details class="portal-sidebar__group">
          <summary>
            <a th:href="@{/admin/dashboard}" th:text="|📊 #{admin.nav.dashboard}|">📊 통합 대시보드</a>
            <span class="portal-sidebar__caret" aria-label="하위 메뉴 열기/닫기"></span>
          </summary>
          <a class="portal-sidebar__sub" th:href="@{/admin/banners}" th:text="|🖼 #{admin.nav.banners}|">🖼 배너 영역 관리</a>
        </details>
        <a th:href="@{/admin/applications}" th:text="|📥 #{admin.nav.applications}|">📥 등록 신청</a>
        <a th:href="@{/admin/agencies}" th:text="|🏢 #{admin.nav.agencies}|">🏢 소속사 관리</a>
        <a th:href="@{/admin/artists}" th:text="|🎤 #{admin.nav.artists}|">🎤 아티스트 관리</a>
        <a th:href="@{/admin/users}" th:text="|👥 #{admin.nav.users}|">👥 전체 회원</a>
        <a th:href="@{/admin/reports}" th:text="|🚩 #{admin.nav.reports}|">🚩 통합 신고 · 제재</a>
        <a class="is-active" th:href="@{/admin/notices}" th:text="|📢 #{admin.nav.notices}|">📢 전체 공지</a>
        <a th:href="@{/admin/communities}" th:text="|💬 #{admin.nav.communities}|">💬 커뮤니티 운영</a>
        <a th:href="@{/admin/logs}" th:text="|🧾 #{admin.nav.logs}|">🧾 관리자 로그</a>
      </nav>

      <div class="portal-sidebar__footer">
        <form th:action="@{/admin/logout}" method="post" style="margin:0;">
          <button type="submit" class="btn" th:text="|🚪 #{common.logout}|">🚪 로그아웃</button>
        </form>
      </div>
    </aside>

    <main class="portal-main">
      <div class="portal-main__head">
        <h1 th:text="${notice} != null ? #{noticeForm.headingEdit} : #{admin.noticeForm.headingNew}">공지 글쓰기</h1>
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/notices}" th:text="#{admin.noticeForm.backToList}">← 목록</a>
      </div>

      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>

      <form class="settings-block" style="max-width:800px;"
            th:action="${notice} != null ? @{/admin/notices/{id}(id=${notice.id})} : @{/admin/notices}"
            method="post">
        <div class="form-group">
          <label class="form-label" for="title" th:text="#{noticeForm.titleLabel}">제목</label>
          <input class="form-input" id="title" name="title" th:value="${notice != null ? notice.title : ''}"
                 placeholder="제목을 입력해주세요." th:placeholder="#{noticeForm.titlePlaceholder}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="content" th:text="#{noticeForm.contentLabel}">본문내용</label>
          <textarea class="form-textarea" id="content" name="content" style="min-height:220px;"
                    placeholder="본문을 입력해주세요." th:placeholder="#{noticeForm.contentPlaceholder}" required
                    th:text="${notice != null ? notice.content : ''}"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="category" th:text="#{admin.noticeForm.categoryLabel}">분류</label>
          <select class="form-select" id="category" name="category" style="max-width:200px;">
            <option value="GENERAL" th:selected="${notice == null || notice.category.name() == 'GENERAL'}" th:text="#{siteNotice.category.GENERAL}">일반</option>
            <option value="EVENT" th:selected="${notice != null && notice.category.name() == 'EVENT'}" th:text="#{siteNotice.category.EVENT}">이벤트</option>
            <option value="MAINTENANCE" th:selected="${notice != null && notice.category.name() == 'MAINTENANCE'}" th:text="#{siteNotice.category.MAINTENANCE}">점검</option>
            <option value="UPDATE" th:selected="${notice != null && notice.category.name() == 'UPDATE'}" th:text="#{siteNotice.category.UPDATE}">업데이트</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="published" th:text="#{noticeForm.publishedLabel}">공개여부</label>
          <select class="form-select" id="published" name="published" style="max-width:200px;">
            <option value="true" th:selected="${notice == null || notice.published}" th:text="#{noticeForm.publishedTrue}">공개</option>
            <option value="false" th:selected="${notice != null && !notice.published}" th:text="#{noticeForm.publishedFalse}">비공개</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="publishAt" th:text="#{admin.noticeForm.publishAtLabel}">예약 발행 (선택)</label>
          <input class="form-input" type="date" id="publishAt" name="publishAt"
                 th:value="${notice != null && notice.publishAt != null} ? ${#temporals.format(notice.publishAt, 'yyyy-MM-dd')} : ''" />
          <p class="text-sm text-muted" style="margin-top:6px;" th:text="#{admin.noticeForm.publishAtHint}">비워두면 지금 바로(공개여부 설정대로) 노출됩니다. 시각을 지정하면 그 전까지는 "공개"로 저장해도 실제로는 안 보입니다.</p>
        </div>
        <div class="form-group">
          <label class="form-label" th:text="#{noticeForm.pinnedLabel}">상단 노출</label>
          <input type="hidden" id="pinned" name="pinned" th:value="${notice != null && notice.pinned}">
          <button type="button" id="pinToggle" class="btn btn--ghost"
                  th:classappend="${notice != null && notice.pinned} ? ' is-pin-on'"
                  th:attr="data-pinned=${notice != null && notice.pinned},
                           data-at-limit=${(notice == null || !notice.pinned) && pinnedCount >= maxPinned},
                           data-max-pinned=${maxPinned}">
            <span th:text="${notice != null && notice.pinned} ? #{noticeForm.pinnedOn} : #{noticeForm.pinnedOff}">이 글을 목록 최상단에 띄우기</span>
          </button>
          <p class="text-sm text-muted" style="margin-top:8px;" th:text="#{noticeForm.pinnedHint(${maxPinned}, ${pinnedCount})}">
            켜면 공지 목록 맨 위에 볼드 제목으로 표시됩니다. 상단 노출은 최대 3개까지 가능합니다.
            (0/3)
          </p>
        </div>
        <div class="flex-center" style="justify-content:flex-end;">
          <button type="submit" class="btn btn--primary"
                  th:text="${notice} != null ? #{noticeForm.submitEdit} : #{admin.noticeForm.submitNew}">등록</button>
        </div>
      </form>
    </main>
  </div>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/shell.js}"></script>
<script th:inline="javascript">
  (function () {
    var btn = document.getElementById("pinToggle");
    var input = document.getElementById("pinned");
    if (!btn || !input) return;
    var atLimit = btn.getAttribute("data-at-limit") === "true";
    var pinnedOnLabel = /*[[#{noticeForm.pinnedOn}]]*/ "상단 노출 중";
    var pinnedOffLabel = /*[[#{noticeForm.pinnedOff}]]*/ "이 글을 목록 최상단에 띄우기";
    var pinnedLimitMessage = /*[[#{siteNotice.error.pinnedLimit}]]*/ "상단 노출은 최대 3개까지 가능합니다.";
    var label = btn.querySelector("span");
    function render(on) {
      input.value = on ? "true" : "false";
      btn.classList.toggle("is-pin-on", on);
      if (label) label.textContent = on ? pinnedOnLabel : pinnedOffLabel;
    }
    render(btn.getAttribute("data-pinned") === "true");
    btn.addEventListener("click", function () {
      var on = input.value === "true";
      if (!on && atLimit) {
        alert(pinnedLimitMessage);
        return;
      }
      render(!on);
    });
  })();
</script>
</body>
</html>
