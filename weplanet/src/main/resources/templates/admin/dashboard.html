<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합 운영 대시보드 | WePlaNet ADMIN</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
<div class="portal-shell">

  <aside class="portal-sidebar portal-sidebar--admin">
    <div class="portal-sidebar__org">
      <div class="agency">WEPLANET</div>
      <div class="artist">ADMIN</div>
    </div>

    <nav class="portal-sidebar__nav">
      <a class="is-active" th:href="@{/admin/dashboard}">통합 대시보드</a>
      <a href="#" onclick="alert('소속사 관리 - 준비 중');return false;">소속사 관리</a>
      <a href="#" onclick="alert('아티스트 관리 - 준비 중');return false;">아티스트 관리</a>
      <a href="#" onclick="alert('사용자 관리 - 준비 중');return false;">사용자 관리</a>
      <a href="#" onclick="alert('통합 신고·제재 - 준비 중');return false;">통합 신고 · 제재</a>
      <a href="#" onclick="alert('커뮤니티 관리 - 준비 중');return false;">커뮤니티 관리</a>
      <a href="#" onclick="alert('공지사항 관리 - 준비 중');return false;">공지사항 관리</a>
    </nav>

    <div class="portal-sidebar__footer">
      <!-- 로그아웃은 GET 링크가 아니라 POST 폼이어야 한다 (강제 로그아웃 방지) -->
      <form th:action="@{/admin/logout}" method="post" style="margin:0;">
        <button type="submit" class="btn btn--ghost btn--sm btn--block">로그아웃</button>
      </form>
    </div>
  </aside>

  <main class="portal-main">
    <div class="portal-main__head">
      <h1>통합 운영 대시보드</h1>
      <span th:text="${adminNickname} + ' 님'">슈퍼 관리자 님</span>
    </div>

    <!-- 통계 카드 -->
    <div class="admin-stat-grid">
      <article class="admin-stat">
        <p class="admin-stat__label">총 가입자</p>
        <strong class="admin-stat__value"
                th:text="${#numbers.formatInteger(stats.totalUsers(), 0, 'COMMA')}">0</strong>
      </article>
      <article class="admin-stat">
        <p class="admin-stat__label">아티스트</p>
        <strong class="admin-stat__value"
                th:text="${#numbers.formatInteger(stats.artistCount(), 0, 'COMMA')}">0</strong>
      </article>
      <article class="admin-stat">
        <p class="admin-stat__label">팬 회원</p>
        <strong class="admin-stat__value"
                th:text="${#numbers.formatInteger(stats.fanCount(), 0, 'COMMA')}">0</strong>
      </article>
      <article class="admin-stat admin-stat--alert">
        <p class="admin-stat__label">신고 접수</p>
        <strong class="admin-stat__value"
                th:text="${#numbers.formatInteger(stats.reportCount(), 0, 'COMMA')}">0</strong>
      </article>
    </div>

    <section class="admin-panel">
      <h2 class="admin-panel__title">안내</h2>
      <p class="admin-panel__desc">
        좌측 메뉴의 각 관리 기능은 순차적으로 연결됩니다.<br />
        현재는 로그인 · 대시보드 통계 · 로그아웃이 동작합니다.
      </p>
    </section>
  </main>
</div>
</body>
</html>
