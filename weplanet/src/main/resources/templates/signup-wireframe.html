<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [와이어프레임] 메인 – 회원가입 방법 선택 -->
  <title>WePlaNet – 회원가입</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="auth-card__back" href="/">← 뒤로</a>
    <div class="flex-between mb-16">
      <span></span>
      <button type="button" class="icon-btn" aria-label="언어">🌐</button>
    </div>

    <h1 class="auth-card__title">위플래닛의 모든 서비스,<br />가입 한 번으로<br />간편하게 즐겨요!</h1>
    <p class="auth-card__brand">We<span>Pla</span>Net</p>

    <!-- 소셜 회원가입 시도했는데 이메일이 겹치는 기존 계정과 연동을 취소한 경우
         (SocialLoginEntryController.cancelEmailConflict -> /signup?socialEmailTaken=true) -->
    <p th:if="${param.socialEmailTaken}" class="text-sm" style="color:#c45c26;margin-top:8px;">
      이미 사용 중인 이메일입니다. 다른 이메일 계정을 이용해주세요.
    </p>

    <!-- 이미 이 소셜 계정으로 가입이 끝난 상태에서 "회원가입"을 또 시도한 경우
         (OAuth2LoginSuccessHandler -> /signup?socialAlreadyRegistered=true) -->
    <p th:if="${param.socialAlreadyRegistered}" class="text-sm" style="color:#c45c26;margin-top:8px;">
      이미 가입된 계정입니다. 로그인해주세요.
    </p>

    <div class="stack">
      <a class="btn btn--sns" href="/social-login/google/signup">
        <span class="sns-icon sns-icon--google">G</span> Google로 가입하기
      </a>
      <a class="btn btn--sns" href="/social-login/kakao/signup">
        <span class="sns-icon sns-icon--kakao">K</span> Kakao로 가입하기
      </a>
      <button type="button" class="btn btn--sns" disabled title="준비 중입니다" onclick="alert('LINE 회원가입은 준비 중입니다.')">
        <span class="sns-icon sns-icon--line">L</span> LINE으로 가입하기
      </button>
    </div>

    <div class="auth-divider">또는</div>

    <a class="btn btn--primary btn--block btn--lg" href="/signup/id">아이디로 가입하기</a>

    <p class="text-sm text-muted mt-24" style="text-align:center;">
      이미 계정이 있나요? <a href="/login" style="color:var(--wp-brand);font-weight:700;">로그인</a>
    </p>
  </div>
</body>
</html>
