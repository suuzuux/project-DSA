<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{signupEntry.pageTitle}">회원가입 | WePlaNet</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="auth-card__back" href="/" th:text="#{signup.back}">← 뒤로</a>
    <div class="flex-between mb-16">
      <span></span>
    </div>

    <h1 class="auth-card__title" th:utext="#{signupEntry.heading}">위플래닛의 모든 서비스,<br />가입 한 번으로<br />간편하게 즐겨요!</h1>
    <p class="auth-card__brand">We<span>Pla</span>Net</p>

    <p th:if="${param.socialEmailTaken}" class="text-sm" style="color:#c45c26;margin-top:8px;" th:text="#{signupEntry.socialEmailTaken}">
      이미 가입된 이메일입니다. 먼저 로그인한 뒤, 설정 화면에서 소셜 계정을 연동해주세요.
    </p>

    <p th:if="${param.socialAlreadyRegistered}" class="text-sm" style="color:#c45c26;margin-top:8px;" th:text="#{signupEntry.socialAlreadyRegistered}">
      이미 가입된 계정입니다. 로그인해주세요.
    </p>

    <p th:if="${param.socialSignupCancelled}" class="text-sm text-muted" style="margin-top:8px;" th:text="#{signupEntry.socialSignupCancelled}">
      회원가입이 취소되었어요. 원하실 때 다시 가입해주세요.
    </p>

    <div class="stack">
      <a class="btn btn--sns" href="/social-login/google/signup">
        <span class="sns-icon sns-icon--google">G</span> <span th:text="#{signupEntry.snsGoogle}">Google로 가입하기</span>
      </a>
      <a class="btn btn--sns" href="/social-login/kakao/signup">
        <span class="sns-icon sns-icon--kakao">K</span> <span th:text="#{signupEntry.snsKakao}">Kakao로 가입하기</span>
      </a>
      <a class="btn btn--sns" href="/social-login/line/signup">
        <span class="sns-icon sns-icon--line">L</span> <span th:text="#{signupEntry.snsLine}">LINE으로 가입하기</span>
      </a>
    </div>

    <div class="auth-divider" th:text="#{auth.divider}">또는</div>

    <a class="btn btn--primary btn--block btn--lg" href="/signup/id" th:text="#{signupEntry.idSignupButton}">아이디로 가입하기</a>

    <p class="text-sm text-muted mt-24" style="text-align:center;">
      <span th:text="#{signupEntry.hasAccountPrompt}">이미 계정이 있나요?</span> <a href="/login" style="color:var(--wp-brand);font-weight:700;" th:text="#{common.login}">로그인</a>
    </p>
  </div>
</body>
</html>
