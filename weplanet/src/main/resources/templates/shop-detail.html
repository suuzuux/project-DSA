<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${product.title() + ' | WePlaNet Shop'}">상품 상세 | WePlaNet Shop</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" th:href="@{/css/shop.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-toggle" data-shell-open="menu" aria-label="메뉴">☰</button>
      <a class="brand" th:href="@{/shop}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net Shop</span>
      </a>
    </div>
    <div class="header-actions">
      <a class="icon-btn" th:href="@{/shop/cart}" aria-label="장바구니">
        🛒
        <span th:if="${cartItemCount != null && cartItemCount > 0}"
              class="shop-cart-badge"
              th:text="${cartItemCount}">0</span>
      </a>
    </div>
  </header>

  <main class="container section">
    <a class="section__link mb-16"
       style="display:inline-block;"
       th:href="${fromCommunity} ? @{/shop/community/{id}(id=${product.artistId()})} : @{/shop(artistId=${product.artistId()})}">← Shop 목록</a>

    <article class="product-detail">
      <div class="product-detail__gallery">상품 이미지 영역</div>

      <div class="product-detail__info">
        <p class="text-sm" style="color:var(--wp-brand);font-weight:700;">
          <span th:text="${product.artistName()}">아티스트</span>
          · <span th:text="${product.categoryLabel()}">MD</span>
        </p>
        <h1 th:text="${product.title()}">상품명</h1>
        <p class="text-sm text-muted" th:text="${product.artistName() + ' 공식 굿즈'}">공식 굿즈</p>
        <p class="product-detail__price">
          <span th:text="${product.formattedPrice()}">₩ 0</span>
          <small th:if="${product.priceSuffix() != null}" th:text="${product.priceSuffix()}">다운로드</small>
        </p>

        <div class="membership-notice" th:if="${product.membershipOnly()}">
          <strong>멤버십 전용 상품</strong><br />
          <span th:text="${product.artistName() + ' Membership 가입 회원만 구매할 수 있습니다.'}">멤버십 안내</span>
          <a th:href="@{/membership}">멤버십 가입하기 ›</a>
        </div>

        <p class="product-detail__desc"
           th:text="${product.artistName() + ' 공식 굿즈입니다. WePlaNet Shop에서 안전하게 구매할 수 있습니다.'}">
          상품 설명
        </p>

        <div class="product-detail__options">
          <label for="qty">수량</label>
          <select class="form-select" id="qty" name="quantity" form="addToCartForm" style="max-width:120px;">
            <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n}">1</option>
          </select>
        </div>

        <div class="stack">
          <form id="addToCartForm" th:action="@{/shop/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${product.id()}" />
            <button type="submit" class="btn btn--primary btn--block btn--lg">
              장바구니 담기
            </button>
          </form>
          <button type="button" class="btn btn--accent btn--block"
                  onclick="WePlaNet.alert('결제 페이지 (목업)')">
            바로 구매
          </button>
          <a class="btn btn--ghost btn--block"
             th:href="@{/community/{id}/highlight(id=${product.artistId()})}"
             th:text="${product.artistName() + ' 커뮤니티로'}">커뮤니티로</a>
        </div>
      </div>
    </article>
  </main>

  <script th:inline="javascript">
    window.__WEPLANET_ARTISTS__ = /*[[${joinedArtists}]]*/ [];
  </script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/shop.js}"></script>
</body>
</html>
