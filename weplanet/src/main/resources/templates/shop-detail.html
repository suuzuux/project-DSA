<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{shopDetail.pageTitle(${product.title()})}">상품 상세 | WePlaNet Shop</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" th:href="@{/css/shop.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-toggle" data-shell-open="menu" th:aria-label="#{shop.menuAria}" aria-label="메뉴">☰</button>
      <a class="brand" th:href="@{/shop}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net Shop</span>
      </a>
    </div>
    <div class="header-actions">
      <a class="icon-btn" th:href="@{/shop/cart}" th:aria-label="#{shop.cartAria}" aria-label="장바구니">
        🛒
        <span th:if="${cartItemCount != null && cartItemCount > 0}"
              class="shop-cart-badge"
              th:text="${cartItemCount}">0</span>
      </a>
    </div>
  </header>

  <main class="container section">
    <a class="section__link mb-16"
       style="display:inline-block;"
       th:href="${fromCommunity} ? @{/shop/community/{id}(id=${product.artistId()})} : @{/shop(artistId=${product.artistId()})}" th:text="#{shopDetail.backToList}">← Shop 목록</a>

    <p th:if="${message}" class="alert alert--success mb-16" th:text="${message}">알림</p>

    <article class="product-detail" th:classappend="${product.soldOut()} ? ' is-sold-out'">
      <th:block th:replace="~{fragments/shop-product-thumb :: shopThumb(
        ${product}, null, 'product-detail__gallery', false)}"></th:block>

      <div class="product-detail__info">
        <p class="text-sm" style="color:var(--wp-brand);font-weight:700;">
          <span th:text="${product.artistName()}">아티스트</span>
          · <span th:text="${product.categoryLabel()}">MD</span>
        </p>
        <h1 th:text="${product.title()}">상품명</h1>
        <p class="text-sm text-muted" th:text="#{shopDetail.officialGoods(${product.artistName()})}">공식 굿즈</p>
        <p class="product-detail__price">
          <span th:text="${product.formattedPrice()}">₩ 0</span>
          <small th:if="${product.priceSuffix() != null}" th:text="${product.priceSuffix()}">다운로드</small>
        </p>
        <p th:if="${!product.soldOut() and product.lowStock()}"
           class="product-card__stock product-card__stock--low"
           th:text="#{shop.stockLow(${product.stockQuantity()})}">재고 3개 남음</p>
        <p th:if="${product.soldOut()}" class="product-card__stock product-card__stock--sold" th:text="#{shop.soldOut}">SOLD OUT</p>

        <div class="membership-notice" th:if="${product.membershipOnly()}">
          <strong th:text="#{shopDetail.membershipOnlyTitle}">멤버십 전용 상품</strong><br />
          <span th:text="#{shopDetail.membershipOnlyDesc(${product.artistName()})}">멤버십 안내</span>
          <a th:href="@{${productCommunityUrl}}" th:text="#{shopDetail.joinMembershipLink}">커뮤니티에서 멤버십 가입하기 ›</a>
        </div>

        <p class="product-detail__desc"
           style="white-space:pre-wrap;"
           th:if="${product.description() != null and !#strings.isEmpty(product.description())}"
           th:text="${product.description()}">상품 설명</p>
        <p class="product-detail__desc"
           th:unless="${product.description() != null and !#strings.isEmpty(product.description())}"
           th:text="#{shopDetail.defaultDesc(${product.artistName()})}">
          상품 설명
        </p>

        <div class="product-detail__options" th:unless="${product.soldOut()}">
          <th:block th:with="selectable=${product.variants().?[selectable()]}">
            <th:block th:if="${selectable != null and !#lists.isEmpty(selectable)}">
              <label for="variantSelect" th:text="#{shopDetail.optionLabel}">옵션</label>
              <select class="form-select" id="variantSelect" style="max-width:240px;margin-bottom:10px;">
                <option th:each="v : ${selectable}"
                        th:value="${v.id()}"
                        th:disabled="${v.soldOut()}"
                        th:attr="data-stock=${v.stockQuantity()}"
                        th:text="${v.label() + (v.soldOut() ? #messages.msg('shopDetail.optionSoldOut') : (v.showOptionStockHint() ? #messages.msg('shopDetail.optionStockHint', v.stockQuantity()) : ''))}">
                  S
                </option>
              </select>
            </th:block>
            <input th:if="${selectable == null or #lists.isEmpty(selectable)}"
                   type="hidden" id="variantSelect"
                   th:value="${!#lists.isEmpty(product.variants()) ? product.variants().get(0).id() : ''}" />
          </th:block>
          <label for="qty" th:text="#{shopDetail.quantityLabel}">수량</label>
          <input class="form-input" id="qty" name="quantity" type="number" min="1"
                 value="1" style="max-width:120px;" />
          <p class="text-xs text-muted mt-8" th:text="#{shopDetail.quantityHint}">선택한 옵션 재고 범위 내에서 주문할 수 있습니다.</p>
        </div>

        <div class="stack">
          <button type="button" id="addToCartBtn" class="btn btn--primary btn--block btn--lg"
                  th:disabled="${product.soldOut()}"
                  th:text="${product.soldOut()} ? #{shop.soldOut} : #{shopDetail.addToCart}">장바구니 담기</button>
          <form id="buyNowForm" th:action="@{/shop/products/{id}/buy(id=${product.id()})}" method="post"
                th:unless="${product.soldOut()}">
            <input type="hidden" name="from" th:value="${fromCommunity} ? 'community' : 'global'" />
            <input type="hidden" name="variantProductId" id="buyVariantProductId" value="" />
            <input type="hidden" name="quantity" id="buyQty" value="1" />
            <button type="submit" class="btn btn--accent btn--block" th:text="#{shopDetail.buyNow}">바로 구매</button>
          </form>
          <button type="button" class="btn btn--accent btn--block" disabled
                  th:if="${product.soldOut()}" th:text="#{shopDetail.soldOutButton}">품절</button>
          <a class="btn btn--ghost btn--block"
             th:if="${product.officialUrl() != null and !#strings.isEmpty(product.officialUrl())}"
             th:href="${product.officialUrl()}"
             target="_blank" rel="noopener noreferrer" th:text="#{shopDetail.officialSite}">공식 판매처</a>
          <a class="btn btn--ghost btn--block"
             th:href="@{${productCommunityUrl}}"
             th:text="#{shopDetail.communityLink(${product.artistName()})}">커뮤니티로</a>
        </div>
      </div>
    </article>
  </main>

  <script th:inline="javascript">
    window.__WEPLANET_JOINED_ARTISTS__ = /*[[${joinedArtists}]]*/ [];
    window.__WEPLANET_OTHER_ARTISTS__ = /*[[${otherCommunities}]]*/ [];
    window.__WEPLANET_ARTISTS__ = window.__WEPLANET_JOINED_ARTISTS__;
    window.__SHOP_GOODS_ID__ = /*[[${product.id()}]]*/ '';
    // 샵 공용 스크립트(shop.js)가 쓰는 화면 언어 문구 - 원래 한국어 문자열은 각 값의 fallback으로 남겨둠
    window.__SHOP_MSG__ = {
      addedToCart: /*[[#{shop.js.addedToCart}]]*/ "장바구니에 담았습니다.",
      addToCartFailed: /*[[#{shop.js.addToCartFailed}]]*/ "담기에 실패했습니다.",
      addToCartError: /*[[#{shop.js.addToCartError}]]*/ "장바구니에 담지 못했습니다.",
      paymentModuleLoadError: /*[[#{shop.js.paymentModuleLoadError}]]*/ "결제 모듈을 불러오지 못했습니다.",
      buyNowFailed: /*[[#{shop.js.buyNowFailed}]]*/ "구매에 실패했습니다.",
      paymentCancelled: /*[[#{shop.js.paymentCancelled}]]*/ "결제를 취소했어요.",
      checkoutPrepareFailed: /*[[#{shop.js.checkoutPrepareFailed}]]*/ "결제 준비에 실패했습니다.",
      membershipBadge: /*[[#{shop.membershipBadge}]]*/ "멤버십",
      decreaseQtyAria: /*[[#{shopCart.decreaseQtyAria}]]*/ "수량 줄이기",
      increaseQtyAria: /*[[#{shopCart.increaseQtyAria}]]*/ "수량 늘리기",
      deleteAria: /*[[#{shopCart.deleteAria}]]*/ "삭제"
    };
  </script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:replace="~{fragments/toss-i18n :: tossI18n}"></script>
  <script th:src="@{/js/commerce-toss.js}"></script>
  <script th:src="@{/js/shop.js}"></script>
  <script>
    (function () {
      var goodsId = window.__SHOP_GOODS_ID__;
      var variantEl = document.getElementById("variantSelect");
      var qtyEl = document.getElementById("qty");
      var buyPid = document.getElementById("buyVariantProductId");
      var buyQty = document.getElementById("buyQty");
      var addBtn = document.getElementById("addToCartBtn");

      function cartProductId() {
        if (!variantEl || !variantEl.value) return goodsId;
        return goodsId + ":" + variantEl.value;
      }

      function sync() {
        if (buyPid) buyPid.value = cartProductId();
        if (buyQty && qtyEl) buyQty.value = qtyEl.value || "1";
      }

      if (variantEl) variantEl.addEventListener("change", sync);
      if (qtyEl) qtyEl.addEventListener("change", sync);
      sync();

      if (addBtn && !addBtn.disabled) {
        addBtn.addEventListener("click", function () {
          var qty = qtyEl ? parseInt(qtyEl.value, 10) || 1 : 1;
          if (window.WePlaNetShop && WePlaNetShop.addProductToCart) {
            WePlaNetShop.addProductToCart(cartProductId(), qty, addBtn);
          } else if (window.WePlaNetShop && WePlaNetShop.addToCart) {
            WePlaNetShop.addToCart(cartProductId(), qty, addBtn);
          }
        });
      }

      var buyForm = document.getElementById("buyNowForm");
      if (buyForm && window.WePlaNetShop && WePlaNetShop.buyNowProduct) {
        buyForm.addEventListener("submit", function (e) {
          e.preventDefault();
          sync();
          var submitBtn = buyForm.querySelector('button[type="submit"]');
          WePlaNetShop.buyNowProduct(buyForm, submitBtn);
        });
      }
    })();
  </script>
</body>
</html>
