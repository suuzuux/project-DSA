<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WePlaNet – 휴면계정 해제</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
  <div class="auth-card" style="width:min(100%,480px);">
    <a class="auth-card__back" href="/login">← 로그인으로</a>
    <h1 class="auth-card__title">휴면계정 해제</h1>
    <p class="text-sm text-muted" th:if="${!socialFlow}">아이디를 입력하고 인증코드를 받으면, 가입 시 등록된 이메일로 인증코드를 보내드려요.</p>
    <p class="text-sm text-muted" th:if="${socialFlow}">휴면 상태인 계정이에요. 가입 시 등록된 이메일로 인증코드를 보내드렸어요.</p>

    <p th:if="${errorMessage}" class="text-sm" style="color:#c45c26;" th:text="${errorMessage}"></p>

    <form id="reactivateForm" method="post" th:action="@{/login/reactivate/verify}">
      <!-- 아이디 (로컬 플로우만 - 소셜 플로우는 세션에 대상이 이미 특정돼 있음) -->
      <div class="form-group" th:unless="${socialFlow}">
        <label class="form-label" for="username">아이디</label>
        <div class="form-row">
          <input class="form-input" type="text" name="username" id="username" placeholder="아이디 입력" autocomplete="username" required />
          <button type="button" class="btn btn--ghost btn--sm" id="sendCodeBtn">인증코드 받기</button>
        </div>
        <p class="text-xs" id="sendCodeMsg" style="margin-top:6px;"></p>
      </div>

      <!-- 인증코드 (전송 전에는 숨김) -->
      <div class="form-group" id="codeGroup" style="display:none;">
        <label class="form-label" for="code">인증코드</label>
        <div class="form-row" style="align-items:center;gap:8px;">
          <input class="form-input" type="text" name="code" id="code" maxlength="6" placeholder="인증번호 6자리" autocomplete="one-time-code" required />
          <span class="text-xs" id="codeTimer" style="min-width:40px;color:var(--wp-ink-soft);"></span>
        </div>
        <p class="text-xs" id="codeMsg" style="margin-top:6px;"></p>
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg mt-16" id="submitBtn">해제하고 로그인</button>
    </form>
  </div>
  <script th:inline="javascript">
    (function () {
      "use strict";
      const socialFlow = /*[[${socialFlow}]]*/ false;

      const usernameInput = document.getElementById("username");
      const sendBtn = document.getElementById("sendCodeBtn");
      const sendMsg = document.getElementById("sendCodeMsg");
      const codeGroup = document.getElementById("codeGroup");
      const codeInput = document.getElementById("code");
      const codeMsg = document.getElementById("codeMsg");
      const timerEl = document.getElementById("codeTimer");
      const submitBtn = document.getElementById("submitBtn");
      const form = document.getElementById("reactivateForm");

      let timerInterval = null;
      let codeExpired = false;
      const CODE_VALID_SECONDS = 5 * 60; // 서버 SignupEmailVerificationService의 EXPIRE_MINUTES(5분)와 맞춤

      submitBtn.disabled = true;

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      }

      function startTimer() {
        clearInterval(timerInterval);
        codeExpired = false;
        let remaining = CODE_VALID_SECONDS;
        codeInput.disabled = false;
        submitBtn.disabled = false;
        timerEl.textContent = formatTime(remaining);
        timerInterval = setInterval(function () {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timerInterval);
            codeExpired = true;
            timerEl.textContent = "00:00";
            codeInput.disabled = true;
            submitBtn.disabled = true;
            codeMsg.textContent = "인증 시간이 만료되었습니다. 인증코드를 다시 받아주세요.";
            codeMsg.style.color = "#c45c26";
            return;
          }
          timerEl.textContent = formatTime(remaining);
        }, 1000);
      }

      function requestCode(username) {
        sendBtn.disabled = true;
        sendBtn.textContent = "발송 중...";
        return fetch("/login/reactivate/code", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: username ? "username=" + encodeURIComponent(username) : ""
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            sendMsg.textContent = data.message;
            sendMsg.style.color = data.success ? "#2f8f5b" : "#c45c26";
            if (data.success) {
              codeGroup.style.display = "block";
              codeInput.value = "";
              codeInput.focus();
              codeMsg.textContent = "";
              startTimer();
            }
            return data.success;
          })
          .catch(function () {
            sendMsg.textContent = "이메일 발송 중 오류가 발생했습니다.";
            sendMsg.style.color = "#c45c26";
            return false;
          })
          .finally(function () {
            sendBtn.disabled = false;
            sendBtn.textContent = "인증코드 받기";
          });
      }

      if (!socialFlow) {
        sendBtn.addEventListener("click", function () {
          const username = usernameInput.value.trim();
          if (!username) {
            sendMsg.textContent = "아이디를 먼저 입력해주세요.";
            sendMsg.style.color = "#c45c26";
            return;
          }
          requestCode(username);
        });
      } else {
        requestCode(null);
      }

      form.addEventListener("submit", function (e) {
        if (codeGroup.style.display === "none") {
          e.preventDefault();
          codeMsg.textContent = "먼저 인증코드를 받아주세요.";
          codeMsg.style.color = "#c45c26";
          return;
        }
        if (codeExpired) {
          e.preventDefault();
          codeMsg.textContent = "인증 시간이 만료되었습니다. 인증코드를 다시 받아주세요.";
          codeMsg.style.color = "#c45c26";
        }
      });
    })();
  </script>
</body>
</html>
