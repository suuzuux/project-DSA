<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팬 채팅방</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <!-- SockJS/Stomp : 웹소켓 연결과 실시간 메시지 송수신을 도와주는 외부 자바스크립트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
</header>

<div class="container container--narrow section">
    <h1 class="section__title">아티스트 <span th:text="${artistId}"></span>번과의 채팅 (팬 화면)</h1>
    <p class="text-muted" style="margin:8px 0 16px;">오늘 남은 메시지 수: <b id="remainingCount" th:text="${remaining}"></b></p>

    <div id="messages" style="border:1px solid var(--wp-hairline);border-radius:var(--wp-radius);
         background:var(--wp-surface);padding:14px;min-height:280px;max-height:420px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;"></div>

    <!--
        hidden : 이 태그를 화면에서 숨기는 순수 HTML 속성 (CSS의 display:none과 달리 style이 아님).
        자바스크립트에서 warningBanner.hidden = true/false 로 보이거나 숨길 수 있음
    -->
    <p id="warningBanner" hidden class="form-error" style="display:block;"></p>

    <div style="display:flex;gap:8px;">
        <input type="text" id="messageInput" class="form-input" placeholder="메시지를 입력하세요">
        <button id="sendButton" class="btn btn--primary">보내기</button>
    </div>
</div>

<!-- 와이어프레임 스타일 채팅 말풍선 - 내가 보낸 메시지는 오른쪽(민트), 상대 메시지는 왼쪽(연회색) -->
<style>
    .chat-row { display: flex; gap: 8px; max-width: 80%; }
    .chat-row--me { align-self: flex-end; flex-direction: row-reverse; }
    .chat-row--other { align-self: flex-start; }
    .chat-bubble { padding: 8px 12px; border-radius: 14px; font-size: var(--wp-fs-sm); }
    .chat-row--me .chat-bubble { background: var(--wp-brand); color: #fff; border-bottom-right-radius: 4px; }
    .chat-row--other .chat-bubble { background: var(--wp-paper); color: var(--wp-ink); border-bottom-left-radius: 4px; }
    .chat-meta { font-size: 11px; color: var(--wp-muted); margin-bottom: 3px; }
    .chat-row--me .chat-meta { text-align: right; }
</style>

<script th:inline="javascript">
    // Thymeleaf가 서버에서 넘겨준 실제 값(아티스트/팬 번호)을 자바스크립트 변수로 바꿔치기해줌
    const artistId = /*[[${artistId}]]*/ 0;
    const fanId = /*[[${fanId}]]*/ 0;

    // 웹소켓 연결 시작 (SockJS는 흉내내기용 안전장치, Stomp는 그 위에서 채널 규칙을 관리해주는 도구)
    const socket = new SockJS('/ws-chat');
    const stompClient = Stomp.over(socket);

    // 채팅 메시지 하나를 화면(messages) 밑에 이어붙이는 함수
    // 내가 보낸 메시지(senderId === fanId)는 오른쪽 말풍선, 상대(아티스트)가 보낸 메시지는 왼쪽 말풍선으로 그림
    function appendMessage(data) {
        const div = document.getElementById('messages');
        const isMe = data.senderId === fanId;
        // 서버가 보내주는 createdAt은 "2026-08-24T15:43:21.123456" 형식의 문자열.
        // new Date(...)로 파싱하면 브라우저마다 마이크로초 자릿수 처리가 달라질 수 있어서,
        // 문자열에서 "T" 뒤 시:분만 그대로 잘라 씀 (더 안전함)
        const time = (data.createdAt.split('T')[1] || '').slice(0, 5);

        const row = document.createElement('div');
        row.className = 'chat-row ' + (isMe ? 'chat-row--me' : 'chat-row--other');
        row.innerHTML =
            '<div>' +
            '<div class="chat-meta">' + data.senderNickname + ' · ' + time + '</div>' +
            '<div class="chat-bubble"></div>' +
            '</div>';
        // textContent로 넣는 이유 : 메시지 내용에 우연히 <script> 같은 태그가 섞여도
        // 진짜 태그로 실행되지 않고 화면에 글자 그대로만 보이게 하기 위함 (XSS 방지)
        row.querySelector('.chat-bubble').textContent = data.content;

        div.appendChild(row);
        div.scrollTop = div.scrollHeight; // 항상 최신 메시지가 보이도록 스크롤을 맨 아래로 내림
    }

    // 경고 문구를 잠깐 보여줬다가 몇 초 뒤 자동으로 사라지게 하는 함수 (alert() 팝업 대신 사용)
    let warningTimer = null;

    function showWarning(message) {
        const banner = document.getElementById('warningBanner');
        banner.textContent = '[경고] ' + message;
        banner.hidden = false;

        clearTimeout(warningTimer); // 이전에 걸어둔 "숨기기 예약"이 있으면 취소함
        warningTimer = setTimeout(function () {
            banner.hidden = true;
        }, 3500); // 3.5초 뒤에 자동으로 숨김
    }

    // 서버와 웹소켓 연결이 맺어지면, 이 화면에서 구독(실시간으로 받아볼)할 채널들을 등록함
    stompClient.connect({}, function () {
        // 아티스트가 전체 팬에게 보내는 방송 채널
        stompClient.subscribe('/topic/chat.' + artistId, function (message) {
            appendMessage(JSON.parse(message.body));
        });

        // 나(이 팬)와 아티스트만 볼 수 있는 개인 채널 - 다른 팬은 이 채널을 구독조차 할 수 없음
        stompClient.subscribe('/topic/chat.' + artistId + '.fan.' + fanId, function (message) {
            const data = JSON.parse(message.body);
            appendMessage(data);

            if (data.remaining !== undefined) {
                document.getElementById('remainingCount').textContent = data.remaining;
            }
        });

        // 필터(금칙어)에 걸리거나 한도를 다 써서 거부된 내 메시지에 대한 경고를 받는 채널
        stompClient.subscribe('/topic/chat.error.' + fanId, function (message) {
            const data = JSON.parse(message.body);
            showWarning(data.message);
        });
    });

    // 입력창의 내용을 서버로 전송하는 함수
    function sendMessage() {
        const content = document.getElementById('messageInput').value;
        if (!content) return; // 빈 값이면 전송하지 않음

        // stompClient.send(채널, 헤더, 내용) : 웹소켓으로 서버에 메시지를 보냄.
        // JSON.stringify(...) : 자바스크립트 객체를 문자열로 바꿔서 보냄 (서버의 ChatMessageRequest가 이걸 받아줌)
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            artistId: artistId,
            fanId: fanId,
            senderId: fanId,
            content: content
        }));

        document.getElementById('messageInput').value = ''; // 전송 후 입력창 비움
    }

    document.getElementById('sendButton').addEventListener('click', sendMessage);

    // 입력창에서 엔터 키를 누르면, 버튼을 누른 것과 똑같이 전송되게 함
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
