<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{artistChat.pageTitle}">아티스트 채팅방</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
</header>

<div class="container container--narrow section">
    <div class="section__head">
        <h1 class="section__title" th:text="#{artistChat.heading}">내 채팅방 (아티스트 화면)</h1>
        <button id="aiFanButton" type="button" class="btn btn--soft btn--sm" th:text="#{artistChat.aiFanButton}">AI 팬 인사 받기</button>
    </div>

    <div id="messages" style="border:1px solid var(--wp-hairline);border-radius:var(--wp-radius);
         background:var(--wp-surface);padding:14px;min-height:280px;max-height:420px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;"></div>

    <!-- hidden 속성으로 숨긴다. -->
    <p id="warningBanner" hidden class="form-error" style="display:block;"></p>

    <div style="display:flex;gap:8px;">
        <input type="text" id="messageInput" class="form-input" th:placeholder="#{artistChat.messagePlaceholder}" placeholder="팬들에게 메시지를 입력하세요">
        <button id="sendButton" class="btn btn--primary" th:text="#{artistChat.sendButton}">보내기</button>
    </div>
</div>

<!-- 채팅 말풍선 - 내 메시지 오른쪽, 팬 메시지 왼쪽 -->
<style>
    .chat-row { display: flex; gap: 8px; max-width: 80%; }
    .chat-row--me { align-self: flex-end; flex-direction: row-reverse; }
    .chat-row--other { align-self: flex-start; }
    .chat-bubble { padding: 8px 12px; border-radius: 14px; font-size: var(--wp-fs-sm); }
    .chat-row--me .chat-bubble { background: var(--wp-brand); color: #fff; border-bottom-right-radius: 4px; }
    .chat-row--other .chat-bubble { background: var(--wp-paper); color: var(--wp-ink); border-bottom-left-radius: 4px; }
    .chat-meta { font-size: 11px; color: var(--wp-muted); margin-bottom: 3px; }
    .chat-row--me .chat-meta { text-align: right; }
</style>

<script th:inline="javascript">
    const artistId = /*[[${artistId}]]*/ 0;
    // 지난 대화 이력
    const history = /*[[${history}]]*/ [];

    // 화면 언어 문구 (한국어는 fallback)
    const MSG = {
        warningPrefix: /*[[#{artistChat.warningPrefix}]]*/ "[경고] {0}"
    };

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(proto + '//' + location.host + '/ws-chat');
    const stompClient = Stomp.over(socket);

    // 내 메시지는 오른쪽, 팬 메시지는 왼쪽
    function appendMessage(data) {
        const div = document.getElementById('messages');
        const isMe = data.senderId === artistId;
        const time = (data.createdAt.split('T')[1] || '').slice(0, 5);

        const row = document.createElement('div');
        row.className = 'chat-row ' + (isMe ? 'chat-row--me' : 'chat-row--other');
        row.innerHTML =
            '<div>' +
            '<div class="chat-meta">' + data.senderNickname + ' · ' + time + '</div>' +
            '<div class="chat-bubble"></div>' +
            '</div>';
        row.querySelector('.chat-bubble').textContent = data.content;

        div.appendChild(row);
        div.scrollTop = div.scrollHeight;
    }

    // 경고 문구를 잠깐 보여주고 숨긴다.
    let warningTimer = null;

    function showWarning(message) {
        const banner = document.getElementById('warningBanner');
        banner.textContent = MSG.warningPrefix.replace('{0}', message);
        banner.hidden = false;

        clearTimeout(warningTimer);
        warningTimer = setTimeout(function () {
            banner.hidden = true;
        }, 3500);
    }

    // 지난 이력을 먼저 그린다.
    if (Array.isArray(history)) {
        history.forEach(appendMessage);
    }

    stompClient.connect({}, function () {
        // 내 방송 메시지가 되돌아오는 채널
        stompClient.subscribe('/topic/chat.' + artistId, function (message) {
            appendMessage(JSON.parse(message.body));
        });

        // 팬 메시지 중 30%만 오는 채널 (도배 방지)
        stompClient.subscribe('/topic/chat.' + artistId + '.artistFeed', function (message) {
            appendMessage(JSON.parse(message.body));
        });

        // 거부된 내 메시지 경고 채널
        stompClient.subscribe('/topic/chat.error.' + artistId, function (message) {
            const data = JSON.parse(message.body);
            showWarning(data.message);
        });
    });

    function sendBroadcast() {
        const content = document.getElementById('messageInput').value;
        if (!content) return;

        // fanId 가 null 이면 아티스트 방 메시지 (저장 후 AI 팬이 답장)
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            artistId: artistId,
            fanId: null,
            senderId: artistId,
            content: content
        }));

        document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendButton').addEventListener('click', sendBroadcast);

    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendBroadcast();
        }
    });

    // AI 팬 인사 버튼 (fetch 요청, 답장은 artistFeed 로 옴)
    document.getElementById('aiFanButton').addEventListener('click', function () {
        fetch('/chat/room/artist/ai-fan?artistId=' + artistId, {
            method: 'POST'
        });
    });
</script>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
