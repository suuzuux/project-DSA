<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>금칙어 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body>

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
</header>

<div class="container container--narrow section">
    <h1 class="section__title" style="margin-bottom:16px;">금칙어 관리 (관리자 전용)</h1>

    <form id="keywordAddForm" style="display:flex;gap:8px;align-items:center;margin-bottom:16px;">
        <input type="hidden" name="testUserId" th:value="${testUserId}">
        <label class="form-label" style="margin:0;white-space:nowrap;">등록할 금칙어</label>
        <input type="text" name="keyword" class="form-input" placeholder="예: 바보">
        <button type="submit" class="btn btn--primary btn--sm">등록</button>
    </form>

    <!-- 등록/삭제 후 페이지 전체를 새로고침하지 않고, 이 목록 부분(fragment)만 fetch로 다시 받아와서 교체함 -->
    <div id="keywordListArea" th:fragment="keywordListFragment">
        <div class="table-wrap" th:if="${not #lists.isEmpty(keywords)}">
            <table class="data-table">
                <tr>
                    <th>금칙어</th>
                    <th>삭제</th>
                </tr>
                <tr th:each="kw : ${keywords}">
                    <td th:text="${kw.keyword}"></td>
                    <td>
                        <form class="keyword-delete-form" th:action="@{/chat/admin/keywords/{id}/delete(id=${kw.id})}"
                              method="post">
                            <input type="hidden" name="testUserId" th:value="${testUserId}">
                            <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>

        <p th:if="${#lists.isEmpty(keywords)}" class="text-muted"><i>등록된 금칙어가 없습니다.</i></p>
    </div>
</div>

<script th:inline="javascript">
    // 등록/삭제 둘 다 페이지 전체 새로고침 없이, 목록 부분(#keywordListArea)만 fetch로 다시 받아와서 교체함.
    // 등록 폼은 하나뿐이지만, 삭제 폼은 금칙어 개수만큼 여러 개 생기고 목록이 갱신될 때마다 새로 만들어지므로
    // document 전체에 이벤트를 걸어두고 "어떤 폼이 제출됐는지"를 안에서 확인하는 방식(이벤트 위임)을 씀
    document.addEventListener('submit', function (e) {
        const form = e.target;

        if (form.id !== 'keywordAddForm' && !form.classList.contains('keyword-delete-form')) {
            return; // 이 화면과 관련 없는 다른 폼이면 그냥 지나감
        }

        e.preventDefault();

        fetch(form.action, {
            method: 'POST',
            headers: {'X-Requested-With': 'fetch'},
            body: new URLSearchParams(new FormData(form))
        })
            .then(function (response) {
                return response.text();
            })
            .then(function (html) {
                document.getElementById('keywordListArea').outerHTML = html;

                if (form.id === 'keywordAddForm') {
                    form.reset(); // 등록 후 입력창을 비워줌
                }
            });
    });

    // 등록 폼(<form id="keywordAddForm">)에는 action 속성을 안 적어뒀으므로, 여기서 직접 지정해줌
    document.getElementById('keywordAddForm').action = '/chat/admin/keywords';
</script>

</body>
</html>
