<!DOCTYPE html>
<html lang="ko"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>채팅·금칙어 관리 | WePlaNet ADMIN</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}" />

    <link rel="stylesheet"
          th:href="@{/css/portal.css}" />
</head>

<body>
<div class="portal-shell">

    <aside class="portal-sidebar portal-sidebar--admin">
        <div class="portal-sidebar__org">
            <div class="agency">WEPLANET</div>
            <div class="artist">ADMIN</div>
        </div>

        <nav class="portal-sidebar__nav">
            <a th:href="@{/admin/dashboard}">
                📊 통합 대시보드
            </a>

            <a th:href="@{/admin/agencies}">
                🏢 소속사 관리
            </a>

            <a th:href="@{/admin/artists}">
                🎤 아티스트 관리
            </a>

            <a th:href="@{/admin/users}">
                👥 전체 회원
            </a>

            <a th:href="@{/admin/reports}">
                🚩 통합 신고 · 제재
            </a>

            <a th:href="@{/admin/notices}">
                📢 전체 공지
            </a>

            <a class="is-active"
               th:href="@{/admin/communities}">
                💬 커뮤니티 운영
            </a>

            <a th:href="@{/admin/logs}">
                🧾 관리자 로그
            </a>
        </nav>

        <div class="portal-sidebar__footer">
            <form th:action="@{/admin/logout}"
                  method="post"
                  style="margin:0;">

                <button type="submit"
                        class="btn">
                    🚪 로그아웃
                </button>
            </form>
        </div>
    </aside>

    <main class="portal-main">
        <div class="portal-main__head">
            <div>
                <h1>채팅·금칙어 관리</h1>

                <p class="text-sm text-muted">
                    채팅과 라이브 댓글에서 사용할 수 없는 단어를 관리합니다.
                </p>
            </div>

            <a class="btn btn--ghost btn--sm"
               th:href="@{/admin/communities}">
                ← 커뮤니티 운영
            </a>
        </div>

        <section class="panel">
            <div class="panel__head">
                <h2 class="panel__title">새 금칙어 등록</h2>

                <span class="text-xs text-muted">
          최대 50자
        </span>
            </div>

            <form id="keywordAddForm"
                  th:action="@{/chat/admin/keywords}"
                  method="post"
                  style="display:flex;
                   gap:8px;
                   align-items:center;">

                <label class="form-label"
                       for="newKeyword"
                       style="margin:0;
                      white-space:nowrap;">
                    금칙어
                </label>

                <input id="newKeyword"
                       type="text"
                       name="keyword"
                       class="form-input"
                       placeholder="등록할 금칙어 입력"
                       maxlength="50"
                       required
                       autocomplete="off" />

                <button type="submit"
                        class="btn btn--primary btn--sm">
                    등록
                </button>
            </form>
        </section>

        <section class="panel mt-16">
            <div class="panel__head">
                <h2 class="panel__title">등록된 금칙어</h2>
            </div>

            <div id="keywordListArea"
                 th:fragment="keywordListFragment">

                <p th:if="${keywordMessage}"
                   class="text-sm"
                   style="color:#63704a;
                  margin-bottom:12px;"
                   th:text="${keywordMessage}">
                    처리되었습니다.
                </p>

                <p th:if="${keywordError}"
                   class="text-sm keyword-error"
                   style="color:#c45c26;
                  margin-bottom:12px;"
                   th:text="${keywordError}">
                    오류가 발생했습니다.
                </p>

                <div class="table-wrap"
                     th:if="${not #lists.isEmpty(keywords)}">

                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>금칙어</th>
                            <th>관리</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="keyword, status : ${keywords}">
                            <td th:text="${status.count}">
                                1
                            </td>

                            <td>
                                <form class="keyword-update-form"
                                      th:action="@{/chat/admin/keywords/{id}/update(
                          id=${keyword.id}
                      )}"
                                      method="post"
                                      style="display:flex;
                             align-items:center;
                             gap:8px;">

                                    <input type="text"
                                           name="keyword"
                                           class="form-input"
                                           th:value="${keyword.keyword}"
                                           maxlength="50"
                                           required
                                           autocomplete="off" />

                                    <button type="submit"
                                            class="btn btn--ghost btn--sm">
                                        수정
                                    </button>
                                </form>
                            </td>

                            <td>
                                <form class="keyword-delete-form"
                                      th:action="@{/chat/admin/keywords/{id}/delete(
                          id=${keyword.id}
                      )}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn--ghost btn--sm">
                                        삭제
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <p th:if="${#lists.isEmpty(keywords)}"
                   class="text-sm text-muted">
                    등록된 금칙어가 없습니다.
                </p>
            </div>
        </section>
    </main>
</div>

<script>
    document.addEventListener('submit', function (event) {
      const form = event.target;

      const isAddForm =
          form.id === 'keywordAddForm';

      const isUpdateForm =
          form.classList.contains(
              'keyword-update-form'
          );

      const isDeleteForm =
          form.classList.contains(
              'keyword-delete-form'
          );

      if (!isAddForm
          && !isUpdateForm
          && !isDeleteForm) {
        return;
      }

      event.preventDefault();

      if (isDeleteForm
          && !window.confirm(
              '이 금칙어를 삭제할까요?'
          )) {
        return;
      }

      const submitButton =
          form.querySelector(
              'button[type="submit"]'
          );

      if (submitButton) {
        submitButton.disabled = true;
      }

      fetch(form.action, {
        method: 'POST',

        headers: {
          'X-Requested-With': 'fetch'
        },

        body: new URLSearchParams(
            new FormData(form)
        )
      })
          .then(function (response) {
            if (!response.ok) {
              throw new Error(
                  '요청 처리에 실패했습니다.'
              );
            }

            return response.text();
          })
          .then(function (html) {
            const listArea =
                document.getElementById(
                    'keywordListArea'
                );

            listArea.outerHTML = html;

            const hasError =
                document.querySelector(
                    '#keywordListArea .keyword-error'
                );

            if (isAddForm && !hasError) {
              form.reset();
            }
          })
          .catch(function (error) {
            window.alert(error.message);
          })
          .finally(function () {
            if (submitButton) {
              submitButton.disabled = false;
            }
          });
    });
</script>
</body>
</html>
