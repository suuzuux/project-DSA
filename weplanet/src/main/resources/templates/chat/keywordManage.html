<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title th:text="#{admin.keyword.pageTitle}">채팅·금칙어 관리 | WePlaNet ADMIN</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}" />

    <link rel="stylesheet"
          th:href="@{/css/portal.css}" />
</head>

<body>
<div class="portal-shell">

    <aside class="portal-sidebar portal-sidebar--admin">
        <div class="portal-sidebar__org">
            <div class="agency">WEPLANET</div>
            <div class="artist">ADMIN</div>
        </div>

        <nav class="portal-sidebar__nav">
            <!-- 하위 메뉴 묶음 - 오른쪽 화살표로 열고 닫는다 (details/summary, JS 없음) -->
            <details class="portal-sidebar__group">
                <summary>
                    <a th:href="@{/admin/dashboard}" th:text="|📊 #{admin.nav.dashboard}|">📊 통합 대시보드</a>
                    <span class="portal-sidebar__caret" aria-label="하위 메뉴 열기/닫기" th:aria-label="#{admin.nav.submenuToggle}"></span>
                </summary>
                <a class="portal-sidebar__sub" th:href="@{/admin/banners}" th:text="|🖼 #{admin.nav.banners}|">🖼 배너 영역 관리</a>
            </details>
            <details class="portal-sidebar__group">
                <summary>
                    <a th:href="@{/admin/agencies}" th:text="|🏢 #{admin.nav.agencies}|">🏢 소속사 관리</a>
                    <span class="portal-sidebar__caret" aria-label="하위 메뉴 열기/닫기" th:aria-label="#{admin.nav.submenuToggle}"></span>
                </summary>
                <a class="portal-sidebar__sub" th:href="@{/admin/applications}" th:text="|📥 #{admin.nav.applications}|">📥 등록 신청</a>
            </details>
            <a th:href="@{/admin/artists}" th:text="|🎤 #{admin.nav.artists}|">🎤 아티스트 관리</a>
            <a th:href="@{/admin/users}" th:text="|👥 #{admin.nav.users}|">👥 전체 회원</a>
            <a th:href="@{/admin/reports}" th:text="|🚩 #{admin.nav.reports}|">🚩 통합 신고 · 제재</a>
            <a th:href="@{/admin/notices}" th:text="|📢 #{admin.nav.notices}|">📢 전체 공지</a>
            <a class="is-active" th:href="@{/admin/communities}" th:text="|🎁 #{admin.nav.projects}|">🎁 프로젝트 운영</a>
            <details class="portal-sidebar__group">
                <summary>
                    <a th:href="@{/admin/events/hashtag}" th:text="|🎉 #{admin.nav.events}|">🎉 이벤트</a>
                    <span class="portal-sidebar__caret" aria-label="하위 메뉴 열기/닫기" th:aria-label="#{admin.nav.submenuToggle}"></span>
                </summary>
                <a class="portal-sidebar__sub" th:href="@{/admin/events/hashtag}" th:text="|🔥 #{admin.nav.hashtagEvent}|">🔥 해시태그 총공</a>
            </details>
            <a th:href="@{/admin/logs}" th:text="|🧾 #{admin.nav.logs}|">🧾 관리자 로그</a>
        </nav>

        <div class="portal-sidebar__footer">
            <a class="btn" th:href="@{/}" th:text="|🏠 #{admin.nav.mainPage}|">🏠 메인 페이지 이동</a>
            <form th:action="@{/admin/logout}"
                  method="post"
                  style="margin:0;">

                <button type="submit"
                        class="btn"
                        th:text="|🚪 #{common.logout}|">
                    🚪 로그아웃
                </button>
            </form>
        </div>
    </aside>

    <main class="portal-main">
        <div class="portal-main__head">
            <div>
                <h1 th:text="#{admin.keyword.heading}">채팅·금칙어 관리</h1>

                <p class="text-sm text-muted" th:text="#{admin.keyword.subtitle}">
                    채팅과 라이브 댓글에서 사용할 수 없는 단어를 관리합니다.
                </p>
            </div>

            <a class="btn btn--ghost btn--sm"
               th:href="@{/admin/communities}"
               th:text="|← #{admin.nav.projects}|">
                ← 프로젝트 운영
            </a>
        </div>

        <section class="panel">
            <div class="panel__head">
                <h2 class="panel__title" th:text="#{admin.keyword.addTitle}">새 금칙어 등록</h2>

                <span class="text-xs text-muted" th:text="#{admin.keyword.maxLength}">
          최대 50자
        </span>
            </div>

            <form id="keywordAddForm"
                  th:action="@{/chat/admin/keywords}"
                  method="post"
                  style="display:flex;
                   gap:8px;
                   align-items:center;">

                <label class="form-label"
                       for="newKeyword"
                       style="margin:0;
                      white-space:nowrap;"
                       th:text="#{admin.keyword.label}">
                    금칙어
                </label>

                <input id="newKeyword"
                       type="text"
                       name="keyword"
                       class="form-input"
                       placeholder="등록할 금칙어 입력"
                       th:placeholder="#{admin.keyword.placeholder}"
                       maxlength="50"
                       required
                       autocomplete="off" />

                <button type="submit"
                        class="btn btn--primary btn--sm"
                        th:text="#{admin.keyword.add}">
                    등록
                </button>
            </form>
        </section>

        <section class="panel mt-16">
            <div class="panel__head">
                <h2 class="panel__title" th:text="#{admin.keyword.listTitle}">등록된 금칙어</h2>
            </div>

            <div id="keywordListArea"
                 th:fragment="keywordListFragment">

                <p th:if="${keywordMessage}"
                   class="text-sm"
                   style="color:#63704a;
                  margin-bottom:12px;"
                   th:text="${keywordMessage}">
                    처리되었습니다.
                </p>

                <p th:if="${keywordError}"
                   class="text-sm keyword-error"
                   style="color:#c45c26;
                  margin-bottom:12px;"
                   th:text="${keywordError}">
                    오류가 발생했습니다.
                </p>

                <div class="table-wrap"
                     th:if="${not #lists.isEmpty(keywords)}">

                    <table class="data-table">
                        <thead>
                        <tr>
                            <th th:text="#{admin.keyword.col.no}">번호</th>
                            <th th:text="#{admin.keyword.label}">금칙어</th>
                            <th th:text="#{admin.common.manage}">관리</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="keyword, status : ${keywords}">
                            <td th:text="${status.count}">
                                1
                            </td>

                            <td>
                                <form class="keyword-update-form"
                                      th:action="@{/chat/admin/keywords/{id}/update(
                          id=${keyword.id}
                      )}"
                                      method="post"
                                      style="display:flex;
                             align-items:center;
                             gap:8px;">

                                    <input type="text"
                                           name="keyword"
                                           class="form-input"
                                           th:value="${keyword.keyword}"
                                           maxlength="50"
                                           required
                                           autocomplete="off" />

                                    <button type="submit"
                                            class="btn btn--ghost btn--sm"
                                            th:text="#{common.edit}">
                                        수정
                                    </button>
                                </form>
                            </td>

                            <td>
                                <form class="keyword-delete-form"
                                      th:action="@{/chat/admin/keywords/{id}/delete(
                          id=${keyword.id}
                      )}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn--ghost btn--sm"
                                            th:text="#{common.delete}">
                                        삭제
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <p th:if="${#lists.isEmpty(keywords)}"
                   class="text-sm text-muted"
                   th:text="#{admin.keyword.empty}">
                    등록된 금칙어가 없습니다.
                </p>
            </div>
        </section>
    </main>
</div>

<script th:inline="javascript">
    const keywordDeleteConfirmMessage =
        /*[[#{admin.keyword.deleteConfirm}]]*/ '이 금칙어를 삭제할까요?';

    const keywordRequestFailedMessage =
        /*[[#{admin.keyword.requestFailed}]]*/ '요청 처리에 실패했습니다.';

    document.addEventListener('submit', function (event) {
      const form = event.target;

      const isAddForm =
          form.id === 'keywordAddForm';

      const isUpdateForm =
          form.classList.contains(
              'keyword-update-form'
          );

      const isDeleteForm =
          form.classList.contains(
              'keyword-delete-form'
          );

      if (!isAddForm
          && !isUpdateForm
          && !isDeleteForm) {
        return;
      }

      event.preventDefault();

      if (isDeleteForm
          && !window.confirm(
              keywordDeleteConfirmMessage
          )) {
        return;
      }

      const submitButton =
          form.querySelector(
              'button[type="submit"]'
          );

      if (submitButton) {
        submitButton.disabled = true;
      }

      fetch(form.action, {
        method: 'POST',

        headers: {
          'X-Requested-With': 'fetch'
        },

        body: new URLSearchParams(
            new FormData(form)
        )
      })
          .then(function (response) {
            if (!response.ok) {
              throw new Error(
                  keywordRequestFailedMessage
              );
            }

            return response.text();
          })
          .then(function (html) {
            const listArea =
                document.getElementById(
                    'keywordListArea'
                );

            listArea.outerHTML = html;

            const hasError =
                document.querySelector(
                    '#keywordListArea .keyword-error'
                );

            if (isAddForm && !hasError) {
              form.reset();
            }
          })
          .catch(function (error) {
            window.alert(error.message);
          })
          .finally(function () {
            if (submitButton) {
              submitButton.disabled = false;
            }
          });
    });
</script>
</body>
</html>
