<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    가입 직후 한 번만 뜨는 화면 (AUTH-02).
    카카오/LINE처럼 realName/email을 실제로 못 받는 provider로 "신규가입"한 직후에만 진입한다
    (SocialLoginEntryController.completeProfileForm 참고 - 세션 플래그가 없으면 홈으로 돌려보냄).
    한 번 완료하면(=플래그 삭제) 다음 로그인부터는 다시 뜨지 않는다. DB 스키마 변경 없음(세션 기반).
  -->
  <title>WePlaNet – 회원정보 입력</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
</head>
<body>
<main class="container section" style="max-width:480px;margin:0 auto;">
  <div class="mb-24" style="text-align:center;padding-top:40px;">
    <h1 style="font-size:var(--wp-fs-2xl);font-weight:800;letter-spacing:-0.03em;">회원정보를 확인해주세요</h1>
    <p class="text-sm text-muted mt-8">
      <span th:text="${user.provider.name()}">KAKAO</span> 로그인은 이름/이메일 정보를 제공하지 않아,
      서비스 이용을 위해 딱 한 번만 직접 입력받고 있어요.
    </p>
  </div>

  <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:#c45c26;font-size:var(--wp-fs-xs);margin-bottom:12px;"></p>

  <section class="settings-block">
    <form th:action="@{/social-login/complete-profile}" method="post" id="completeProfileForm">

      <!-- 이름 -->
      <div class="form-group">
        <label class="form-label">이름</label>
        <input class="form-input" type="text" id="realNameInput" name="realName"
               th:value="${user.realName}" required maxlength="50"
               th:readonly="${user.realName != '카카오사용자'}" />

        <!-- 카카오 닉네임이 있어서 그걸 이름 자리에 임시로 채워둔 경우에만 보여주는 빠른 확인 UI.
             "카카오사용자" 고정 문구가 들어간 경우(닉네임 자체가 없었던 경우)는 바로 직접 입력하게 둔다. -->
        <div th:if="${user.realName != '카카오사용자'}" class="mt-8" id="nicknameConfirmRow">
          <p class="text-xs text-muted">
            카카오 닉네임(<strong th:text="${user.realName}">닉네임</strong>)을 이름으로 채워뒀어요.
            본인 이름이 맞으면 그대로 두고 완료를 눌러주세요.
          </p>
          <button type="button" class="btn btn--ghost btn--sm mt-8" id="editRealNameBtn">아니에요, 직접 입력할게요</button>
        </div>
        <p class="form-hint" th:if="${user.realName == '카카오사용자'}">실제 이름을 입력해주세요.</p>
      </div>

      <!-- 이메일 : 카카오는 이메일을 안 주기 때문에 지금 값은 임시로 만들어둔 이메일이다.
           settings.html의 이메일 수정 흐름(6자리 인증코드)과 완전히 동일한 절차를 그대로 재사용한다. -->
      <div class="form-group">
        <label class="form-label">이메일</label>
        <div class="form-row">
          <input class="form-input" type="email" id="emailInput" th:value="${user.email}" disabled />
          <button type="button" class="btn btn--ghost btn--sm" id="emailEditBtn" data-mode="edit">수정하기</button>
        </div>
        <input type="hidden" id="emailHidden" name="email" th:value="${user.email}" />
        <p class="form-hint">지금 이메일은 임시로 생성된 값이에요. 실제로 사용하는 이메일로 바꿔주세요.</p>

        <div class="form-row mt-8" id="emailCodeRow" style="display:none;align-items:center;gap:8px;">
          <input class="form-input" id="emailCode" type="text" maxlength="6" placeholder="인증번호 6자리" autocomplete="one-time-code" />
          <span class="text-xs" id="emailCodeTimer" style="min-width:40px;color:var(--wp-ink-soft);"></span>
          <button type="button" class="btn btn--ghost btn--sm" id="verifyEmailCodeBtn">인증하기</button>
        </div>
        <p class="text-xs" id="emailVerifyMsg" style="margin-top:6px;"></p>
      </div>

      <button type="submit" class="btn btn--primary btn--block mt-16" id="completeSubmitBtn" disabled>완료</button>
      <p class="text-xs text-muted mt-8" id="submitHint" style="text-align:center;">이메일 인증을 완료하면 저장할 수 있어요.</p>
    </form>
  </section>
</main>

<script>
  (function () {
    "use strict";
    var realNameInput = document.getElementById("realNameInput");
    var editRealNameBtn = document.getElementById("editRealNameBtn");
    var nicknameConfirmRow = document.getElementById("nicknameConfirmRow");

    if (editRealNameBtn) {
      editRealNameBtn.addEventListener("click", function () {
        realNameInput.readOnly = false;
        realNameInput.value = "";
        realNameInput.focus();
        nicknameConfirmRow.style.display = "none";
      });
    }

    // ===== 이메일 잠금 → 수정 → 인증 (settings.html과 동일한 방식) =====
    var emailInput = document.getElementById("emailInput");
    var emailHidden = document.getElementById("emailHidden");
    var emailEditBtn = document.getElementById("emailEditBtn");
    var emailCodeRow = document.getElementById("emailCodeRow");
    var emailCodeInput = document.getElementById("emailCode");
    var emailVerifyBtn = document.getElementById("verifyEmailCodeBtn");
    var emailTimerEl = document.getElementById("emailCodeTimer");
    var emailMsg = document.getElementById("emailVerifyMsg");
    var submitBtn = document.getElementById("completeSubmitBtn");
    var submitHint = document.getElementById("submitHint");
    var originalEmail = emailInput.value;
    var pendingEmail = "";
    var emailVerified = false;
    var emailTimerInterval = null;
    var EMAIL_CODE_VALID_SECONDS = 5 * 60;

    function setEmailMsg(text, ok) {
      emailMsg.textContent = text;
      emailMsg.style.color = ok ? "#2f8f5b" : "#c45c26";
    }

    function formatEmailTime(seconds) {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function startEmailTimer() {
      clearInterval(emailTimerInterval);
      var remaining = EMAIL_CODE_VALID_SECONDS;
      emailCodeInput.disabled = false;
      emailVerifyBtn.disabled = false;
      emailTimerEl.textContent = formatEmailTime(remaining);
      emailTimerInterval = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(emailTimerInterval);
          emailTimerEl.textContent = "00:00";
          emailCodeInput.disabled = true;
          emailVerifyBtn.disabled = true;
          setEmailMsg("인증 시간이 만료되었습니다. 인증코드를 다시 받아주세요.", false);
          return;
        }
        emailTimerEl.textContent = formatEmailTime(remaining);
      }, 1000);
    }

    function stopEmailTimer() {
      clearInterval(emailTimerInterval);
      emailTimerEl.textContent = "";
    }

    function refreshSubmitState() {
      submitBtn.disabled = !emailVerified;
      submitHint.style.display = emailVerified ? "none" : "block";
    }

    emailEditBtn.addEventListener("click", function () {
      var mode = emailEditBtn.dataset.mode || "edit";

      if (mode === "edit") {
        emailInput.disabled = false;
        emailInput.value = "";
        emailInput.focus();
        emailEditBtn.textContent = "인증코드 받기";
        emailEditBtn.dataset.mode = "send";
        setEmailMsg("", true);
        return;
      }

      var newEmail = emailInput.value.trim();
      if (!newEmail) {
        setEmailMsg("이메일을 입력해주세요.", false);
        return;
      }
      if (newEmail === originalEmail) {
        setEmailMsg("임시로 생성된 이메일이 아닌, 실제로 쓰는 이메일을 입력해주세요.", false);
        return;
      }
      emailEditBtn.disabled = true;
      emailEditBtn.textContent = "발송 중...";

      fetch("/settings/email/code", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "newEmail=" + encodeURIComponent(newEmail)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setEmailMsg(data.message, data.success);
          if (data.success) {
            pendingEmail = newEmail;
            emailInput.disabled = true;
            emailCodeRow.style.display = "flex";
            emailCodeInput.value = "";
            emailCodeInput.focus();
            startEmailTimer();
          }
        })
        .catch(function () {
          setEmailMsg("이메일 발송 중 오류가 발생했습니다.", false);
        })
        .finally(function () {
          emailEditBtn.disabled = false;
          emailEditBtn.textContent = "인증코드 받기";
        });
    });

    emailVerifyBtn.addEventListener("click", function () {
      var code = emailCodeInput.value.trim();
      if (!code) {
        setEmailMsg("인증코드를 입력해주세요.", false);
        return;
      }
      fetch("/settings/email/verify", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "newEmail=" + encodeURIComponent(pendingEmail) + "&code=" + encodeURIComponent(code)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setEmailMsg(data.message, data.success);
          if (data.success) {
            emailHidden.value = pendingEmail;
            originalEmail = pendingEmail;
            emailVerified = true;
            stopEmailTimer();
            emailInput.disabled = true;
            emailInput.value = pendingEmail;
            emailCodeRow.style.display = "none";
            emailEditBtn.textContent = "수정하기";
            emailEditBtn.dataset.mode = "edit";
            refreshSubmitState();
          }
        })
        .catch(function () {
          setEmailMsg("인증 확인 중 오류가 발생했습니다.", false);
        });
    });

    refreshSubmitState();
  })();
</script>
</body>
</html>
