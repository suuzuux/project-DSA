<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{findId.pageTitle}">WePlaNet – 아이디 찾기</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
<div class="auth-card">
  <a class="auth-card__back" th:href="@{/login}" th:text="#{findId.back}">← 뒤로</a>
  <h1 class="auth-card__title mt-16" th:text="#{findId.heading}">아이디 찾기</h1>

  <div id="findIdForm">
    <div class="form-group">
      <label class="form-label" for="realName" th:text="#{findId.realNameLabel}">이름</label>
      <input class="form-input" id="realName" type="text" th:placeholder="#{findId.realNamePlaceholder}" placeholder="이름 입력" />
    </div>
    <div class="form-group">
      <label class="form-label" for="email" th:text="#{findId.emailLabel}">이메일</label>
      <div class="form-row">
        <input class="form-input" id="email" type="email" th:placeholder="#{findId.emailPlaceholder}" placeholder="가입 시 등록한 이메일" />
        <button type="button" class="btn btn--ghost btn--sm" id="sendCodeBtn" th:text="#{findId.sendCodeButton}">인증코드 받기</button>
      </div>
      <div class="form-row mt-8" id="codeRow" style="display:none;">
        <input class="form-input" id="code" type="text" maxlength="6" th:placeholder="#{findId.codePlaceholder}" placeholder="인증번호 6자리" autocomplete="one-time-code" />
        <button type="button" class="btn btn--ghost btn--sm" id="verifyBtn" th:text="#{findId.verifyButton}">인증하기</button>
      </div>
      <p class="text-xs" id="msg" style="margin-top:6px;"></p>
    </div>
  </div>

  <div id="resultBox" style="display:none;text-align:center;padding:24px 0;">
    <p class="text-sm text-muted" th:text="#{findId.resultLabel}">회원님의 아이디는</p>
    <p style="font-size:var(--wp-fs-xl);font-weight:800;margin:8px 0;" id="resultUsername"></p>
    <a class="btn btn--primary btn--block" th:href="@{/login}" th:text="#{findId.goToLoginButton}">로그인하러 가기</a>
  </div>
</div>
<script th:src="@{/js/common/main.js}"></script>
<script th:inline="javascript">
  (function () {
    "use strict";
    // 상태 메시지를 현재 화면 언어로 미리 받아 둔다.
    var MSG = {
      nameEmailRequired: /*[[#{findId.nameEmailRequired}]]*/ "이름과 이메일을 모두 입력해주세요.",
      sending: /*[[#{findId.sending}]]*/ "발송 중...",
      sendCodeButton: /*[[#{findId.sendCodeButton}]]*/ "인증코드 받기",
      requestError: /*[[#{findId.requestError}]]*/ "요청 중 오류가 발생했습니다.",
      codeRequired: /*[[#{findId.codeRequired}]]*/ "인증코드를 입력해주세요.",
      verifyError: /*[[#{findId.verifyError}]]*/ "인증 확인 중 오류가 발생했습니다."
    };
    var nameInput = document.getElementById("realName");
    var emailInput = document.getElementById("email");
    var sendBtn = document.getElementById("sendCodeBtn");
    var codeRow = document.getElementById("codeRow");
    var codeInput = document.getElementById("code");
    var verifyBtn = document.getElementById("verifyBtn");
    var msg = document.getElementById("msg");
    var formBox = document.getElementById("findIdForm");
    var resultBox = document.getElementById("resultBox");
    var resultUsername = document.getElementById("resultUsername");

    function setMsg(text, ok) {
      msg.textContent = text;
      msg.style.color = ok ? "#63704a" : "#c45c26";
    }

    sendBtn.addEventListener("click", function () {
      var name = nameInput.value.trim();
      var email = emailInput.value.trim();
      if (!name || !email) {
        setMsg(MSG.nameEmailRequired, false);
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = MSG.sending;
      fetch("/find-id/code", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "realName=" + encodeURIComponent(name) + "&email=" + encodeURIComponent(email)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setMsg(data.message, data.success);
          if (data.success) {
            codeRow.style.display = "flex";
            codeInput.focus();
          }
        })
        .catch(function () { setMsg(MSG.requestError, false); })
        .finally(function () {
          sendBtn.disabled = false;
          sendBtn.textContent = MSG.sendCodeButton;
        });
    });

    verifyBtn.addEventListener("click", function () {
      var name = nameInput.value.trim();
      var email = emailInput.value.trim();
      var code = codeInput.value.trim();
      if (!code) {
        setMsg(MSG.codeRequired, false);
        return;
      }
      fetch("/find-id/verify", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "realName=" + encodeURIComponent(name) + "&email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.success) {
            formBox.style.display = "none";
            resultUsername.textContent = data.username;
            resultBox.style.display = "block";
          } else {
            setMsg(data.message, false);
          }
        })
        .catch(function () { setMsg(MSG.verifyError, false); });
    });
  })();
</script>
</body>
</html>
