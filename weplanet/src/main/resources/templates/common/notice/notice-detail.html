<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${notice.title} + ' | WePlaNet'">공지 상세 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <style>
    /* 줄바꿈은 Toast UI 뷰어가 이미 <br> 로 그려준다(예전 평문 공지의 한 줄 줄바꿈도 그대로 보임).
       예전엔 여기에 white-space: pre-line 을 줬는데, 그러면 <br> 뒤의 \n 까지 줄바꿈이 돼서
       줄마다 빈 줄이 하나씩 더 생겼다 → 기본값으로 두고, 빈 줄(문단 구분)은 딱 한 줄만큼만 띄운다.
       (커뮤니티 게시글 상세의 .post-card__body 뷰어와 같은 규칙) */
    .notice-viewer .toastui-editor-contents { white-space: normal; }
    .notice-viewer .toastui-editor-contents p { margin: 0; }
    .notice-viewer .toastui-editor-contents p + p { margin-top: 1.6em; }
    .notice-viewer .toastui-editor-contents img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

<header class="site-header">
  <div class="header-left">
    <button type="button" class="menu-toggle" data-shell-open="menu" th:aria-label="#{shell.menu.open}" aria-label="메뉴 열기">☰</button>
    <a class="brand" th:href="@{/}">
      <span class="brand__mark">W</span>
      <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
  </div>
  <div class="header-actions">
    <th:block sec:authorize="isAnonymous()">
      <a class="btn btn--ghost btn--sm" th:href="@{/signup}" th:text="#{shell.guest.signup}">회원가입</a>
      <a class="btn btn--primary btn--sm" th:href="@{/login}" th:text="#{common.login}">로그인</a>
    </th:block>
    <th:block sec:authorize="isAuthenticated()">
      <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="btn btn--ghost btn--sm" th:text="#{common.logout}">로그아웃</button>
      </form>
    </th:block>
  </div>
</header>

<main class="container section" style="max-width:760px;">
  <a class="section__link mb-16" th:href="@{/notices}" style="display:inline-block;" th:text="#{notices.backToList}">← 공지사항 목록</a>
  <article>
    <h1 class="section__title" style="font-size:var(--wp-fs-xl);margin-bottom:8px;" th:text="${notice.title}">공지 제목</h1>
    <p class="text-xs text-muted mb-24"
       th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.31</p>
    <!-- 번역보기 (게시글과 같은 방식, 로그인한 사람만) - 내 기본 서비스 언어로 제목·본문을 AI 번역해 원문 위에 보여준다 -->
    <a sec:authorize="isAuthenticated()" href="#" class="translate-link" data-notice-translate data-target="noticeTranslated"
       data-render="markdown" th:data-url="@{/notices/{id}/translate(id=${notice.id})}"
       th:data-label-show="#{community.translate.show}" th:data-label-loading="#{client.translate.loading}"
       th:data-label-original="#{client.translate.original}" th:data-label-failed="#{error.ai.unavailable}"
       th:text="#{community.translate.show}">번역보기</a>
    <div id="noticeTranslated" class="text-sm" style="display:none;margin:8px 0 24px;color:var(--wp-ink-soft);white-space:pre-wrap;"></div>
    <!-- 본문은 마크다운. Toast UI Viewer가 링크·이미지를 그려준다 (위험한 HTML 태그는 Viewer가 걸러냄) -->
    <div id="noticeViewer" class="notice-viewer"></div>
  </article>
</main>

<script th:src="@{/js/common/main.js}"></script>
<script th:src="@{/js/common/shell.js}"></script>
<script th:src="@{/js/common/notice-translate.js}"></script>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script th:inline="javascript">
  toastui.Editor.factory({
    el: document.getElementById("noticeViewer"),
    viewer: true,
    initialValue: /*[[${notice.content}]]*/ ""
  });
</script>
</body>
</html>
