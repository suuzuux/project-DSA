<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- 개인정보처리방침 - 설정 화면 "약관 및 정책"에서 들어온다 (로그인 없이도 볼 수 있음).
         본문은 policy/privacy-body.html 의 ko / ja / en 조각 (한국어가 원문, WePlaNet 데이터 모델 기준으로 직접 작성). -->
    <title th:text="#{policy.privacy.pageTitle}">개인정보처리방침 | WePlaNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .policy-toc { list-style:none; padding:0; margin:0 0 32px; display:grid; gap:6px; }
        .policy-toc a { color:var(--wp-ink-soft); text-decoration:none; font-size:var(--wp-fs-sm); }
        .policy-toc a:hover { color:var(--wp-brand); text-decoration:underline; }
        .policy-article { margin-bottom:28px; }
        .policy-article h2 { font-size:var(--wp-fs-lg); font-weight:700; margin-bottom:10px; scroll-margin-top:16px; }
        .policy-article p, .policy-article li { line-height:1.7; color:var(--wp-ink); }
        .policy-article ul, .policy-article ol { padding-left:20px; margin:8px 0; }
        .policy-article li { margin-bottom:6px; }
        .policy-meta { color:var(--wp-ink-soft); font-size:var(--wp-fs-xs); margin-bottom:24px; }
    </style>
</head>
<body>
<main class="container section" style="max-width:760px;">
    <a th:href="@{/settings}" class="btn btn--ghost btn--sm" style="margin-bottom:16px;display:inline-block;" th:text="#{policy.backToSettings}">← 설정으로</a>
    <h1 style="font-size:var(--wp-fs-2xl);font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;" th:text="#{policy.privacy.heading}">개인정보처리방침</h1>
    <p class="policy-meta" th:text="#{policy.effectiveDate}">시행일자: 2026년 9월 16일</p>

    <!-- th:replace가 th:case보다 먼저 처리되므로 case와 replace는 반드시 다른 요소에 둔다 -->
    <th:block th:switch="${#locale.language}">
        <th:block th:case="'ja'"><th:block th:replace="~{policy/privacy-body :: ja}"></th:block></th:block>
        <th:block th:case="'en'"><th:block th:replace="~{policy/privacy-body :: en}"></th:block></th:block>
        <th:block th:case="*"><th:block th:replace="~{policy/privacy-body :: ko}"></th:block></th:block>
    </th:block>
</main>
</body>
</html>
