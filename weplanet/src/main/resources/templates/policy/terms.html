<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--
      이용약관 - 회원정보 및 설정(settings.html) "약관 및 정책" 목업 링크를 실제 페이지로 대체.
      로그인 여부와 무관하게 볼 수 있어야 해서 SecurityConfig의 PUBLIC_URLS에 /policy/** 를 등록해뒀다.
      내용은 실제 WePlaNet 서비스 구성(커뮤니티/DM/멤버십/샵/팬 프로젝트/탈퇴 시 익명화 등)을 기준으로
      직접 작성한 것이며, 특정 서비스의 약관을 그대로 옮긴 것이 아니다.
      본문은 policy/terms-body.html 의 ko / ja / en 조각으로 분리했다(한국어가 원문, ja/en은 번역본).
    -->
    <title th:text="#{policy.terms.pageTitle}">이용약관 | WePlaNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .policy-toc { list-style:none; padding:0; margin:0 0 32px; display:grid; gap:6px; }
        .policy-toc a { color:var(--wp-ink-soft); text-decoration:none; font-size:var(--wp-fs-sm); }
        .policy-toc a:hover { color:var(--wp-brand); text-decoration:underline; }
        .policy-article { margin-bottom:28px; }
        .policy-article h2 { font-size:var(--wp-fs-lg); font-weight:700; margin-bottom:10px; scroll-margin-top:16px; }
        .policy-article p, .policy-article li { line-height:1.7; color:var(--wp-ink); }
        .policy-article ul, .policy-article ol { padding-left:20px; margin:8px 0; }
        .policy-article li { margin-bottom:6px; }
        .policy-meta { color:var(--wp-ink-soft); font-size:var(--wp-fs-xs); margin-bottom:24px; }
    </style>
</head>
<body>
<main class="container section" style="max-width:760px;">
    <a th:href="@{/settings}" class="btn btn--ghost btn--sm" style="margin-bottom:16px;" th:text="#{policy.backToSettings}">← 설정으로</a>
    <h1 style="font-size:var(--wp-fs-2xl);font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;" th:text="#{policy.terms.heading}">이용약관</h1>
    <p class="policy-meta" th:text="#{policy.effectiveDate}">시행일자: 2026년 9월 16일</p>

    <!-- th:replace가 th:case보다 먼저 처리되므로 case와 replace는 반드시 다른 요소에 둔다 -->
    <th:block th:switch="${#locale.language}">
        <th:block th:case="'ja'"><th:block th:replace="~{policy/terms-body :: ja}"></th:block></th:block>
        <th:block th:case="'en'"><th:block th:replace="~{policy/terms-body :: en}"></th:block></th:block>
        <th:block th:case="*"><th:block th:replace="~{policy/terms-body :: ko}"></th:block></th:block>
    </th:block>
</main>
</body>
</html>
