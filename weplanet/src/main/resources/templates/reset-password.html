<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{resetPassword.pageTitle}">WePlaNet – 비밀번호 재설정</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
<div class="auth-card">
  <a class="auth-card__back" th:href="@{/login}" th:text="#{resetPassword.back}">← 뒤로</a>
  <h1 class="auth-card__title mt-16" th:text="#{resetPassword.heading}">비밀번호 재설정</h1>

  <div id="verifyStep">
    <div class="form-group">
      <label class="form-label" for="username" th:text="#{resetPassword.usernameLabel}">아이디</label>
      <input class="form-input" id="username" type="text" th:placeholder="#{resetPassword.usernamePlaceholder}" placeholder="아이디 입력" />
    </div>
    <div class="form-group">
      <label class="form-label" for="email" th:text="#{resetPassword.emailLabel}">이메일</label>
      <div class="form-row">
        <input class="form-input" id="email" type="email" th:placeholder="#{resetPassword.emailPlaceholder}" placeholder="가입 시 등록한 이메일" />
        <button type="button" class="btn btn--ghost btn--sm" id="sendCodeBtn" th:text="#{resetPassword.sendCodeButton}">인증코드 받기</button>
      </div>
      <div class="form-row mt-8" id="codeRow" style="display:none;align-items:center;gap:8px;">
        <input class="form-input" id="code" type="text" maxlength="6" th:placeholder="#{resetPassword.codePlaceholder}" placeholder="인증번호 6자리" autocomplete="one-time-code" />
        <span class="text-xs" id="codeTimer" style="min-width:40px;color:var(--wp-ink-soft);"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="verifyBtn" th:text="#{resetPassword.verifyButton}">인증하기</button>
      </div>
      <p class="text-xs" id="msg" style="margin-top:6px;"></p>
    </div>
  </div>

  <div id="resetStep" style="display:none;">
    <div class="form-group">
      <label class="form-label" for="newPassword" th:text="#{resetPassword.newPasswordLabel}">새 비밀번호</label>
      <input class="form-input" id="newPassword" type="password" th:placeholder="#{resetPassword.newPasswordPlaceholder}" placeholder="영문, 숫자 포함 8~20자" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPassword" th:text="#{resetPassword.confirmPasswordLabel}">새 비밀번호 확인</label>
      <input class="form-input" id="confirmPassword" type="password" th:placeholder="#{resetPassword.confirmPasswordPlaceholder}" placeholder="비밀번호 다시 입력" autocomplete="new-password" />
    </div>
    <p class="text-xs" id="resetMsg" style="margin-bottom:12px;"></p>
    <button type="button" class="btn btn--primary btn--block" id="submitResetBtn" th:text="#{resetPassword.submitButton}">비밀번호 변경</button>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
  (function () {
    "use strict";
    // SETTINGS-03: 이 화면의 JS 상태 메시지를 서버 로케일 기준으로 미리 받아온다.
    var MSG = {
      usernameEmailRequired: /*[[#{resetPassword.usernameEmailRequired}]]*/ "아이디와 이메일을 모두 입력해주세요.",
      sending: /*[[#{resetPassword.sending}]]*/ "발송 중...",
      sendCodeButton: /*[[#{resetPassword.sendCodeButton}]]*/ "인증코드 받기",
      requestError: /*[[#{resetPassword.requestError}]]*/ "요청 중 오류가 발생했습니다.",
      codeRequired: /*[[#{resetPassword.codeRequired}]]*/ "인증코드를 입력해주세요.",
      verifyError: /*[[#{resetPassword.verifyError}]]*/ "인증 확인 중 오류가 발생했습니다.",
      codeExpired: /*[[#{resetPassword.codeExpired}]]*/ "인증 시간이 만료되었습니다. 인증코드를 다시 받아주세요.",
      passwordMismatch: /*[[#{resetPassword.passwordMismatch}]]*/ "새 비밀번호가 일치하지 않습니다.",
      resetError: /*[[#{resetPassword.resetError}]]*/ "비밀번호 변경 중 오류가 발생했습니다."
    };
    var usernameInput = document.getElementById("username");
    var emailInput = document.getElementById("email");
    var sendBtn = document.getElementById("sendCodeBtn");
    var codeRow = document.getElementById("codeRow");
    var codeInput = document.getElementById("code");
    var verifyBtn = document.getElementById("verifyBtn");
    var timerEl = document.getElementById("codeTimer");
    var msg = document.getElementById("msg");
    var verifyStep = document.getElementById("verifyStep");
    var resetStep = document.getElementById("resetStep");
    var newPasswordInput = document.getElementById("newPassword");
    var confirmPasswordInput = document.getElementById("confirmPassword");
    var resetMsg = document.getElementById("resetMsg");
    var submitResetBtn = document.getElementById("submitResetBtn");
    var timerInterval = null;
    var CODE_VALID_SECONDS = 5 * 60; // 서버 EmailVerificationService의 EXPIRE_MINUTES(5분)와 맞춤

    function setMsg(el, text, ok) {
      el.textContent = text;
      el.style.color = ok ? "#63704a" : "#c45c26";
    }

    function formatTime(seconds) {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function startTimer() {
      clearInterval(timerInterval);
      var remaining = CODE_VALID_SECONDS;
      codeInput.disabled = false;
      verifyBtn.disabled = false;
      timerEl.textContent = formatTime(remaining);
      timerInterval = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = "00:00";
          codeInput.disabled = true;
          verifyBtn.disabled = true;
          setMsg(msg, MSG.codeExpired, false);
          return;
        }
        timerEl.textContent = formatTime(remaining);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerEl.textContent = "";
    }

    sendBtn.addEventListener("click", function () {
      var username = usernameInput.value.trim();
      var email = emailInput.value.trim();
      if (!username || !email) {
        setMsg(msg, MSG.usernameEmailRequired, false);
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = MSG.sending;
      fetch("/find-password/code", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "username=" + encodeURIComponent(username) + "&email=" + encodeURIComponent(email)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setMsg(msg, data.message, data.success);
          if (data.success) {
            codeRow.style.display = "flex";
            codeInput.value = "";
            codeInput.focus();
            startTimer();
          }
        })
        .catch(function () { setMsg(msg, MSG.requestError, false); })
        .finally(function () {
          sendBtn.disabled = false;
          sendBtn.textContent = MSG.sendCodeButton;
        });
    });

    verifyBtn.addEventListener("click", function () {
      var username = usernameInput.value.trim();
      var email = emailInput.value.trim();
      var code = codeInput.value.trim();
      if (!code) {
        setMsg(msg, MSG.codeRequired, false);
        return;
      }
      fetch("/find-password/verify", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "username=" + encodeURIComponent(username) + "&email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setMsg(msg, data.message, data.success);
          if (data.success) {
            stopTimer();
            verifyStep.style.display = "none";
            resetStep.style.display = "block";
          }
        })
        .catch(function () { setMsg(msg, MSG.verifyError, false); });
    });

    submitResetBtn.addEventListener("click", function () {
      var username = usernameInput.value.trim();
      var email = emailInput.value.trim();
      var newPassword = newPasswordInput.value;
      var confirmPassword = confirmPasswordInput.value;
      if (newPassword !== confirmPassword) {
        setMsg(resetMsg, MSG.passwordMismatch, false);
        return;
      }
      fetch("/find-password/reset", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "username=" + encodeURIComponent(username) + "&email=" + encodeURIComponent(email)
            + "&newPassword=" + encodeURIComponent(newPassword) + "&confirmPassword=" + encodeURIComponent(confirmPassword)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setMsg(resetMsg, data.message, data.success);
          if (data.success) {
            submitResetBtn.disabled = true;
            setTimeout(function () { window.location.href = "/login"; }, 1500);
          }
        })
        .catch(function () { setMsg(resetMsg, MSG.resetError, false); });
    });
  })();
</script>
</body>
</html>
