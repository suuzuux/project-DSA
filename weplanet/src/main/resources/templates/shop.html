<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${communityMode && selectedArtist != null ? selectedArtist.nickname() + ' 굿즈샵' : 'WePlaNet Shop'}">WePlaNet Shop</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" th:href="@{/css/shop.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-toggle" data-shell-open="menu" aria-label="메뉴">☰</button>
      <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
      </a>
    </div>
    <div class="header-actions">
      <a class="icon-btn" th:href="@{/shop/cart}" aria-label="장바구니" title="장바구니">🛒</a>
      <th:block sec:authorize="isAnonymous()">
        <a class="btn btn--ghost btn--sm" th:href="@{/login}">로그인</a>
      </th:block>
      <th:block sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post" style="display:inline;">
          <button type="submit" class="btn btn--ghost btn--sm">로그아웃</button>
        </form>
      </th:block>
    </div>
  </header>

  <main class="container section">
    <header class="shop-header">
      <th:block th:if="${communityMode && selectedArtist != null}">
        <p class="text-xs text-muted mb-8">
          <a th:href="@{/community/{id}/highlight(id=${selectedArtist.id()})}" th:text="${selectedArtist.nickname() + ' 커뮤니티'}">커뮤니티</a>
          · 굿즈샵
        </p>
        <h1 th:text="${selectedArtist.nickname() + ' 굿즈샵'}">아티스트 굿즈샵</h1>
        <p>이 커뮤니티 아티스트의 공식 MD · 디지털 콘텐츠만 표시됩니다.</p>
      </th:block>
      <th:block th:unless="${communityMode}">
        <h1>WePlaNet Shop</h1>
        <p>여러 커뮤니티 아티스트의 공식 MD · 디지털 콘텐츠 · 멤버십 전용 상품</p>
      </th:block>
      <div class="shop-header__actions">
        <a class="btn btn--soft btn--sm" th:href="@{/membership}">멤버십 혜택 보기</a>
        <a class="btn btn--ghost btn--sm" th:href="@{/shop/cart}">장바구니</a>
        <a th:if="${communityMode}" class="btn btn--ghost btn--sm" th:href="@{/shop}">전체 굿즈샵 보기</a>
        <a th:if="${communityMode && selectedArtist != null}"
           class="btn btn--ghost btn--sm"
           th:href="@{/community/{id}/highlight(id=${selectedArtist.id()})}">← 커뮤니티</a>
      </div>
    </header>

    <!-- 전체 굿즈샵: 아티스트 선택 -->
    <section th:if="${!communityMode}" aria-label="아티스트 Shop">
      <p class="drawer-menu__section-title" style="margin-bottom:10px;">아티스트 Shop</p>
      <div class="shop-artist-row">
        <a class="shop-artist-chip"
           th:classappend="${selectedArtistId == null} ? ' is-active'"
           th:href="@{/shop}">
          <div class="avatar">ALL</div>
          전체
        </a>
        <a class="shop-artist-chip"
           th:each="artist : ${artists}"
           th:classappend="${selectedArtistId != null && selectedArtistId == artist.id()} ? ' is-active'"
           th:href="@{/shop(artistId=${artist.id()})}">
          <div class="avatar" th:text="${artist.logo()}">AR</div>
          <span th:text="${artist.nickname()}">아티스트</span>
        </a>
      </div>
    </section>

    <!-- 커뮤니티 굿즈샵: 현재 아티스트 고정 -->
    <section th:if="${communityMode && selectedArtist != null}" aria-label="아티스트 Shop">
      <p class="drawer-menu__section-title" style="margin-bottom:10px;">아티스트</p>
      <div class="shop-artist-row">
        <span class="shop-artist-chip is-active is-locked" aria-current="true">
          <div class="avatar" th:text="${selectedArtist.logo()}">AR</div>
          <span th:text="${selectedArtist.nickname()}">아티스트</span>
        </span>
      </div>
    </section>

    <div class="shop-filters">
      <div class="chip-row">
        <button type="button" class="chip is-active" data-shop-filter="all">전체</button>
        <button type="button" class="chip" data-shop-filter="md">MD · 굿즈</button>
        <button type="button" class="chip" data-shop-filter="digital">디지털</button>
        <button type="button" class="chip" data-shop-filter="membership">멤버십 전용</button>
      </div>
      <input class="form-input shop-search" type="search" placeholder="상품명 검색" id="shopSearchInput" />
    </div>

    <section>
      <div class="section__head">
        <h2 class="section__title"
            th:text="${communityMode && selectedArtist != null ? selectedArtist.nickname() + ' 상품' : (selectedArtist != null ? selectedArtist.nickname() + ' 상품' : '전체 상품')}">
          상품
        </h2>
      </div>

      <div class="product-grid" id="shopProductGrid">
        <a class="product-card"
           th:each="product : ${products}"
           th:href="@{/shop/products/{id}(id=${product.id()},from=${communityMode ? 'community' : null})}"
           th:attr="data-category=${product.category()},data-title=${product.title()}">
          <div class="product-card__thumb">
            <span th:if="${product.membershipOnly()}" class="product-card__badge tag tag--member">멤버십</span>
            상품 이미지
          </div>
          <div class="product-card__body">
            <span class="product-card__artist" th:text="${product.artistName()}">아티스트</span>
            <h3 class="product-card__title" th:text="${product.title()}">상품명</h3>
            <p class="product-card__price">
              <span th:text="${product.formattedPrice()}">₩ 0</span>
              <small th:if="${product.priceSuffix() != null}" th:text="${product.priceSuffix()}">다운로드</small>
            </p>
          </div>
        </a>
      </div>

      <p class="text-sm text-muted mt-16" th:if="${#lists.isEmpty(products)}">
        표시할 상품이 없습니다.
      </p>
      <p class="text-sm text-muted mt-16" id="shopEmptyFilter" hidden>조건에 맞는 상품이 없습니다.</p>
    </section>
  </main>

  <script th:inline="javascript">
    window.__WEPLANET_ARTISTS__ = /*[[${joinedArtists}]]*/ [];
  </script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script>
    (function () {
      var grid = document.getElementById("shopProductGrid");
      if (!grid) return;
      var cards = Array.prototype.slice.call(grid.querySelectorAll(".product-card"));
      var emptyMsg = document.getElementById("shopEmptyFilter");
      var searchInput = document.getElementById("shopSearchInput");
      var activeFilter = "all";

      function applyFilters() {
        var query = (searchInput && searchInput.value || "").trim().toLowerCase();
        var visible = 0;
        cards.forEach(function (card) {
          var category = card.getAttribute("data-category") || "";
          var title = (card.getAttribute("data-title") || "").toLowerCase();
          var categoryOk = activeFilter === "all" || category === activeFilter;
          var searchOk = !query || title.indexOf(query) !== -1;
          var show = categoryOk && searchOk;
          card.hidden = !show;
          if (show) visible++;
        });
        if (emptyMsg) emptyMsg.hidden = visible > 0 || cards.length === 0;
      }

      document.querySelectorAll("[data-shop-filter]").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll("[data-shop-filter]").forEach(function (c) {
            c.classList.remove("is-active");
          });
          chip.classList.add("is-active");
          activeFilter = chip.getAttribute("data-shop-filter") || "all";
          applyFilters();
        });
      });
      if (searchInput) {
        searchInput.addEventListener("input", applyFilters);
      }
    })();
  </script>
</body>
</html>
