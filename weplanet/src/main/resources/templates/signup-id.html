<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    [와이어프레임] 아이디로 회원가입
    유효성: 아이디 5~15 영문숫자 / 비번 8~15 영문+숫자+특수 / 닉네임 3~10
    에러는 박스 밑 빨간 글씨 (.form-error)
  -->
  <title>WePlaNet – 아이디로 회원가입</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card" style="width:min(100%,480px);">
    <a class="auth-card__back" href="signup.html">← 뒤로</a>
    <div class="flex-between">
      <p class="auth-card__brand" style="margin:0;">We<span>Pla</span>Net</p>
      <button type="button" class="icon-btn" aria-label="언어">🌐</button>
    </div>

    <h1 class="auth-card__title mt-16">회원가입</h1>

    <form id="signupForm" novalidate>
      <!-- 아이디 -->
      <div class="form-group">
        <label class="form-label" for="userId">아이디</label>
        <div class="form-row">
          <input class="form-input" id="userId" name="userId" type="text" placeholder="아이디 입력" autocomplete="username" />
          <button type="button" class="btn btn--ghost btn--sm" onclick="alert('중복 확인 (목업): 사용 가능')">중복 확인</button>
        </div>
        <p class="form-hint">조건: 5~15자 이내, 영문·숫자</p>
        <p class="form-error"></p>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input" id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="new-password" />
        <p class="form-hint">영문, 숫자, 특수문자 포함 8~15자</p>
        <p class="form-error"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
        <input class="form-input" id="passwordConfirm" name="passwordConfirm" type="password" placeholder="비밀번호 입력" />
        <p class="form-error"></p>
      </div>

      <!-- 이메일 -->
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input class="form-input" id="email" name="email" type="email" placeholder="your@email.com" />
        <p class="form-error"></p>
      </div>

      <!-- 닉네임 -->
      <div class="form-group">
        <label class="form-label" for="nickname">닉네임</label>
        <input class="form-input" id="nickname" name="nickname" type="text" placeholder="상큼한고양이331" maxlength="10" />
        <p class="form-hint">원하는 닉네임을 설정하세요. 계정 설정에서 언제든 변경할 수 있어요. (3~10자)</p>
        <p class="form-error"></p>
      </div>

      <!-- 약관 -->
      <div class="form-group">
        <p class="form-label">이용 약관 동의</p>
        <div class="check-list">
          <label class="check-item check-item--all">
            <input type="checkbox" id="agreeAll" /> 모두 동의
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item data-agree-required />
            (필수) 만 14세 이상입니다.
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item data-agree-required />
            (필수) 회원가입을 위한 동의
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item />
            (선택) 광고 및 마케팅 활용 동의
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg">가입하기</button>
    </form>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
