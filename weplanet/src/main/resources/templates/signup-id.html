<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    [와이어프레임] 아이디로 회원가입
    유효성: 아이디 5~15 영문숫자 / 비번 8~15 영문+숫자+특수 / 닉네임 3~10
    에러는 박스 밑 빨간 글씨 (.form-error)
  -->
  <title>WePlaNet – 아이디로 회원가입</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
  <div class="auth-card" style="width:min(100%,480px);">
    <a class="auth-card__back" th:href="@{/login}">← 뒤로</a>
    <div class="flex-between">
      <p class="auth-card__brand" style="margin:0;">We<span>Pla</span>Net</p>
      <button type="button" class="icon-btn" aria-label="언어">🌐</button>
    </div>

    <h1 class="auth-card__title mt-16">회원가입</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="text-sm" style="color:#c45c26;margin-top:8px;"></p>

    <form id="signupForm" th:action="@{/signup}" th:object="${signupRequestDto}" method="post" novalidate>
      <!-- 아이디 -->
      <div class="form-group" th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'">
        <label class="form-label" for="userId">아이디</label>
        <div class="form-row">
          <input class="form-input" id="userId" th:field="*{username}" type="text" placeholder="아이디 입력" autocomplete="username" />
          <button type="button" class="btn btn--ghost btn--sm" id="checkUsernameBtn">중복 확인</button>
        </div>
        <p class="form-hint">조건: 4~20자 이내, 영문·숫자</p>
        <p class="text-xs" id="usernameCheckMsg" style="margin-top:6px;"></p>
        <p class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('username')}"></p>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input" id="password" th:field="*{password}" type="password" placeholder="비밀번호 입력" autocomplete="new-password" />
        <p class="form-hint">영문, 숫자 포함 8~20자</p>
        <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('password')}"></p>
      </div>

      <div class="form-group" th:classappend="${#fields.hasErrors('passwordConfirm')} ? ' is-invalid'">
        <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
        <input class="form-input" id="passwordConfirm" th:field="*{passwordConfirm}" type="password" placeholder="비밀번호 입력" />
        <p class="form-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('passwordConfirm')}"></p>
      </div>

      <!-- 이름 -->
      <div class="form-group" th:classappend="${#fields.hasErrors('realName')} ? ' is-invalid'">
        <label class="form-label" for="realName">이름</label>
        <input class="form-input" id="realName" th:field="*{realName}" type="text" placeholder="이름 입력" />
        <p class="form-error" th:if="${#fields.hasErrors('realName')}" th:errors="*{realName}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('realName')}"></p>
      </div>

      <!-- 이메일 -->
      <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
        <label class="form-label" for="email">이메일</label>
        <div class="form-row">
          <input class="form-input" id="email" th:field="*{email}" type="email" placeholder="your@email.com" />
          <button type="button" class="btn btn--ghost btn--sm" id="sendEmailCodeBtn">인증코드 받기</button>
        </div>
        <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('email')}"></p>

        <div class="form-row mt-8" id="emailCodeRow" style="display:none;align-items:center;gap:8px;">
          <input class="form-input" id="emailCode" type="text" maxlength="6" placeholder="인증번호 6자리" autocomplete="one-time-code" />
          <span class="text-xs" id="emailCodeTimer" style="min-width:40px;color:var(--wp-ink-soft);"></span>
          <button type="button" class="btn btn--ghost btn--sm" id="verifyEmailCodeBtn">인증하기</button>
        </div>
        <p class="text-xs" id="emailVerifyMsg" style="margin-top:6px;"></p>
      </div>

      <!-- 닉네임 -->
      <div class="form-group" th:classappend="${#fields.hasErrors('nickname')} ? ' is-invalid'">
        <label class="form-label" for="nickname">닉네임</label>
        <input class="form-input" id="nickname" th:field="*{nickname}" type="text" placeholder="상큼한고양이331" maxlength="10" />
        <p class="form-hint">원하는 닉네임을 설정하세요. 비워두면 자동 생성됩니다. (3~10자)</p>
        <p class="form-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        <p class="form-error" th:unless="${#fields.hasErrors('nickname')}"></p>
      </div>

      <!-- 약관 -->
      <div class="form-group">
        <p class="form-label">이용 약관 동의</p>
        <div class="check-list">
          <label class="check-item check-item--all">
            <input type="checkbox" id="agreeAll" /> 모두 동의
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item data-agree-required />
            (필수) 만 14세 이상입니다.
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item data-agree-required />
            (필수) 회원가입을 위한 동의
          </label>
          <label class="check-item">
            <input type="checkbox" data-agree-item />
            (선택) 광고 및 마케팅 활용 동의
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg">가입하기</button>
    </form>

    <p class="text-sm text-muted" style="margin-top:20px;text-align:center;">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" style="color:var(--wp-brand);font-weight:600;">로그인</a>
    </p>
  </div>

  <script th:src="@{/js/main.js}"></script>
  <script>
    (function () {
      "use strict";
      var usernameInput = document.getElementById("userId");
      var checkUsernameBtn = document.getElementById("checkUsernameBtn");
      var usernameMsg = document.getElementById("usernameCheckMsg");
      var usernameChecked = false;
      var checkedUsername = "";

      var emailInput = document.getElementById("email");
      var sendBtn = document.getElementById("sendEmailCodeBtn");
      var codeRow = document.getElementById("emailCodeRow");
      var codeInput = document.getElementById("emailCode");
      var verifyBtn = document.getElementById("verifyEmailCodeBtn");
      var timerEl = document.getElementById("emailCodeTimer");
      var msg = document.getElementById("emailVerifyMsg");
      var form = document.getElementById("signupForm");
      var emailVerified = false;
      var verifiedEmail = "";
      var timerInterval = null;
      var CODE_VALID_SECONDS = 5 * 60; // 서버 EmailVerificationService의 EXPIRE_MINUTES(5분)와 맞춤

      function setUsernameMsg(text, ok) {
        usernameMsg.textContent = text;
        usernameMsg.style.color = ok ? "#2f8f5b" : "#c45c26";
      }

      function setMsg(text, ok) {
        msg.textContent = text;
        msg.style.color = ok ? "#2f8f5b" : "#c45c26";
      }

      checkUsernameBtn.addEventListener("click", function () {
        var username = usernameInput.value.trim();
        if (!username) {
          setUsernameMsg("아이디를 먼저 입력해주세요.", false);
          return;
        }
        usernameChecked = false;
        checkUsernameBtn.disabled = true;

        fetch("/signup/username/check", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "username=" + encodeURIComponent(username)
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            setUsernameMsg(data.message, data.available);
            usernameChecked = data.available;
            checkedUsername = data.available ? username : "";
          })
          .catch(function () {
            setUsernameMsg("중복 확인 중 오류가 발생했습니다.", false);
          })
          .finally(function () {
            checkUsernameBtn.disabled = false;
          });
      });

      usernameInput.addEventListener("input", function () {
        if (usernameChecked && usernameInput.value.trim() !== checkedUsername) {
          usernameChecked = false;
          setUsernameMsg("아이디가 변경되어 중복 확인이 초기화되었습니다. 다시 확인해주세요.", false);
        }
      });

      function formatTime(seconds) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      }

      function startTimer() {
        clearInterval(timerInterval);
        var remaining = CODE_VALID_SECONDS;
        codeInput.disabled = false;
        verifyBtn.disabled = false;
        timerEl.textContent = formatTime(remaining);
        timerInterval = setInterval(function () {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timerInterval);
            timerEl.textContent = "00:00";
            codeInput.disabled = true;
            verifyBtn.disabled = true;
            setMsg("인증 시간이 만료되었습니다. 인증코드를 다시 받아주세요.", false);
            return;
          }
          timerEl.textContent = formatTime(remaining);
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
        timerEl.textContent = "";
      }

      sendBtn.addEventListener("click", function () {
        var email = emailInput.value.trim();
        if (!email) {
          setMsg("이메일을 먼저 입력해주세요.", false);
          return;
        }
        emailVerified = false;
        sendBtn.disabled = true;
        sendBtn.textContent = "발송 중...";

        fetch("/signup/email/code", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "email=" + encodeURIComponent(email)
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            setMsg(data.message, data.success);
            if (data.success) {
              codeRow.style.display = "flex";
              codeInput.value = "";
              codeInput.focus();
              startTimer();
            }
          })
          .catch(function () {
            setMsg("이메일 발송 중 오류가 발생했습니다.", false);
          })
          .finally(function () {
            sendBtn.disabled = false;
            sendBtn.textContent = "인증코드 받기";
          });
      });

      verifyBtn.addEventListener("click", function () {
        var email = emailInput.value.trim();
        var code = codeInput.value.trim();
        if (!code) {
          setMsg("인증코드를 입력해주세요.", false);
          return;
        }
        fetch("/signup/email/verify", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code)
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            setMsg(data.message, data.success);
            emailVerified = data.success;
            verifiedEmail = data.success ? email : "";
            if (data.success) {
              stopTimer();
              codeInput.disabled = true;
              verifyBtn.disabled = true;
            }
          })
          .catch(function () {
            setMsg("인증 확인 중 오류가 발생했습니다.", false);
          });
      });

      emailInput.addEventListener("input", function () {
        if (emailVerified && emailInput.value.trim() !== verifiedEmail) {
          emailVerified = false;
          stopTimer();
          setMsg("이메일이 변경되어 인증이 초기화되었습니다. 다시 인증해주세요.", false);
        }
      });

      form.addEventListener("submit", function (e) {
        if (!usernameChecked || usernameInput.value.trim() !== checkedUsername) {
          e.preventDefault();
          setUsernameMsg("아이디 중복 확인을 먼저 완료해주세요.", false);
          usernameInput.focus();
          return;
        }
        if (!emailVerified || emailInput.value.trim() !== verifiedEmail) {
          e.preventDefault();
          setMsg("이메일 인증을 먼저 완료해주세요.", false);
          emailInput.focus();
        }
      });
    })();
  </script>
</body>
</html>
