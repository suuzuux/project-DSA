<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Media | WePlaNet'">Media | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('media')}"></nav>

      <div class="board-toolbar">
        <div class="chip-row" style="margin:0;" id="mediaFilterChips">
          <button type="button" class="chip is-active" data-media-filter="all">
            <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
            전체
          </button>
          <button type="button" class="chip" data-media-filter="membership">멤버십</button>
          <button type="button" class="chip" data-media-filter="popular">인기</button>
        </div>
        <div class="board-toolbar__actions">
          <label class="board-select">
            <svg class="board-select__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M3 5l2 2 4-4"></path><path d="M3 12h4"></path><path d="M3 19h4"></path></svg>
            <select id="mediaSort" class="form-select" aria-label="미디어 정렬">
              <option value="latest">최신순</option>
              <option value="oldest">등록순</option>
            </select>
          </label>
          <button type="button" class="btn btn--primary btn--sm"
                  th:if="${#authentication.name != 'anonymousUser' and #authentication.principal.id == artist.id()}"
                  data-modal-open="writeMediaModal">미디어 등록</button>
        </div>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:var(--wp-brand);margin:8px 0;" th:text="${msg}"></p>
      <p th:if="${error}" class="text-sm" style="color:var(--wp-danger);margin:8px 0;" th:text="${error}"></p>

      <div class="feed" id="mediaFeed" th:if="${not #lists.isEmpty(mediaList)}">
        <article class="post-card"
                 th:each="post : ${mediaList}"
                 th:attr="data-membership=${post.membershipOnly},data-likes=${post.likeCount},data-created=${#temporals.format(post.createdAt, 'yyyyMMddHHmmss')}">
          <a th:href="@{/community/{artistId}/media/{mediaId}(artistId=${artist.id()}, mediaId=${post.id})}"
             style="display:block;color:inherit;">
            <div class="post-card__head">
              <div class="avatar" th:text="${#strings.substring(artist.nickname(),0,1)}">M</div>
              <div class="post-card__meta">
                <div class="post-card__name">
                  <span th:text="${post.title}">제목</span>
                  <span class="tag tag--member" th:if="${post.membershipOnly}">멤버십</span>
                  <span class="tag tag--live"
                        th:if="${post.title != null and #strings.startsWith(post.title, '라이브 다시보기')}">다시보기</span>
                </div>
                <div class="post-card__time"
                     th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                     th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
              </div>
            </div>

            <p class="post-card__body" th:if="${post.content != null and !#strings.isEmpty(post.content)}"
               th:text="${post.content}"></p>
          </a>

          <div class="post-card__media" th:if="${not #lists.isEmpty(post.files)}">
            <th:block th:each="file : ${post.files}">
              <a th:href="@{/community/{artistId}/media/{mediaId}(artistId=${artist.id()}, mediaId=${post.id})}"
                 th:if="${file.mediaType == 'IMAGE'}">
                <img th:src="@{/board/media/file/{id}(id=${file.id})}"
                     th:alt="${file.originalName}"
                     style="width:100%;border-radius:var(--wp-radius-sm);max-height:420px;object-fit:cover;margin-bottom:8px;" />
              </a>
              <video th:if="${file.mediaType == 'VIDEO'}"
                     th:src="@{/board/media/file/{id}(id=${file.id})}"
                     preload="metadata"
                     controls
                     class="post-card__video"></video>
            </th:block>
          </div>

          <div class="post-card__actions" style="justify-content:space-between;">
            <button type="button" class="post-like"
                    th:classappend="${likedMediaIds != null and likedMediaIds.contains(post.id)} ? ' is-liked'"
                    th:attr="data-media-like=${post.id}"
                    aria-label="좋아요">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
              <span data-like-count th:text="${post.likeCount > 0 ? post.likeCount : ''}"></span>
            </button>
            <span class="text-xs text-muted" th:text="'첨부 ' + ${post.fileCount} + '개'"></span>
            <form th:if="${#authentication.name != 'anonymousUser' and #authentication.principal.id == artist.id()}"
                  th:action="@{/board/media/{id}/delete(id=${post.id})}"
                  method="post"
                  onsubmit="return WePlaNet.confirmSubmit(this, '삭제할까요?');">
              <input type="hidden" name="groupId" th:value="${groupId}" />
              <input type="hidden" name="artistId" th:value="${artist.id()}" />
              <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
            </form>
          </div>
        </article>
      </div>

      <p th:if="${#lists.isEmpty(mediaList)}" class="list-empty">표시할 미디어가 없습니다.</p>
      <p class="list-empty" id="mediaEmptyFilter" hidden>조건에 맞는 미디어가 없습니다.</p>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <!-- 미디어 등록 모달 (해당 커뮤니티 아티스트만) -->
  <div class="modal-backdrop" id="writeMediaModal"
       th:if="${#authentication.name != 'anonymousUser' and #authentication.principal.id == artist.id()}">
    <div class="modal modal--wide" onclick="event.stopPropagation()">
      <div class="modal__head">
        <h2 class="modal__title">미디어 등록</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>
      <form th:action="@{/board/media/upload}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="groupId" th:value="${groupId}" />
        <input type="hidden" name="artistId" th:value="${artist.id()}" />
        <label class="form-label">제목</label>
        <input class="form-input" type="text" name="title" required maxlength="200" placeholder="제목을 입력하세요" />
        <label class="form-label mt-12">설명</label>
        <textarea class="form-textarea" name="content" maxlength="2000" placeholder="설명을 입력하세요 (선택)"></textarea>
        <label class="form-label mt-12">파일 (이미지/영상, 1개 이상)</label>
        <input class="form-input" type="file" name="files" accept="image/*,video/*" multiple required />
        <label class="form-label mt-12">
          <input type="checkbox" name="membershipOnly" value="true" />
          멤버십 전용 (해당 커뮤니티 멤버십 가입 팬만 볼 수 있음)
        </label>
        <button type="submit" class="btn btn--primary btn--block mt-16">등록하기</button>
      </form>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script>
    (function () {
      var feed = document.getElementById("mediaFeed");
      var emptyFilter = document.getElementById("mediaEmptyFilter");
      var sortSelect = document.getElementById("mediaSort");
      if (!feed) return;
      var cards = Array.prototype.slice.call(feed.querySelectorAll(".post-card"));
      var activeFilter = "all";

      function apply() {
        var sort = (sortSelect && sortSelect.value) || "latest";
        var visible = [];
        cards.forEach(function (card) {
          var membership = card.getAttribute("data-membership") === "true";
          var likes = parseInt(card.getAttribute("data-likes") || "0", 10);
          var ok = activeFilter === "all"
            || (activeFilter === "membership" && membership)
            || (activeFilter === "popular" && likes >= 100);
          card.hidden = !ok;
          if (ok) visible.push(card);
        });
        visible.sort(function (a, b) {
          var ta = a.getAttribute("data-created") || "";
          var tb = b.getAttribute("data-created") || "";
          return sort === "oldest" ? ta.localeCompare(tb) : tb.localeCompare(ta);
        });
        visible.forEach(function (card) { feed.appendChild(card); });
        if (emptyFilter) emptyFilter.hidden = visible.length > 0 || cards.length === 0;
      }

      document.querySelectorAll("[data-media-filter]").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll("[data-media-filter]").forEach(function (c) {
            c.classList.remove("is-active");
          });
          chip.classList.add("is-active");
          activeFilter = chip.getAttribute("data-media-filter") || "all";
          apply();
        });
      });
      if (sortSelect) {
        sortSelect.addEventListener("change", apply);
      }
    })();
  </script>
</body>
</html>
