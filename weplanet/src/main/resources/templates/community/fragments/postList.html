<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
  <div id="postListArea" th:fragment="postListFragment">
    <div class="feed" th:if="${not #lists.isEmpty(posts)}">
      <article class="post-card" th:each="post : ${posts}">
        <div class="post-card__head">
          <a th:if="${post.author != null}"
             th:href="@{/community/{artistId}/profile/{userId}(artistId=${artist.id()}, userId=${post.author.id})}"
             class="avatar post-author-avatar" aria-label="작성자 프로필로 이동">
            <img th:if="${authorAvatarUrls.get('' + post.author.id) != null}"
                 th:src="${authorAvatarUrls.get('' + post.author.id)}" alt="" />
            <svg th:unless="${authorAvatarUrls.get('' + post.author.id) != null}"
                 class="avatar__placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </a>
          <div th:unless="${post.author != null}" class="avatar post-author-avatar">
            <svg class="avatar__placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </div>
          <div class="post-card__meta">
            <div class="post-card__name">
              <a th:if="${post.author != null}"
                 th:href="@{/community/{artistId}/profile/{userId}(artistId=${artist.id()}, userId=${post.author.id})}"
                 style="color:inherit;text-decoration:none;"
                 th:text="${authorNicknames.get('' + post.author.id)}">닉네임</a>
              <span th:unless="${post.author != null}">(알 수 없음)</span>
              <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
            </div>
            <div class="post-card__time"
                 th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                 th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
          </div>
        </div>
		<a th:href="@{/community/{artistId}/{tab}/{postId}(artistId=${artist.id()}, tab=${boardType.name() == 'ARTIST' ? 'artist' : 'fan'}, postId=${post.id})}"
           style="display:block;color:inherit;">
          <p class="post-card__body" th:text="${post.title}"></p>
          <p th:if="${post.linkUrl} != null" class="translate-link" style="display:flex;align-items:center;gap:4px;margin-top:6px;word-break:break-all;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <span th:text="${post.linkUrl}"></span>
          </p>
          <div th:if="${thumbnailUrls.get(post.id)} != null" class="post-card__media">
            <img th:src="@{'/uploads/' + ${thumbnailUrls.get(post.id)}}" alt="" width="800" height="500" loading="lazy">
          </div>
        </a>
        <div class="post-card__actions">
          <button type="button" class="post-like"
                  th:classappend="${likedPostIds != null and likedPostIds.contains(post.id)} ? ' is-liked'"
                  th:attr="data-post-like=${post.id}"
                  aria-label="좋아요">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span data-like-count th:text="${post.likeCount}">0</span>
          </button>
          <a class="post-comment"
             th:with="cc=${commentCounts.get(post.id)}"
             th:href="@{/community/{artistId}/{tab}/{postId}(artistId=${artist.id()}, tab=${boardType.name() == 'ARTIST' ? 'artist' : 'fan'}, postId=${post.id})} + '#commentContentInput'"
             aria-label="댓글 작성란으로 이동">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            <span th:text="${cc != null ? cc : 0}">0</span>
          </a>
        </div>
      </article>
    </div>

    <div class="post-list-more" th:if="${hasMorePosts}">
      <button type="button" class="btn btn--soft post-list-more__button"
              data-view-more
              th:attr="data-more-url=@{/community/{artistId}/{tab}(artistId=${artist.id()}, tab=${boardType.name() == 'ARTIST' ? 'artist' : 'fan'}, sort=${sort}, page=${postPage + 1})}">
        더보기 <span aria-hidden="true">∨</span>
      </button>
    </div>

    <p th:if="${#lists.isEmpty(posts)}" class="list-empty">등록된 게시글이 없습니다.</p>
  </div>
</body>
</html>
