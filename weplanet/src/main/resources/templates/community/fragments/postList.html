<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
  <div id="postListArea" th:fragment="postListFragment">
    <div class="feed" th:if="${not #lists.isEmpty(posts)}">
      <article class="post-card" th:each="post : ${posts}">
        <a th:href="${boardType.name() == 'FAN'}
                      ? @{/community/{artistId}/fan/{postId}(artistId=${artist.id()}, postId=${post.id})}
                      : @{/community/{artistId}/artist/{postId}(artistId=${artist.id()}, postId=${post.id})}"
           style="display:block;color:inherit;">
          <div class="post-card__head">
            <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
            <div class="post-card__meta">
              <div class="post-card__name">
                <span th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></span>
                <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
              </div>
              <div class="post-card__time"
                   th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                   th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
            </div>
          </div>
          <p class="post-card__body" th:text="${post.title}"></p>
          <p th:if="${post.linkUrl} != null" class="translate-link" style="margin-top:6px;word-break:break-all;">
            🔗 <span th:text="${post.linkUrl}"></span>
          </p>
          <div th:if="${thumbnailUrls.get(post.id)} != null" class="post-card__media">
            <img th:src="@{'/uploads/' + ${thumbnailUrls.get(post.id)}}" alt=""
                 style="width:100%;border-radius:var(--wp-radius-sm);max-height:320px;object-fit:cover;">
          </div>
        </a>
        <div class="post-card__actions">
          <span th:if="${post.likeCount > 0}">♥ <span th:text="${post.likeCount}"></span></span>
          <span th:unless="${post.likeCount > 0}">♥</span>
          <span th:with="cc=${commentCounts.get(post.id)}">
            <span th:if="${cc > 0}">💬 <span th:text="${cc}"></span></span>
            <span th:unless="${cc > 0}">💬</span>
          </span>
        </div>
      </article>
    </div>

    <p th:if="${#lists.isEmpty(posts)}" class="text-muted" style="padding:24px 0;">등록된 게시글이 없습니다.</p>
  </div>
</body>
</html>
