<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <aside id="commentSection" class="community-aside" th:fragment="commentsFragment">
    <!-- 댓글 작성 -->
    <div class="comment-box" sec:authorize="isAuthenticated()">
      <p class="form-label" th:text="#{community.comment.writeLabel}">댓글 작성</p>
      <form id="commentForm"
            th:action="@{/posts/detail/{id}/comment(id=${post.id}, artistId=${artist.id()})}"
            method="post">
        <textarea name="content" id="commentContentInput" class="form-textarea" data-count maxlength="100"
                  placeholder="댓글을 입력하세요." th:placeholder="#{community.comment.placeholder}" style="min-height:80px;"></textarea>
        <div class="comment-box__actions">
          <span class="char-count text-xs text-muted">0 / 100</span>
          <div class="flex-center">
            <button type="button" class="btn btn--ghost btn--sm" id="commentCancelBtn" th:text="#{common.cancel}">취소</button>
            <button type="submit" class="btn btn--primary btn--sm" th:text="#{community.comment.submit}">등록</button>
          </div>
        </div>
      </form>
    </div>

    <div class="comment-list">
      <!-- 아티스트 댓글은 스크롤 영역 밖 최상단에 고정한다. -->
      <div th:if="${not #lists.isEmpty(artistComments)}" class="comment-list__head">
        <span><th:block th:text="#{community.comment.artistComments}">아티스트 댓글</th:block> <span th:text="${#lists.size(artistComments)}">0</span></span>
      </div>
      <div class="comment-scroll comment-scroll--artist">
        <th:block th:each="comment : ${artistComments}">
          <div th:replace="~{:: commentNode(${comment}, true, false)}"></div>
        </th:block>
      </div>

      <div class="comment-list__head" th:classappend="${not #lists.isEmpty(artistComments)} ? ' mt-16'">
        <span><th:block th:text="#{community.comment.fanComments}">팬 댓글</th:block> <span th:text="${#lists.size(otherComments)}">0</span></span>
      </div>
      <!-- 팬 댓글은 이 영역 안에서만 스크롤 -->
      <div class="comment-scroll">
        <div th:if="${not #lists.isEmpty(otherComments)}">
          <th:block th:each="comment : ${otherComments}">
            <div th:replace="~{:: commentNode(${comment}, false, false)}"></div>
          </th:block>
        </div>
        <p th:if="${#lists.isEmpty(otherComments)}" class="list-empty text-sm" th:text="#{community.comment.empty}">등록된 댓글이 없습니다.</p>
      </div>
    </div>
  </aside>

  <!-- 댓글 한 칸 (원댓글·답글 공용) - comment, artistStyle(배경색), isReply(답글이면 답글 링크·목록 없음) -->
  <div th:fragment="commentNode(comment, artistStyle, isReply)" class="comment-item"
       th:classappend="${(isReply ? ' comment-item--reply' : '')
                       + (comment.deleted ? ' comment-item--deleted' : '')
                       + ((reportedCommentIds != null and #sets.contains(reportedCommentIds, comment.id)) ? ' comment-item--reported' : '')}"
       th:style="${artistStyle and not comment.deleted} ? 'background:var(--wp-brand-soft);margin:0 -8px;padding:14px 8px;border-radius:8px;'">
    <!-- 삭제된 댓글은 작성자 링크를 걸지 않는다. -->
    <div th:if="${comment.deleted}" class="avatar avatar--sm">—</div>
    <!-- 프로필 사진이 있으면 사진, 없으면 사람 아이콘 -->
    <a th:unless="${comment.deleted}"
       th:href="@{/community/{artistId}/profile/{userId}(artistId=${artist.id()}, userId=${comment.author.id})}"
       class="avatar avatar--sm" th:aria-label="#{community.post.authorProfileAria}">
      <img th:if="${authorAvatarUrls.get('' + comment.author.id) != null}"
           th:src="${authorAvatarUrls.get('' + comment.author.id)}" alt="" />
      <svg th:unless="${authorAvatarUrls.get('' + comment.author.id) != null}"
           class="avatar__placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
      </svg>
    </a>
    <div class="comment-item__body">

      <!-- 삭제된 원댓글은 답글을 위해 행을 남기고 문구만 보여준다. -->
      <p th:if="${comment.deleted}" class="comment-item__text text-muted" th:text="#{community.comment.deleted}">삭제된 댓글입니다</p>

      <th:block th:unless="${comment.deleted}">
        <div class="comment-item__meta">
          <a th:href="@{/community/{artistId}/profile/{userId}(artistId=${artist.id()}, userId=${comment.author.id})}"
             style="color:inherit;text-decoration:none;font-weight:700;"
             th:text="${authorNicknames.get('' + comment.author.id)}"></a>
          <span th:if="${comment.author.artistSide}" class="badge-verified">✓</span>
          · <span th:with="y=${#temporals.year(comment.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                  th:text="${y == curY} ? ${#temporals.format(comment.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <p class="comment-item__text" th:id="'commentText-' + ${comment.id}"
           th:text="${(reportedCommentIds != null and #sets.contains(reportedCommentIds, comment.id)) ? #messages.msg('community.comment.reported') : comment.content}"></p>
        <div class="flex-center" style="gap:10px;margin-top:4px;"
             th:unless="${reportedCommentIds != null and #sets.contains(reportedCommentIds, comment.id)}">
          <a href="javascript:void(0)" class="comment-translate-link translate-link"
             th:attr="data-comment-id=${comment.id}" th:text="#{community.translate.show}">번역보기</a>
          <th:block th:unless="${isReply}">
            <a sec:authorize="isAuthenticated()" href="javascript:void(0)"
               class="comment-reply-toggle translate-link" th:attr="data-comment-id=${comment.id}" th:text="#{community.comment.reply}">답글</a>
          </th:block>
          <th:block sec:authorize="isAuthenticated()"
                    th:if="${#authentication.principal.id == comment.author.id}">
            <a href="javascript:void(0)" class="comment-edit-toggle translate-link" th:attr="data-comment-id=${comment.id}" th:text="#{common.edit}">수정</a>
            <form class="comment-delete-form" method="post" style="display:inline;"
                  th:action="@{/posts/detail/{id}/comment/{commentId}/delete(id=${post.id}, commentId=${comment.id}, artistId=${artist.id()})}">
              <button type="submit" class="translate-link"
                      style="background:none;border:none;cursor:pointer;color:var(--wp-danger, #d33);" th:text="#{common.delete}">삭제</button>
            </form>
          </th:block>
          <th:block sec:authorize="isAuthenticated()">
            <a href="javascript:void(0)" th:unless="${#authentication.principal.id == comment.author.id}"
               class="comment-report-toggle translate-link" th:attr="data-comment-id=${comment.id}" th:text="#{community.report.toggle}">신고</a>
          </th:block>
        </div>
        <div th:id="'commentEditRow-' + ${comment.id}" style="display:none;gap:6px;align-items:center;margin-top:4px;">
          <form class="comment-edit-form" method="post" style="display:flex;gap:6px;align-items:center;flex:1;"
                th:attr="data-comment-id=${comment.id}"
                th:action="@{/posts/detail/{id}/comment/{commentId}/edit(id=${post.id}, commentId=${comment.id}, artistId=${artist.id()})}">
            <input type="text" name="content" class="form-input" maxlength="100" th:value="${comment.content}"
                   style="min-height:30px;padding:2px 8px;font-size:var(--wp-fs-xs);" />
            <button type="submit" class="btn btn--ghost btn--sm" th:text="#{common.save}">저장</button>
          </form>
        </div>
        <p th:id="'commentTranslated-' + ${comment.id}" class="text-xs"
           style="display:none;margin:4px 0 0;color:var(--wp-ink-soft);"></p>
        <div th:id="'commentReportRow-' + ${comment.id}" style="display:none;gap:8px;align-items:center;margin-top:4px;">
          <form class="comment-report-form" method="post" style="display:flex;gap:6px;align-items:center;"
                th:attr="data-comment-id=${comment.id}"
                th:action="@{/posts/detail/{id}/comment/{commentId}/report(id=${post.id}, commentId=${comment.id})}">
            <select name="reason" class="form-select" style="min-height:30px;padding:2px 6px;font-size:var(--wp-fs-xs);">
              <option value="SPAM" th:text="#{community.report.reason.SPAM}">스팸</option>
              <option value="ABUSE" th:text="#{community.report.reason.ABUSE}">욕설/혐오</option>
              <option value="SEXUAL" th:text="#{community.report.reason.SEXUAL}">음란물</option>
              <option value="ETC" th:text="#{community.report.reason.ETC}">기타</option>
            </select>
            <button type="submit" class="btn btn--ghost btn--sm" th:text="#{community.report.submit}">신고하기</button>
          </form>
          <span th:id="'commentReportMsg-' + ${comment.id}" class="text-xs"></span>
        </div>
      </th:block>

      <!-- 답글 입력칸 (삭제된 댓글에는 불가) -->
      <th:block th:unless="${isReply or comment.deleted}">
        <th:block sec:authorize="isAuthenticated()">
          <div th:id="'commentReplyRow-' + ${comment.id}" style="display:none;margin-top:6px;">
            <form class="comment-reply-form" method="post" style="display:flex;gap:6px;align-items:center;"
                  th:action="@{/posts/detail/{id}/comment(id=${post.id}, artistId=${artist.id()})}">
              <input type="hidden" name="parentId" th:value="${comment.id}" />
              <input type="text" name="content" class="form-input" maxlength="100" placeholder="답글을 입력하세요."
                     th:placeholder="#{community.comment.replyPlaceholder}"
                     style="min-height:30px;padding:2px 8px;font-size:var(--wp-fs-xs);" />
              <button type="submit" class="btn btn--primary btn--sm" th:text="#{community.comment.submit}">등록</button>
            </form>
          </div>
        </th:block>
      </th:block>

      <!-- 이 댓글에 달린 답글들 -->
      <div class="comment-replies"
           th:if="${not isReply and repliesByParentId != null and repliesByParentId.containsKey('' + comment.id)}">
        <th:block th:each="reply : ${repliesByParentId.get('' + comment.id)}">
          <div th:replace="~{:: commentNode(${reply}, false, true)}"></div>
        </th:block>
      </div>
    </div>
  </div>
</body>
</html>
