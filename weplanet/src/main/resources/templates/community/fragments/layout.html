<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
  <header th:fragment="header" class="community-top">
    <button type="button" class="menu-toggle" data-shell-open="menu" aria-label="메뉴">☰</button>
    <div class="community-top__left">
      <a class="home-link" th:href="@{/}" title="위플래닛 홈">🏠</a>
      <span class="avatar avatar--sm" th:text="${artist.logo()}">AR</span>
      <h1 class="community-top__name" th:text="${artist.nickname()}">아티스트</h1>
    </div>
    <div class="community-top__right">
      <button type="button" class="icon-btn" aria-label="언어">🌐</button>
      <a class="icon-btn" href="/shop.html" aria-label="Shop" title="WePlaNet Shop">🧺</a>
      <th:block sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <button type="button" class="icon-btn icon-btn--badge" aria-label="알림">🔔</button>
        <a class="icon-btn" th:href="@{/community/{id}/profile(id=${artist.id()})}" aria-label="내 프로필"><span class="avatar avatar--sm">나</span></a>
      </th:block>
      <th:block sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
      </th:block>
    </div>
  </header>

  <div th:fragment="hero" class="community-hero">
    <span class="community-hero__viewers">페이지를 보고 있어요.</span>
    <strong style="font-size:22px;letter-spacing:-0.02em;"
            th:text="|${artist.nickname()} Official Community|">Official Community</strong>
  </div>

  <nav th:fragment="tabs(active)" class="tabs" aria-label="커뮤니티 메뉴">
    <a th:href="@{/community/{id}/highlight(id=${artist.id()})}"
       th:classappend="${active == 'highlight'} ? ' is-active'">Highlight</a>
    <a th:href="@{/community/{id}/notice(id=${artist.id()})}"
       th:classappend="${active == 'notice'} ? ' is-active'">Notice</a>
    <a th:href="@{/community/{id}/fan(id=${artist.id()})}"
       th:classappend="${active == 'fan'} ? ' is-active'">Fan</a>
    <a th:href="@{/community/{id}/artist(id=${artist.id()})}"
       th:classappend="${active == 'artist'} ? ' is-active'">Artist</a>
    <a th:href="@{/community/{id}/media(id=${artist.id()})}"
       th:classappend="${active == 'media'} ? ' is-active'">Media</a>
    <a th:href="@{/community/{id}/live(id=${artist.id()})}"
       th:classappend="${active == 'live'} ? ' is-active'">Live</a>
  </nav>

  <aside th:fragment="sidebarAside(showWriteButton, showAbout)" class="community-aside">
    <th:block th:if="${showWriteButton}" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
      <button type="button" class="btn btn--primary btn--block mb-16" data-modal-open="writePostModal">포스트 작성하기</button>
    </th:block>

    <div class="membership-card">
      <h3 class="membership-card__title">🏅 <span th:text="|${artist.nickname()} Membership|">Membership</span></h3>

      <th:block sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div th:if="${membershipActive}">
          <p style="color:var(--wp-success, #1a8a5c);font-weight:700;font-size:13px;margin-bottom:6px;">✔️ 가입중</p>
          <p class="text-xs text-muted" th:text="${#temporals.format(membershipExpiresAt, 'yyyy.MM.dd')} + ' 까지'">만료일</p>
          <button type="button" class="btn btn--ghost btn--block mt-8" data-modal-open="membershipDetailModal">Membership 상세보기</button>
        </div>
        <div th:unless="${membershipActive}">
          <p class="membership-card__desc">지금 바로 멤버십에 가입하고, 특별한 혜택을 누려보세요.</p>
          <button type="button" class="btn btn--accent btn--block" data-modal-open="membershipJoinModal">Membership 가입하기</button>
        </div>
      </th:block>

      <th:block sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <p class="membership-card__desc">지금 바로 멤버십에 가입하고, 특별한 혜택을 누려보세요.</p>
        <a class="btn btn--accent btn--block" th:href="@{/login}">Membership 가입하기</a>
      </th:block>
    </div>

    <div class="widget" th:if="${showAbout}">
      <h3 class="widget__title">About</h3>
      <div class="flex-center mb-16">
        <div class="avatar avatar--lg" th:text="${artist.logo()}">AR</div>
        <div>
          <strong th:text="${artist.nickname()}">아티스트</strong>
          <p class="text-xs text-muted">아티스트 소개란 (공란 가능)</p>
        </div>
      </div>

      <!-- 와이어프레임 26번: 다른 아티스트 팔로잉/팔로우 리스트 -->
      <div th:each="other : ${otherArtists}" class="flex-between mb-8" style="align-items:center;">
        <div class="flex-center" style="gap:8px;">
          <span class="avatar avatar--sm" th:text="${other.logo()}">AR</span>
          <span th:text="${other.nickname()}">아티스트</span>
        </div>
        <form th:action="@{/community/{id}/follow(id=${other.id()})}" method="post">
          <input type="hidden" name="returnTo" th:value="${artist.id()}" />
          <button type="submit" class="btn btn--sm"
                  th:classappend="${other.following()} ? ' btn--soft' : ' btn--ghost'"
                  th:text="${other.following()} ? '팔로잉 ✔️' : '팔로우'">팔로우</button>
        </form>
      </div>
    </div>
  </aside>

  <script th:fragment="scripts" th:inline="javascript">
    window.__WEPLANET_ARTISTS__ = /*[[${artists}]]*/ [];
  </script>
</body>
</html>
