<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Fan | WePlaNet'">Fan | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- SockJS/Stomp : DM 플로팅 위젯 실시간 채팅용 라이브러리 (dm-realtime.js가 필요로 함) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <!-- Toast UI Editor: 포스트 작성 모달의 마크다운 리치 에디터 (예전엔 뷰어만 붙어있고 작성용은 빠져있었음) -->
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main" id="communityPostBoard"
         th:attr="data-artist-id=${artist.id()}, data-board-tab='fan'">
      <nav th:replace="~{community/fragments/layout :: tabs('fan')}"></nav>

      <div class="board-toolbar">
        <div class="board-tabs">
          <a class="is-active" th:href="@{/community/{id}/fan(id=${artist.id()})}">포스트</a>
          <!-- 프로젝트 탭은 화면이 아직 없음(/community/project.html 로 걸려 있어 404가 났음).
               구현되면 th:href="@{/community/{id}/project(id=${artist.id()})}" 로 되살릴 것 -->
          <span class="text-muted" style="cursor:not-allowed;opacity:.5;" title="준비 중입니다">프로젝트</span>
        </div>
        <div class="flex-center">
          <a class="sort-link form-select" style="width:auto;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;padding:0 12px;"
             th:href="@{/community/{id}/fan(id=${artist.id()}, sort='latest')}"
             th:classappend="${sort == 'latest'} ? ' is-active'">전체순</a>
          <a class="sort-link form-select" style="width:auto;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;padding:0 12px;margin-left:8px;"
             th:href="@{/community/{id}/fan(id=${artist.id()}, sort='popular')}"
             th:classappend="${sort == 'popular'} ? ' is-active'">인기순</a>
        </div>
      </div>

      <div th:replace="~{community/fragments/postList :: postListFragment}"></div>
    </div>

    <aside th:replace="~{community/fragments/layout :: sidebarAside(true, false)}"></aside>
  </div>

  <!-- 포스트 작성 모달 -->
  <div class="modal-backdrop" id="writePostModal" sec:authorize="isAuthenticated()">
    <div class="modal modal--wide" onclick="event.stopPropagation()">
      <div class="modal__head">
        <h2 class="modal__title">포스트 작성하기</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>
      <form id="writePostForm"
            th:action="@{/posts/fan/new(artistId=${artist.id()})}"
            method="post"
            enctype="multipart/form-data">
        <input type="hidden" name="artistId" th:value="${artist.id()}" />

        <input type="text" id="writePostTitle" name="title" class="form-input mb-8" maxlength="80"
               placeholder="제목을 입력하세요" required />

        <textarea id="writePostContent" name="content" hidden maxlength="1000"></textarea>
        <div id="writePostEditor"></div>

        <div id="writePostLinkRow" class="mt-8" style="display:none;">
          <input type="url" id="writePostLinkUrl" name="linkUrl" class="form-input"
                 placeholder="https:// 링크를 입력하세요" maxlength="500" />
        </div>

        <div class="flex-between mt-8">
          <div class="flex-center">
            <label class="icon-btn" title="이미지" style="cursor:pointer;">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <input type="file" id="writePostFiles" name="files" multiple
                     accept="image/*,application/pdf,.txt,.zip" style="display:none;" />
            </label>
            <button type="button" id="writePostLinkToggleBtn" class="icon-btn" title="링크" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
            <span id="writePostFileCount" class="text-xs text-muted"></span>
          </div>
          <span class="char-count text-xs text-muted">0 / 1000</span>
        </div>

        <div class="flex-between mt-8">
          <span class="text-sm">Hide from Artists</span>
          <button type="button" id="writePostHideToggle" class="toggle-managed" role="switch" aria-checked="false"></button>
          <input type="hidden" id="writePostHiddenFromArtist" name="hiddenFromArtist" value="false" />
        </div>

        <p id="writePostError" class="form-error mt-8" style="display:none;"></p>
        <button type="submit" id="writePostSubmit" class="btn btn--primary btn--block mt-16" disabled>등록하기</button>
      </form>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script th:src="@{/js/community-posts.js}"></script>
</body>
</html>
