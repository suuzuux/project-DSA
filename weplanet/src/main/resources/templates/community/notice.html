<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Notice | WePlaNet'">Notice | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- SockJS/Stomp : DM 플로팅 위젯 실시간 채팅용 라이브러리 (dm-realtime.js가 필요로 함) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('notice')}"></nav>
      <p th:if="${#lists.isEmpty(notices)}" class="text-muted" style="padding:24px 0;">등록된 공지가 없습니다.</p>
      <article th:each="notice : ${notices}" class="post-card mb-16">
        <div class="post-card__head">
          <div class="post-card__meta">
            <strong class="post-card__title" th:text="${notice.title}">공지 제목</strong>
            <span class="text-xs text-muted"
                  th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.29</span>
          </div>
        </div>
        <p class="post-card__excerpt" th:text="${notice.content}">공지 내용</p>
      </article>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
</body>
</html>
