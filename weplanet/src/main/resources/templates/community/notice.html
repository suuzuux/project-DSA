<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Notice | WePlaNet'">Notice | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- SockJS/Stomp : DM 플로팅 위젯 실시간 채팅용 라이브러리 (dm-realtime.js가 필요로 함) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('notice')}"></nav>
      <p th:if="${#lists.isEmpty(notices)}" class="list-empty" th:text="#{community.notice.empty}">등록된 공지가 없습니다.</p>
      <div class="notice-list" th:if="${!#lists.isEmpty(notices)}">
        <a class="notice-list__item"
           th:each="item : ${notices}"
           th:href="@{/community/{id}/notice/{nid}(id=${artist.id()}, nid=${item.id})}">
          <!-- 상단 고정 공지 표시 (전체 공지사항 페이지와 같은 핀 아이콘). 항목 간격(gap 14px)이 넓어 margin 으로 8px 로 줄임 -->
          <svg th:if="${item.pinned}" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               role="img" th:aria-label="#{admin.notices.stat.pinned}"
               style="color:var(--wp-brand);align-self:center;flex-shrink:0;margin-right:-6px;">
            <title th:text="#{admin.notices.stat.pinned}">상단 고정</title>
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
          </svg>
          <span class="notice-list__title"
                th:classappend="${item.pinned} ? ' is-pinned'"
                th:text="${item.title}">공지 제목</span>
        </a>
      </div>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/common/main.js}"></script>
  <script th:src="@{/js/common/shell.js}"></script>
  <script th:src="@{/js/common/dm-realtime.js}"></script>
</body>
</html>
