<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – ' + ${boardTab == 'artist' ? 'Artist' : 'Fan'} + ' 게시글 | WePlaNet'">게시글 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null},
               data-post-id=${post.id},
               data-artist-id=${artist.id()},
               data-board-tab=${boardTab}">

  <header th:replace="~{community/fragments/layout :: header}"></header>

  <div class="community-body community-body--detail">
    <div class="community-main">
    <a class="section__link mb-16" style="display:inline-block;"
       th:href="@{/community/{id}/{tab}(id=${artist.id()}, tab=${boardTab})}"
       th:text="${boardTab == 'artist'} ? '← Artist 게시판' : '← Fan 게시판'">← 게시판</a>

    <article class="post-card">
      <div class="post-card__head">
        <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
        <div class="post-card__meta">
          <div class="post-card__name">
            <span th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></span>
            <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
          </div>
          <div class="post-card__time"
               th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
               th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
        </div>
      </div>

      <h1 th:if="${post.title != null and !post.title.isBlank()}"
          style="font-size:20px;font-weight:700;margin:12px 0 8px;" th:text="${post.title}"></h1>

      <a href="javascript:void(0)" id="postTranslateLink" class="translate-link">번역보기</a>
      <p id="postTranslatedText" class="text-sm" style="display:none;margin:6px 0 0;color:var(--wp-ink-soft);"></p>
      <div id="contentViewer" class="post-card__body"></div>

      <!-- 와이어프레임 36번: 포스트 작성 시 첨부한 링크 -->
      <a th:if="${post.linkUrl != null}" th:href="${post.linkUrl}" target="_blank" rel="noopener"
         class="translate-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span th:text="${post.linkUrl}"></span>
      </a>

      <div th:if="${not #lists.isEmpty(attachments)}" class="post-card__media mt-12">
        <div th:each="file : ${attachments}">
          <img th:if="${file.image}" th:src="@{'/uploads/' + ${file.storedName}}" th:alt="${file.originalName}"
               style="width:100%;border-radius:var(--wp-radius-sm);max-height:480px;object-fit:cover;">
          <a th:unless="${file.image}" class="translate-link" th:href="@{'/uploads/' + ${file.storedName}}"
             th:text="${file.originalName}" download></a>
        </div>
      </div>

      <div class="post-card__actions">
        <button type="button" id="likeButton" style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;display:inline-flex;align-items:center;gap:4px;">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span id="likeCount" th:text="${post.likeCount > 0 ? post.likeCount : ''}"></span>
        </button>
        <span style="display:inline-flex;align-items:center;gap:4px;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          <span th:if="${#lists.size(comments) > 0}" th:text="${#lists.size(comments)}"></span>
        </span>

        <!-- 와이어프레임 35/45번: 북마크 - 백엔드/모델(bookmarked)은 이미 있었는데 버튼만 빠져있었음 -->
        <button type="button" id="bookmarkButton"
                th:classappend="${bookmarked} ? ' is-active'"
                style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;margin-left:auto;">
          <svg id="bookmarkIconFilled" class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" th:style="${bookmarked} ? '' : 'display:none;'"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          <svg id="bookmarkIconOutline" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" th:style="${bookmarked} ? 'display:none;' : ''"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
      </div>

      <!-- 수정/삭제(작성자 본인만) / 신고(작성자 아닌 로그인 사용자만) -->
      <div class="flex-center mt-8" style="gap:12px;" th:if="${post.author != null}">
        <th:block sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
          <th:block th:if="${#authentication.principal.id == post.author.id}">
            <button type="button" class="translate-link" style="background:none;border:none;cursor:pointer;"
                    data-modal-open="editPostModal">수정</button>
            <form th:action="@{/posts/detail/{id}/delete(id=${post.id})}" method="post"
                  onsubmit="return confirm('게시글을 삭제할까요?');" style="display:inline;">
              <button type="submit" class="translate-link"
                      style="background:none;border:none;cursor:pointer;color:var(--wp-danger, #d33);">삭제</button>
            </form>
          </th:block>
          <button type="button" th:unless="${#authentication.principal.id == post.author.id}"
                  id="postReportToggle" class="translate-link" style="background:none;border:none;cursor:pointer;">신고</button>
        </th:block>
      </div>
      <div id="postReportRow" style="display:none;margin-top:8px;">
        <form id="postReportForm" th:action="@{/posts/detail/{id}/report(id=${post.id})}" method="post"
              style="display:flex;gap:8px;align-items:center;">
          <select name="reason" class="form-select" style="min-height:34px;padding:4px 8px;">
            <option value="SPAM">스팸</option>
            <option value="ABUSE">욕설/혐오</option>
            <option value="SEXUAL">음란물</option>
            <option value="ETC">기타</option>
          </select>
          <button type="submit" class="btn btn--ghost btn--sm">신고하기</button>
        </form>
        <span id="postReportMsg" class="text-xs"></span>
      </div>

      <!-- AI 자동요약 - 백엔드(SummaryService, /posts/detail/{id}/summarize)는 이미 있었는데
           지금 쓰는 커뮤니티 상세 페이지엔 버튼이 안 붙어있었음. 레거시 feed/postDetail.html에서 로직 그대로 옮김 -->
      <div class="mt-12">
        <button id="summarizeButton" type="button" class="btn btn--soft btn--sm">AI 요약보기</button>
        <div id="summaryArea"></div>
      </div>
    </article>
    </div>

    <div th:replace="~{community/fragments/fanComments :: commentsFragment}"></div>
  </div>

  <!-- 게시글 수정 모달 (작성자 본인만 열림, th:if로 렌더링 자체를 걸러서 다른 사람 화면엔 안 그려짐) -->
  <div class="modal-backdrop" id="editPostModal"
       th:if="${post.author != null and #authentication.name != 'anonymousUser' and #authentication.principal.id == post.author.id}">
    <div class="modal modal--wide" onclick="event.stopPropagation()">
      <div class="modal__head">
        <h2 class="modal__title">게시글 수정</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>
      <form id="editPostForm" th:action="@{/posts/detail/{id}/edit(id=${post.id})}" method="post">
        <input type="text" id="editPostTitle" name="title" class="form-input mb-8" maxlength="80"
               th:value="${post.title}" placeholder="제목을 입력하세요" required />
        <textarea id="editPostContent" name="content" hidden maxlength="1000" th:text="${post.content}"></textarea>
        <div id="editPostEditor"></div>
        <div class="flex-between mt-8">
          <span class="char-count text-xs text-muted" id="editPostCharCount">0 / 1000</span>
          <button type="submit" class="btn btn--primary btn--sm" id="editPostSubmit">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
  <script th:inline="javascript">
    new toastui.Editor.factory({
      el: document.querySelector('#contentViewer'),
      viewer: true,
      initialValue: /*[[${post.content}]]*/ ''
    });

    // 유튜브 링크 자동 임베드 - 레거시 feed/postDetail.html 로직 그대로 옮김
    // (전엔 이 페이지에 아예 안 붙어있어서 유튜브 링크가 그냥 텍스트로만 보였음)
    setTimeout(embedYoutubeLinks, 0);

    function embedYoutubeLinks() {
      const container = document.getElementById('contentViewer');
      const ytPattern = /^https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=([\w-]{11})|youtu\.be\/([\w-]{11}))/;

      function makeEmbed(videoId) {
        const wrapper = document.createElement('div');
        wrapper.className = 'video-embed';
        wrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '" ' +
          'title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
        return wrapper;
      }

      container.querySelectorAll('a').forEach(function (a) {
        const m = a.href.match(ytPattern);
        if (m) {
          a.replaceWith(makeEmbed(m[1] || m[2]));
        }
      });

      const globalYtPattern = /(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=[\w-]{11}[^\s<]*|youtu\.be\/[\w-]{11}[^\s<]*))/g;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(function (node) {
        const text = node.nodeValue;
        globalYtPattern.lastIndex = 0;
        if (!globalYtPattern.test(text)) return;
        globalYtPattern.lastIndex = 0;

        const frag = document.createDocumentFragment();
        let lastIndex = 0;
        let match;
        while ((match = globalYtPattern.exec(text)) !== null) {
          if (match.index > lastIndex) {
            frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const single = match[0].match(ytPattern);
          if (single) {
            frag.appendChild(makeEmbed(single[1] || single[2]));
          } else {
            frag.appendChild(document.createTextNode(match[0]));
          }
          lastIndex = globalYtPattern.lastIndex;
        }
        if (lastIndex < text.length) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
        node.parentNode.replaceChild(frag, node);
      });
    }
  </script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script th:src="@{/js/community-post-detail.js}"></script>
</body>
</html>
