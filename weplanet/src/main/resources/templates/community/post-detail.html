<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – ' + ${boardTab == 'artist' ? 'Artist' : 'Fan'} + ' 게시글 | WePlaNet'">게시글 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null},
               data-post-id=${post.id},
               data-artist-id=${artist.id()},
               data-board-tab=${boardTab}">

  <header th:replace="~{community/fragments/layout :: header}"></header>

  <div class="community-body community-body--detail">
    <div class="community-main">
    <a class="section__link mb-16" style="display:inline-block;"
       th:href="@{/community/{id}/{tab}(id=${artist.id()}, tab=${boardTab})}"
       th:text="${boardTab == 'artist'} ? '← Artist 게시판' : '← Fan 게시판'">← 게시판</a>

    <article class="post-card">
      <div class="post-card__head">
        <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
        <div class="post-card__meta">
          <div class="post-card__name">
            <span th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></span>
            <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
          </div>
          <div class="post-card__time"
               th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
               th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
        </div>
      </div>

      <a href="javascript:void(0)" id="postTranslateLink" class="translate-link">번역보기</a>
      <p id="postTranslatedText" class="text-sm" style="display:none;margin:6px 0 0;color:var(--wp-ink-soft);"></p>
      <div id="contentViewer" class="post-card__body"></div>

      <!-- 와이어프레임 36번: 포스트 작성 시 첨부한 링크 -->
      <a th:if="${post.linkUrl != null}" th:href="${post.linkUrl}" target="_blank" rel="noopener"
         class="translate-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span th:text="${post.linkUrl}"></span>
      </a>

      <div th:if="${not #lists.isEmpty(attachments)}" class="post-card__media mt-12">
        <div th:each="file : ${attachments}">
          <img th:if="${file.image}" th:src="@{'/uploads/' + ${file.storedName}}" th:alt="${file.originalName}"
               style="width:100%;border-radius:var(--wp-radius-sm);max-height:480px;object-fit:cover;">
          <a th:unless="${file.image}" class="translate-link" th:href="@{'/uploads/' + ${file.storedName}}"
             th:text="${file.originalName}" download></a>
        </div>
      </div>

      <div class="post-card__actions">
        <button type="button" id="likeButton" style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;display:inline-flex;align-items:center;gap:4px;">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span id="likeCount" th:text="${post.likeCount > 0 ? post.likeCount : ''}"></span>
        </button>
        <span style="display:inline-flex;align-items:center;gap:4px;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          <span th:if="${#lists.size(comments) > 0}" th:text="${#lists.size(comments)}"></span>
        </span>

        <!-- 와이어프레임 35/45번: 북마크 - 백엔드/모델(bookmarked)은 이미 있었는데 버튼만 빠져있었음 -->
        <button type="button" id="bookmarkButton"
                th:classappend="${bookmarked} ? ' is-active'"
                style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;margin-left:auto;">
          <svg id="bookmarkIconFilled" class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" th:style="${bookmarked} ? '' : 'display:none;'"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          <svg id="bookmarkIconOutline" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" th:style="${bookmarked} ? 'display:none;' : ''"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
      </div>
    </article>
    </div>

    <div th:replace="~{community/fragments/fanComments :: commentsFragment}"></div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
  <script th:inline="javascript">
    new toastui.Editor.factory({
      el: document.querySelector('#contentViewer'),
      viewer: true,
      initialValue: /*[[${post.content}]]*/ ''
    });
  </script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script th:src="@{/js/community-post-detail.js}"></script>
</body>
</html>
