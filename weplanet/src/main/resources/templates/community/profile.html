<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--
      [와이어프레임 20~23번] 커뮤니티 – 내 프로필
      탭: 댓글 / 포스트 / 좋아요 / 북마크
    -->
    <title th:text="'내 프로필 | WePlaNet'">내 프로필 | WePlaNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/community.css}"/>
    <link rel="stylesheet" th:href="@{/css/shell.css}"/>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

<header th:replace="~{community/fragments/layout :: header}"></header>

<main class="container section" style="max-width:720px;" data-tabs>
    <div class="profile-panel">
        <div class="profile-cover"></div>
        <div class="profile-panel__info">
            <div class="flex-between" style="align-items:flex-end;">
                <div class="avatar avatar--lg" style="border:3px solid #fff;"
                     th:text="${#authentication.name.substring(0,1)}">나
                </div>
            </div>
            <h2 class="mt-12" style="font-size:var(--wp-fs-xl);font-weight:800;">
                <span th:text="${#authentication.name}">닉네임</span>
            </h2>
            <div class="profile-panel__stats">
                <div><strong th:text="${myFollowingCount}">0</strong><span>팔로잉</span></div>
            </div>
        </div>
        <nav class="profile-tabs">
            <a href="#" class="is-active" data-tab="comments" th:text="|댓글 ${#lists.size(myComments)}|">댓글</a>
            <a href="#" data-tab="posts" th:text="|포스트 ${#lists.size(myPosts)}|">포스트</a>
            <a href="#" data-tab="likes" th:text="|좋아요 ${#lists.size(likedPosts)}|">좋아요</a>
            <a href="#" data-tab="bookmarks" th:text="|북마크 ${#lists.size(bookmarkedPosts)}|">북마크</a>
        </nav>
    </div>

    <div class="flex-between mb-16">
        <div>
            <a class="form-select" style="width:auto;display:inline-flex;padding:0 12px;text-decoration:none;"
               th:href="@{''(sort='latest')}" th:classappend="${sort != 'oldest'} ? ' is-active'">최신순</a>
            <a class="form-select"
               style="width:auto;display:inline-flex;padding:0 12px;text-decoration:none;margin-left:8px;"
               th:href="@{''(sort='oldest')}" th:classappend="${sort == 'oldest'} ? ' is-active'">오래된 순</a>
        </div>
    </div>

    <!-- 댓글 히스토리 -->
    <div data-tab-panel="comments">
        <article class="post-card mb-16" th:each="comment : ${myComments}">
            <p class="text-xs text-muted mb-8"
               th:text="|원글 · ${comment.post.author != null ? comment.post.author.nickname : '(알 수 없음)'} · ${comment.post.title}|">
                원글</p>
            <p class="post-card__body" th:text="${comment.content}"></p>
            <p class="text-xs text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}"></p>
            <div class="post-card__actions">
                <form th:action="@{/posts/detail/{id}/comment/{cid}/delete(id=${comment.post.id}, cid=${comment.id})}"
                      method="post"
                      onsubmit="return WePlaNet.confirmSubmit(this, '삭제할까요?');">
                    <button type="submit" class="text-danger" style="display:inline-flex;align-items:center;gap:4px;">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                        삭제하기
                    </button>
                </form>
            </div>
        </article>
        <p th:if="${#lists.isEmpty(myComments)}" class="text-muted" style="padding:24px 0;">작성한 댓글이 없습니다.</p>
    </div>

    <!-- 포스트 히스토리 -->
    <div class="hidden" data-tab-panel="posts">
        <article class="post-card mb-16" th:each="post : ${myPosts}">
            <a th:href="${post.boardType.name() == 'FAN'}
                      ? @{/community/{artistId}/fan/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}
                      : @{/community/{artistId}/artist/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}"
               style="display:block;color:inherit;">
                <p class="post-card__body" th:text="${post.title}"></p>
                <p class="text-xs text-muted" th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}"></p>
            </a>
            <div class="post-card__actions">
                <span style="display:inline-flex;align-items:center;gap:4px;">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span th:if="${post.likeCount > 0}" th:text="${post.likeCount}"></span>
                </span>
                <span th:with="cc=${myPostCommentCounts.get(post.id)}" style="display:inline-flex;align-items:center;gap:4px;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    <span th:if="${cc > 0}" th:text="${cc}"></span>
                </span>
            </div>
        </article>
        <p th:if="${#lists.isEmpty(myPosts)}" class="text-muted" style="padding:24px 0;">작성한 포스트가 없습니다.</p>
    </div>

    <!-- 좋아요 -->
    <div class="hidden" data-tab-panel="likes">
        <article class="post-card mb-16" th:each="post : ${likedPosts}">
            <a th:href="${post.boardType.name() == 'FAN'}
                      ? @{/community/{artistId}/fan/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}
                      : @{/community/{artistId}/artist/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}"
               style="display:block;color:inherit;">
                <div class="post-card__head">
                    <div class="avatar"
                         th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
                    <div class="post-card__meta">
                        <div class="post-card__name"
                             th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></div>
                    </div>
                </div>
                <p class="post-card__body" th:text="${post.title}"></p>
            </a>
        </article>
        <p th:if="${#lists.isEmpty(likedPosts)}" class="text-muted" style="padding:24px 0;">좋아요한 게시글이 없습니다.</p>
    </div>

    <!-- 북마크 -->
    <div class="hidden" data-tab-panel="bookmarks">
        <article class="post-card mb-16" th:each="post : ${bookmarkedPosts}">
            <a th:href="${post.boardType.name() == 'FAN'}
                      ? @{/community/{artistId}/fan/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}
                      : @{/community/{artistId}/artist/{postId}(artistId=${post.artist != null ? post.artist.id : 0}, postId=${post.id})}"
               style="display:block;color:inherit;">
                <div class="post-card__head">
                    <div class="avatar"
                         th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
                    <div class="post-card__meta">
                        <div class="post-card__name"
                             th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></div>
                    </div>
                </div>
                <p class="post-card__body" th:text="${post.title}"></p>
            </a>
        </article>
        <div th:if="${#lists.isEmpty(bookmarkedPosts)}" class="empty-state">
            <strong>저장한 북마크가 없습니다</strong>
            마음에 드는 포스트를 저장해 보세요
        </div>
    </div>
</main>

<script th:replace="~{community/fragments/layout :: scripts}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/shell.js}"></script>
</body>
</html>
