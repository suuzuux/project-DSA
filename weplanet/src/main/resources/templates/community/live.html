<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Live | WePlaNet'">Live | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('live')}"></nav>

      <div class="board-toolbar" th:if="${isOwnCommunity or isManagedAgency}" style="margin-bottom:16px;">
        <div></div>
        <a class="btn btn--primary btn--sm"
           th:if="${isOwnCommunity}"
           th:href="@{/portal/live}">방송하기</a>
        <a class="btn btn--primary btn--sm"
           th:if="${isManagedAgency and !isOwnCommunity}"
           th:href="@{/portal/select-artist(artistId=${artist.id()}, next='live')}">방송하기</a>
      </div>

      <div id="community-live"
           th:attr="data-artist-id=${artist.id()},
                    data-user-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

        <div id="live-onair" hidden>
          <div class="live-now">
            <span>LIVE 방송 중입니다</span>
            <button type="button" id="live-back-btn" class="btn btn--ghost btn--sm">목록으로</button>
          </div>
          <div class="live-watch">
            <section class="live-watch__stage">
              <video id="live-player" autoplay playsinline></video>
              <button type="button" id="live-unmute-btn" class="btn btn--primary btn--sm live-watch__unmute" hidden>소리 켜기</button>
            </section>
            <aside class="live-watch__chat">
              <h2 class="live-watch__chat-title">실시간 댓글</h2>
              <div id="live-comments" class="live-watch__comments" aria-live="polite"></div>
              <form id="live-comment-form" class="live-watch__composer">
                <input id="live-comment-input" class="form-input" type="text" maxlength="500"
                       placeholder="댓글을 입력하세요" autocomplete="off" />
                <button type="submit" class="btn btn--primary">보내기</button>
              </form>
            </aside>
          </div>
        </div>

        <section class="live-replays" id="live-lobby">
          <div class="media-section__head">
            <h2 class="live-replays__title">라이브</h2>
          </div>
          <button type="button" id="live-featured" class="live-replay-card live-replay-card--live live-featured-card"
                  th:hidden="${liveStatus == null or !liveStatus.live}">
            <div class="live-replay-card__thumb">
              <span class="tag tag--live live-replay-card__badge">LIVE</span>
              <span class="live-replay-card__logo" th:text="${artist.logo()}">WP</span>
              <span class="live-replay-card__play">▶</span>
            </div>
            <div class="live-replay-card__body">
              <div class="live-replay-card__title" th:text="|${artist.nickname()} 라이브|">라이브</div>
              <div class="live-replay-card__meta">방송 중 · 클릭해서 시청</div>
            </div>
          </button>

          <div class="media-section__head live-replays__replay-head">
            <h2 class="live-replays__title">다시보기</h2>
          </div>
          <div class="live-replay-grid" th:if="${not #lists.isEmpty(liveReplays)}">
            <button type="button" class="live-replay-card"
                    th:each="replay : ${liveReplays}"
                    th:if="${replay.firstVideoFileId != null}"
                    th:attr="data-src=@{/board/media/file/{id}(id=${replay.firstVideoFileId})},
                             data-title=${replay.title}">
              <div class="live-replay-card__thumb">
                <video muted playsinline preload="metadata"
                       th:src="@{|/board/media/file/${replay.firstVideoFileId}#t=0.1|}"></video>
                <span class="live-replay-card__play">▶</span>
              </div>
              <div class="live-replay-card__body">
                <div class="live-replay-card__title" th:text="${replay.title}">라이브 다시보기</div>
                <div class="live-replay-card__meta"
                     th:with="y=${#temporals.year(replay.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                     th:text="${y == curY} ? ${#temporals.format(replay.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(replay.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
              </div>
            </button>
          </div>
          <p th:if="${#lists.isEmpty(liveReplays)}" class="list-empty">저장된 다시보기가 없습니다.</p>
        </section>
      </div>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <div id="live-replay-modal" class="live-replay-modal" hidden>
    <div class="live-replay-modal__panel" role="dialog" aria-modal="true">
      <div class="live-replay-modal__head">
        <h2 id="live-replay-title">다시보기</h2>
        <button type="button" id="live-replay-close" class="modal__close" aria-label="닫기">✕</button>
      </div>
      <video id="live-replay-player" class="live-replay-modal__video" controls playsinline></video>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script th:src="@{/js/community-live.js}"></script>
</body>
</html>
