<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Live | WePlaNet'">Live | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- SockJS/Stomp : DM 플로팅 위젯 실시간 채팅용 라이브러리 (dm-realtime.js가 필요로 함) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('live')}"></nav>

      <div class="board-toolbar">
        <h2 class="section__title" style="margin:0;display:inline-flex;align-items:center;gap:8px;">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Live Replay
        </h2>
        <div class="board-toolbar__actions">
          <label class="board-select">
            <svg class="board-select__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M3 5l2 2 4-4"></path><path d="M3 12h4"></path><path d="M3 19h4"></path></svg>
            <select class="form-select" aria-label="라이브 정렬">
              <option>최신순</option>
              <option>오래된 순</option>
            </select>
          </label>
          <label class="board-select">
            <svg class="board-select__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <select class="form-select" aria-label="연도 필터">
              <option>전체 연도</option>
            </select>
          </label>
        </div>
      </div>

      <p class="list-empty">표시할 라이브가 없습니다.</p>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
</body>
</html>
