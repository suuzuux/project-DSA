<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Live | WePlaNet'">Live | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('live')}"></nav>

      <div class="board-toolbar">
        <h2 class="section__title" style="margin:0;">Live Replay</h2>
        <div class="flex-center">
          <select class="form-select" style="width:auto;min-height:36px;">
            <option>최신순</option>
            <option>오래된 순</option>
          </select>
          <select class="form-select" style="width:auto;min-height:36px;">
            <option>전체 연도</option>
          </select>
        </div>
      </div>

      <p class="text-muted" style="padding:24px 0;">표시할 라이브가 없습니다.</p>
    </div>
    <aside th:replace="~{community/fragments/layout :: sidebarAside}"></aside>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
</body>
</html>
