<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    [와이어프레임] 커뮤니티 – Highlight
    탭: Highlight | Notice | Fan | Artist | Media | Live
    우측: Membership / Calendar / About
  -->
  <title th:text="${artist.nickname()} + ' – Highlight | WePlaNet'">Highlight | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('highlight')}"></nav>

      <!-- Notice 미리보기 -->
      <section class="widget mb-16">
        <div class="flex-between mb-8">
          <h2 class="widget__title">📢 Notice</h2>
          <a class="section__link" th:href="@{/community/{id}/notice(id=${artist.id()})}">더보기</a>
        </div>
        <p class="text-muted text-sm">등록된 공지가 없습니다.</p>
      </section>

      <!-- From Artist -->
      <section class="mb-16">
        <div class="section__head">
          <h2 class="section__title" th:text="|From ${artist.nickname()}|">From Artist</h2>
          <a class="section__link" th:href="@{/community/{id}/artist(id=${artist.id()})}">더보기</a>
        </div>
        <p class="text-muted">표시할 아티스트 게시글이 없습니다.</p>
      </section>

      <!-- Artist comments -->
      <section class="mb-16">
        <div class="section__head">
          <h2 class="section__title" th:text="|Comments by ${artist.nickname()}|">Comments</h2>
        </div>
        <p class="text-muted">표시할 댓글이 없습니다.</p>
      </section>

      <!-- Fan posts preview -->
      <section class="mb-16">
        <div class="section__head">
          <h2 class="section__title">Fan Posts</h2>
          <a class="section__link" th:href="@{/community/{id}/fan(id=${artist.id()})}">더보기</a>
        </div>
        <p class="text-muted">표시할 팬 게시글이 없습니다.</p>
      </section>

      <!-- Lives preview -->
      <section>
        <div class="section__head">
          <h2 class="section__title">Lives</h2>
          <a class="section__link" th:href="@{/community/{id}/live(id=${artist.id()})}">더보기</a>
        </div>
        <p class="text-muted">표시할 라이브가 없습니다.</p>
      </section>
    </div>

    <aside th:replace="~{community/fragments/layout :: sidebarAside}"></aside>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
</body>
</html>
