<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – 프로젝트 | WePlaNet'">프로젝트 | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- DM 플로팅 위젯 실시간 채팅에서 사용 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main">
      <nav th:replace="~{community/fragments/layout :: tabs('fan')}"></nav>

      <div class="board-toolbar">
        <div class="board-tabs">
          <a th:href="@{/community/{id}/fan(id=${artist.id()})}">포스트</a>
          <a class="is-active"
             th:href="@{/community/{id}/project(id=${artist.id()})}">프로젝트</a>
        </div>

        <div class="flex-center">
          <select class="form-select" style="width:auto;min-height:36px;" aria-label="프로젝트 정렬">
            <option>마감임박순</option>
            <option>인기순</option>
            <option>최신순</option>
          </select>

          <button type="button"
                  class="btn btn--primary btn--sm"
                  data-modal-open="projectCreateModal"
                  sec:authorize="hasRole('FAN')">
            프로젝트 등록하기
          </button>

          <a class="btn btn--primary btn--sm"
             th:href="@{/login}"
             sec:authorize="isAnonymous()">
            로그인 후 등록
          </a>
        </div>
      </div>

      <p th:if="${successMessage}"
         th:text="${successMessage}"
         style="margin:0 0 16px;padding:12px 14px;border-radius:8px;background:#e9f8ef;color:#18794e;font-weight:600;">
        프로젝트 등록 신청이 완료되었습니다.
      </p>

      <!-- 프로젝트 목록 조회를 연결하기 전의 빈 상태 -->
      <p class="text-muted" style="padding:24px 0;">
        표시할 팬 프로젝트가 없습니다.
      </p>
    </div>

    <aside th:replace="~{community/fragments/layout :: sidebarAside}"></aside>
  </div>

  <!-- 프로젝트 등록 모달 -->
  <div class="modal-backdrop" id="projectCreateModal" sec:authorize="hasRole('FAN')">
    <div class="modal modal--wide" onclick="event.stopPropagation()">
      <div class="modal__head">
        <h2 class="modal__title">프로젝트 등록하기</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>

      <p class="text-xs text-muted mb-16">
        기본 뱃지 5개 이상과 스페셜 뱃지 1개 이상을 모두 보유한 팬만 등록할 수 있어요.
      </p>

      <form id="projectCreateForm"
            th:action="@{/community/{id}/project(id=${artist.id()})}"
            th:object="${projectRequestDTO}"
            method="post"
            enctype="multipart/form-data">

        <input type="hidden" th:field="*{artistId}" />

        <div class="form-group is-invalid"
             th:if="${#fields.hasGlobalErrors()}"
             data-global-error>
          <p class="form-error"
             style="display:block"
             th:each="error : ${#fields.globalErrors()}"
             th:text="${error}">
            프로젝트 등록에 실패했습니다.
          </p>
        </div>

        <div class="form-group"
             th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
          <label class="form-label" for="projectTitle">프로젝트 제목</label>
          <input id="projectTitle"
                 class="form-input"
                 type="text"
                 th:field="*{title}"
                 maxlength="20"
                 required
                 placeholder="20자 이내로 입력해주세요" />
          <p class="form-error" th:errors="*{title}"></p>
        </div>

        <div class="grid-2">
          <div class="form-group"
               th:classappend="${#fields.hasErrors('eventType')} ? 'is-invalid' : ''">
            <label class="form-label" for="eventType">이벤트 유형</label>
            <select id="eventType" class="form-select" th:field="*{eventType}" required>
              <option value="">선택해주세요</option>
              <option value="BIRTHDAY_CAFE">생일카페</option>
              <option value="BILLBOARD">전광판</option>
              <option value="CONCERT">콘서트</option>
              <option value="ETC">기타</option>
            </select>
            <p class="form-error" th:errors="*{eventType}"></p>
          </div>

          <div class="form-group"
               th:classappend="${#fields.hasErrors('coverImage')} ? 'is-invalid' : ''">
            <label class="form-label" for="coverImage">대표 이미지</label>
            <input id="coverImage"
                   class="form-input"
                   type="file"
                   th:field="*{coverImage}"
                   accept="image/*"
                   required />
            <p class="form-error" th:errors="*{coverImage}"></p>
          </div>
        </div>

        <div class="form-group"
             th:classappend="${#fields.hasErrors('goalAmount')} ? 'is-invalid' : ''">
          <label class="form-label" for="goalAmount">목표 금액</label>
          <input id="goalAmount"
                 class="form-input"
                 type="number"
                 th:field="*{goalAmount}"
                 min="10000"
                 max="3000000"
                 step="1000"
                 required
                 placeholder="10,000원 ~ 3,000,000원" />
          <p class="form-error" th:errors="*{goalAmount}"></p>
          <p class="form-hint">최소 10,000원, 최대 3,000,000원</p>
        </div>

        <div class="grid-2">
          <div class="form-group"
               th:classappend="${#fields.hasErrors('fundingStartAt')} ? 'is-invalid' : ''">
            <label class="form-label" for="fundingStartAt">모금 시작</label>
            <input id="fundingStartAt"
                   class="form-input"
                   type="datetime-local"
                   th:field="*{fundingStartAt}"
                   required />
            <p class="form-error" th:errors="*{fundingStartAt}"></p>
          </div>

          <div class="form-group"
               th:classappend="${#fields.hasErrors('fundingEndAt')} ? 'is-invalid' : ''">
            <label class="form-label" for="fundingEndAt">모금 마감</label>
            <input id="fundingEndAt"
                   class="form-input"
                   type="datetime-local"
                   th:field="*{fundingEndAt}"
                   required />
            <p class="form-error" th:errors="*{fundingEndAt}"></p>
          </div>
        </div>

        <div class="form-group"
             th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''">
          <label class="form-label" for="description">프로젝트 상세 설명</label>
          <textarea id="description"
                    class="form-textarea"
                    th:field="*{description}"
                    maxlength="1000"
                    data-count="1000"
                    required
                    placeholder="프로젝트 목표와 진행 계획을 입력해주세요"></textarea>
          <span class="char-count text-xs text-muted"></span>
          <p class="form-error" th:errors="*{description}"></p>
        </div>

        <div class="form-group"
             th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''">
          <label class="form-label" for="phoneNumber">본인인증 휴대폰 번호</label>
          <input id="phoneNumber"
                 class="form-input"
                 type="tel"
                 th:field="*{phoneNumber}"
                 inputmode="numeric"
                 maxlength="11"
                 pattern="01[016789][0-9]{7,8}"
                 required
                 placeholder="하이픈 없이 숫자만 입력" />
          <p class="form-error" th:errors="*{phoneNumber}"></p>
          <p class="form-hint">등록 전 휴대폰 본인인증이 완료된 회원이어야 합니다.</p>
        </div>

        <div class="grid-2">
          <div class="form-group"
               th:classappend="${#fields.hasErrors('settlementBank')} ? 'is-invalid' : ''">
            <label class="form-label" for="settlementBank">정산 은행</label>
            <select id="settlementBank"
                    class="form-select"
                    th:field="*{settlementBank}"
                    required>
              <option value="">은행을 선택해주세요</option>
              <option th:each="bank : ${settlementBanks}"
                      th:value="${bank}"
                      th:text="${bank.displayName}">국민은행</option>
            </select>
            <p class="form-error" th:errors="*{settlementBank}"></p>
          </div>

          <div class="form-group"
               th:classappend="${#fields.hasErrors('accountNumber')} ? 'is-invalid' : ''">
            <label class="form-label" for="accountNumber">계좌번호</label>
            <input id="accountNumber"
                   class="form-input"
                   type="text"
                   th:field="*{accountNumber}"
                   inputmode="numeric"
                   minlength="6"
                   maxlength="30"
                   pattern="[0-9]{6,30}"
                   autocomplete="off"
                   required
                   placeholder="하이픈 없이 숫자만 입력" />
            <p class="form-error" th:errors="*{accountNumber}"></p>
          </div>
        </div>

        <p class="form-hint mb-16">
          예금주명은 휴대폰 본인인증으로 확인된 회원 실명을 사용합니다.
        </p>

        <button type="submit" class="btn btn--primary btn--block">
          프로젝트 등록 신청
        </button>
      </form>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/shell.js}"></script>
  <script th:src="@{/js/dm-realtime.js}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("projectCreateForm");
      const modal = document.getElementById("projectCreateModal");

      if (form && modal && form.querySelector(".is-invalid, [data-global-error]")) {
        modal.classList.add("is-open");
      }
    });
  </script>
</body>
</html>
