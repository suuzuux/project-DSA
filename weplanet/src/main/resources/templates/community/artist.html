<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artist.nickname()} + ' – Artist | WePlaNet'">Artist | WePlaNet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/community.css}" />
  <link rel="stylesheet" th:href="@{/css/shell.css}" />
  <!-- SockJS / Stomp (dm-realtime.js 용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <!-- Toast UI Editor (글쓰기 모달 마크다운 에디터) -->
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
</head>
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.principal.nickname : null},
               data-role=${#authentication.name != 'anonymousUser' ? #authentication.principal.roleName : null},
               data-fan-id=${#authentication.name != 'anonymousUser' ? #authentication.principal.id : null}">

  <header th:replace="~{community/fragments/layout :: header}"></header>
  <div th:replace="~{community/fragments/layout :: hero}"></div>

  <div class="community-body">
    <div class="community-main" id="communityPostBoard"
         th:attr="data-artist-id=${artist.id()}, data-board-tab='artist', data-list-base=@{${artist.homeUrl() + '/artist'}}">
      <nav th:replace="~{community/fragments/layout :: tabs('artist')}"></nav>

      <div class="board-toolbar">
        <!-- 전체 / 사진·미디어 필터 칩 -->
        <div class="chip-row" style="margin:0;">
          <a class="chip" th:classappend="${boardFilter == null} ? ' is-active'"
             th:href="@{${artist.homeUrl() + '/artist'}(sort=${sort})}">
            <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <span th:text="#{community.board.allChip}">전체</span>
          </a>
          <a class="chip" th:classappend="${boardFilter == 'media'} ? ' is-active'"
             th:href="@{${artist.homeUrl() + '/artist'}(filter='media', sort=${sort})}">
            <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span th:text="#{community.board.mediaChip}">사진/미디어</span>
          </a>
        </div>
        <div class="board-toolbar__actions">
          <label class="board-select">
            <svg class="board-select__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M3 5l2 2 4-4"></path><path d="M3 12h4"></path><path d="M3 19h4"></path></svg>
            <select id="artistSort"
                    class="form-select"
                    th:aria-label="#{community.board.artistSortAria}"
                    th:attr="data-base-url=${boardFilter == 'media'} ? @{${artist.homeUrl() + '/artist'}(filter='media')} : @{${artist.homeUrl() + '/artist'}}">
              <option value="latest" th:selected="${sort != 'popular'}" th:text="#{community.board.sortLatest}">최신순</option>
              <option value="popular" th:selected="${sort == 'popular'}" th:text="#{community.board.sortPopular}">인기순</option>
            </select>
          </label>
          <button type="button" class="btn btn--primary btn--sm" data-modal-open="writePostModal"
                  th:if="${isOwnCommunity}"
                  th:text="#{community.post.writeButton}">포스트 작성하기</button>
        </div>
      </div>

      <div th:replace="~{community/fragments/postList :: postListFragment}"></div>
    </div>

    <aside th:replace="~{community/fragments/layout :: sidebarAside(false, false)}"></aside>
  </div>

  <button type="button" id="postScrollTop" class="post-scroll-top" th:aria-label="#{community.board.scrollTopAria}" hidden>
    <span aria-hidden="true">↑</span>
  </button>

  <!-- 아티스트 포스트 작성 모달 (커뮤니티 아티스트만) -->
  <div class="modal-backdrop" id="writePostModal"
       th:if="${isOwnCommunity}">
    <div class="modal modal--wide" onclick="event.stopPropagation()">
      <div class="modal__head">
        <h2 class="modal__title" th:text="#{community.post.writeButton}">포스트 작성하기</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>
      <form id="writePostForm"
            th:action="@{/posts/artist/new(artistId=${artist.id()})}"
            method="post"
            enctype="multipart/form-data">
        <input type="hidden" name="artistId" th:value="${artist.id()}" />

        <textarea id="writePostContent" name="content" hidden maxlength="1000"></textarea>
        <div id="writePostEditor"></div>
        <div class="flex-between mt-8">
          <span class="char-count text-xs text-muted">0 / 1000</span>
          <div class="flex-center">
            <label class="icon-btn" th:title="#{community.post.imageTitle}" style="cursor:pointer;">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <input type="file" id="writePostFiles" name="files" multiple
                     accept="image/*,application/pdf,.txt,.zip" style="display:none;" />
            </label>
            <span id="writePostFileCount" class="text-xs text-muted"></span>
          </div>
        </div>
        <p id="writePostError" class="form-error mt-8" style="display:none;"></p>
        <button type="submit" id="writePostSubmit" class="btn btn--primary btn--block mt-16" disabled th:text="#{community.post.submit}">등록하기</button>
      </form>
    </div>
  </div>

  <script th:replace="~{community/fragments/layout :: scripts}"></script>
  <script th:src="@{/js/common/main.js}"></script>
  <script th:src="@{/js/common/shell.js}"></script>
  <script th:src="@{/js/common/dm-realtime.js}"></script>
  <script th:src="@{/js/community/community-posts.js}"></script>
  <script>
    (function () {
      var sortSelect = document.getElementById("artistSort");
      if (!sortSelect) return;
      sortSelect.addEventListener("change", function () {
        var base = sortSelect.getAttribute("data-base-url") || window.location.pathname;
        var url = new URL(base, window.location.origin);
        url.searchParams.set("sort", sortSelect.value);
        window.location.href = url.pathname + url.search;
      });
    })();
  </script>
</body>
</html>
