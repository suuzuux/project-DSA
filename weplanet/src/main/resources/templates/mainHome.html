<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>WePlaNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <!-- SockJS/Stomp : DM 플로팅 위젯에서 실시간 채팅을 쓰기 위한 라이브러리 (chat/fanChatRoom.html과 동일) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<!--
    data-shell="fan" : 위석현님이 만든 공용 위젯(좌측 메뉴/DM 플로팅 채팅)을 이 페이지에 띄우라는 표시.
    data-fan-id : 로그인 기능이 아직 없어서, "지금 나는 몇 번 팬 계정인가"를 임시로 알려주는 값 (기본 1번)
-->
<body data-shell="fan" data-base="/"
      th:attr="data-authenticated=${#authentication.name != 'anonymousUser'},
               data-nickname=${#authentication.name != 'anonymousUser' ? #authentication.name : null},
               data-fan-id=${fanId}">

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>

    <div class="header-actions">
        <button type="button" class="icon-btn" aria-label="언어">🌐</button>
        <button type="button" class="icon-btn icon-btn--badge" aria-label="알림">🔔</button>
        <span sec:authorize="isAnonymous()">
            <a class="btn btn--ghost btn--sm" th:href="@{/signup}">회원가입</a>
            <a class="btn btn--primary btn--sm" th:href="@{/login}">로그인</a>
        </span>

        <span sec:authorize="isAuthenticated()" style="display:flex;align-items:center;gap:10px;">
            <span sec:authentication="name" style="font-weight:600;font-size:var(--wp-fs-sm);">사용자</span>님 환영합니다
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn--ghost btn--sm">로그아웃</button>
            </form>
        </span>
    </div>
</header>

<div class="container section">
    <div class="section__head">
        <h2 class="section__title">게시판</h2>
    </div>
    <div class="grid-2">
        <a class="rising-card" th:href="@{/posts/fan}">
            <div class="rising-card__info">
                <strong>팬 게시판</strong>
                <span>팬들이 남긴 이야기 보기</span>
            </div>
        </a>
        <a class="rising-card" th:href="@{/posts/artist}">
            <div class="rising-card__info">
                <strong>아티스트 게시판</strong>
                <span>아티스트 소식 보기</span>
            </div>
        </a>
    </div>

    <div class="section__head" style="margin-top:24px;">
        <h3 class="section__title" style="font-size:var(--wp-fs-md);">글쓰기</h3>
    </div>
    <div style="display:flex;gap:10px;">
        <a class="btn btn--soft btn--sm" th:href="@{/posts/fan/new}">팬 게시판 글쓰기</a>
        <a class="btn btn--soft btn--sm" th:href="@{/posts/artist/new}">아티스트 게시판 글쓰기</a>
    </div>

    <section class="mb-24" style="margin-top:32px;">
        <div class="week-nav">
            <button type="button" class="icon-btn" aria-label="이전 주">◀</button>
            <strong>이번 주 스케줄</strong>
            <button type="button" class="icon-btn" aria-label="다음 주">▶</button>
        </div>
        <p class="text-xs text-muted mb-8">에이전시에서 등록한 아티스트 일정 · 일자별 최대 4개</p>
        <div class="week-grid"></div>
    </section>
</div>

<!-- 테스트용 - 로그인 기능이 아직 없어서, DM 위젯에서 "나"로 사용할 팬 계정을 바꿔볼 수 있게 해둠 -->
<p class="text-xs text-muted" style="text-align:center;margin-top:24px;">
    DM 테스트 계정:
    <a th:href="@{/(fanId=1)}">1번(팬)</a> |
    <a th:href="@{/(fanId=4)}">4번(AI팬봇)</a>
</p>

<script th:inline="javascript">
    window.__WEPLANET_ARTISTS__ = [
      /*[# th:each="a : ${artists}"]*/
      { "id": /*[[${a.id()}]]*/, "nickname": /*[[${a.nickname()}]]*/, "logo": /*[[${a.logo()}]]*/ },
      /*[/]*/
    ];
</script>
<script th:src="@{/js/shell.js}"></script>
<script th:src="@{/js/dm-realtime.js}"></script>

</body>
</html>
