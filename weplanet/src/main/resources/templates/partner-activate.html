<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{partnerActivate.pageTitle}">WePlaNet – 계정 활성화</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
<div class="auth-card">
  <h1 class="auth-card__title"
      th:text="${target == null
      ? #messages.msg('partnerActivate.title.default') : (target.role().name() == 'ARTIST'
      ? #messages.msg('partnerActivate.title.artist') : #messages.msg('partnerActivate.title.agency'))}">
    계정 활성화</h1>

  <!-- 링크가 잘못됐거나 만료된 경우: 폼 없이 안내만 -->
  <div th:if="${linkError}">
    <p class="text-sm" style="color:#c45c26;margin:16px 0;" th:text="${linkError}">
      유효하지 않은 활성화 링크입니다.
    </p>
    <a class="btn btn--ghost btn--block" th:href="@{/portal/login}" th:text="#{partnerActivate.backToLogin}">
      로그인 화면으로
    </a>
  </div>

  <!-- 정상 링크: 비밀번호 설정 폼 -->
  <div th:if="${linkError == null}">
    <!-- 이름은 escapeXml 로 한 번 이스케이프한 뒤 굵게 감싸서 utext 로 출력 -->
    <p class="text-sm text-muted" style="margin:12px 0 20px;"
       th:with="nameHtml=${'<strong>' + #strings.escapeXml(target.nickname()) + '</strong>'}"
       th:utext="${target.role().name() == 'ARTIST'}
       ? #{partnerActivate.greeting.artist(${nameHtml})}
       : #{partnerActivate.greeting.agency(${nameHtml})}">
      <strong>이름</strong>님, 환영합니다.
    </p>

    <form th:action="@{/partner/activate}" method="post">
      <!-- 링크에 있던 값을 그대로 다시 보낸다 -->
      <input type="hidden" name="key" th:value="${key}" />
      <input type="hidden" name="token" th:value="${token}" />

      <div class="form-group">
        <label class="form-label" for="username" th:text="#{partnerActivate.label.username}">로그인 아이디</label>
        <input class="form-input" id="username" type="text"
               th:value="${target.username()}" readonly />
      </div>

      <div class="form-group">
        <label class="form-label" for="newPassword" th:text="#{portalLogin.passwordLabel}">비밀번호</label>
        <input class="form-input" id="newPassword" name="newPassword" type="password"
               placeholder="영문, 숫자 포함 8~20자" th:placeholder="#{resetPassword.newPasswordPlaceholder}"
               autocomplete="new-password" minlength="8" maxlength="20" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword" th:text="#{signup.passwordConfirmLabel}">비밀번호 확인</label>
        <input class="form-input" id="confirmPassword" name="confirmPassword" type="password"
               placeholder="비밀번호 다시 입력" th:placeholder="#{resetPassword.confirmPasswordPlaceholder}"
               autocomplete="new-password" minlength="8" maxlength="20" required />
      </div>

      <p th:if="${formError}" class="text-sm" style="color:#c45c26;margin-bottom:12px;"
         th:text="${formError}">
        비밀번호 형식을 확인해주세요.
      </p>

      <button type="submit" class="btn btn--primary btn--block" th:text="#{partnerActivate.submit}">계정 활성화</button>
    </form>
  </div>
</div>
</body>
</html>
