<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
</head>
<body>

<h1 th:text="${post.title}"></h1>
<div id="contentViewer"></div>

<!-- 첨부파일 목록 - 이미지는 바로 보여주고, 그 외 파일은 다운로드 링크로 -->
<div th:if="${not #lists.isEmpty(attachments)}">
    <h4>첨부파일</h4>
    <div th:each="file : ${attachments}">
        <div th:if="${file.image}">
            <img th:src="@{'/uploads/' + ${file.storedName}}" th:alt="${file.originalName}" style="max-width:400px;">
        </div>
        <div th:unless="${file.image}">
            <a th:href="@{'/uploads/' + ${file.storedName}}" th:text="${file.originalName}" download></a>
        </div>
    </div>
</div>

<p>작성일: <span th:text="${post.createdAt}"></span></p>

<a th:href="@{/posts/detail/{id}/edit(id=${post.id})}">게시글 수정</a>

<form th:action="@{/posts/detail/{id}/delete(id=${post.id})}" method="post" style="display:inline;">
    <select name="testUserId">
        <option value="1">1번(팬)으로 삭제 시도</option>
        <option value="2">2번(아티스트)으로 삭제 시도</option>
    </select>
    <button type="submit">게시글 삭제</button>
</form>

<form th:action="@{/posts/detail/{id}/report(id=${post.id})}" method="post" style="display:inline;">
    <select name="testUserId">
        <option value="1">1번(팬)으로 신고</option>
        <option value="2">2번(아티스트)으로 신고</option>
    </select>
    <select name="reason">
        <option value="SPAM">스팸</option>
        <option value="ABUSE">욕설/혐오</option>
        <option value="SEXUAL">음란물</option>
        <option value="ETC">기타</option>
    </select>
    <button type="submit">게시글 신고</button>
</form>

<form th:action="@{/posts/detail/{id}/summarize(id=${post.id})}" method="post" style="display:inline;">
    <button type="submit">AI 요약보기</button>
</form>

<div th:if="${summary}">
    <h4>AI 요약</h4>
    <p th:text="${summary}"></p>
</div>

<select id="likeUserId">
    <option value="1">1번 - 팬 계정</option>
    <option value="2">2번 - 아티스트 계정</option>
</select>
<button id="likeButton" type="button">좋아요 (<span id="likeCount" th:text="${post.likeCount}"></span>)</button>

<script th:inline="javascript">
    const postId = /*[[${post.id}]]*/ 0;

    document.getElementById('likeButton').addEventListener('click', function () {
        const testUserId = document.getElementById('likeUserId').value;

        fetch(`/posts/detail/${postId}/like?testUserId=${testUserId}`, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                document.getElementById('likeCount').textContent = data.likeCount;
            });
    });
</script>

<hr>

<h3>댓글</h3>

<div id="commentSection" th:fragment="commentsFragment">
    <form id="commentForm" th:action="@{/posts/detail/{id}/comment(id=${post.id})}" method="post">
        <select name="testUserId">
            <option value="1">1번 - 팬 계정</option>
            <option value="2">2번 - 아티스트 계정</option>
        </select>
        <input type="text" name="content" placeholder="댓글을 입력하세요">
        <button type="submit">댓글 작성</button>
    </form>

    <ul>
        <li th:each="comment : ${comments}">
            <span th:text="${comment.author.nickname}"></span> :
            <span th:text="${comment.content}"></span>
            (<span th:text="${comment.createdAt}"></span>)

            <form class="comment-delete-form"
                  th:action="@{/posts/detail/{id}/comment/{commentId}/delete(id=${post.id}, commentId=${comment.id})}"
                  method="post" style="display:inline;">
                <select name="testUserId">
                    <option value="1">1번(팬)으로 삭제 시도</option>
                    <option value="2">2번(아티스트)으로 삭제 시도</option>
                </select>
                <button type="submit">삭제</button>
            </form>

            <form th:action="@{/posts/detail/{id}/comment/{commentId}/report(id=${post.id}, commentId=${comment.id})}"
                  method="post" style="display:inline;">
                <select name="testUserId">
                    <option value="1">1번(팬)으로 신고</option>
                    <option value="2">2번(아티스트)으로 신고</option>
                </select>
                <select name="reason">
                    <option value="SPAM">스팸</option>
                    <option value="ABUSE">욕설/혐오</option>
                    <option value="SEXUAL">음란물</option>
                    <option value="ETC">기타</option>
                </select>
                <button type="submit">댓글 신고</button>
            </form>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(comments)}">등록된 댓글이 없습니다.</p>
</div>

<script>
    // 댓글 작성/삭제 폼은 페이지 전체를 새로고침하지 않고,
    // 댓글 영역(#commentSection)만 fetch로 다시 받아와서 교체함.
    // 댓글 삭제 폼은 목록이 갱신될 때마다 새로 생기므로, 이벤트 위임(document에 걸어둠) 방식 사용
    document.addEventListener('submit', function (e) {
        const form = e.target;

        if (form.id === 'commentForm' || form.classList.contains('comment-delete-form')) {
            e.preventDefault();

            fetch(form.action, {
                method: 'POST',
                headers: {'X-Requested-With': 'fetch'},
                body: new URLSearchParams(new FormData(form))
            })
                .then(function (response) {
                    return response.text();
                })
                .then(function (html) {
                    document.getElementById('commentSection').outerHTML = html;
                });
        }
    });
</script>

<a th:href="@{/}">홈으로</a>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script th:inline="javascript">
    new toastui.Editor.factory({
        el: document.querySelector('#contentViewer'),
        viewer: true,
        initialValue: /*[[${post.content}]]*/ ''
    });
</script>

</body>
</html>
