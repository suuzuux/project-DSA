<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    [와이어프레임] 아이디로 로그인
    - 아이디 찾기: 이름·생년월일
    - 비밀번호 찾기: 아이디·이름·생년월일 후 이메일 재설정 (목업 alert)
  -->
  <title>WePlaNet – 아이디로 로그인</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="auth-card__back" th:href="@{/}">← 뒤로</a>
    <div class="flex-between">
      <p class="auth-card__brand" style="margin:0;">We<span>Pla</span>Net</p>
      <button type="button" class="icon-btn" aria-label="언어">🌐</button>
    </div>

    <h1 class="auth-card__title mt-16">로그인</h1>

    <p th:if="${param.error}" class="text-sm" style="color:#c45c26;margin-top:8px;">
      아이디 또는 비밀번호가 올바르지 않습니다.
    </p>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label" for="loginId">아이디</label>
        <input class="form-input" id="loginId" name="username" type="text" placeholder="아이디 입력" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPw">비밀번호</label>
        <input class="form-input" id="loginPw" name="password" type="password" placeholder="비밀번호 입력" required autocomplete="current-password" />
      </div>

      <div class="auth-links">
        <a href="#" onclick="WePlaNet.alert('아이디 찾기: 이름, 생년월일 입력 (목업)');return false;">아이디를 까먹었어요</a>
        <a href="#" onclick="WePlaNet.alert('비밀번호 재설정: 아이디·이름·생년월일 확인 후 이메일 발송 (목업)');return false;">비밀번호를 까먹었어요</a>
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg">로그인하기</button>
    </form>

    <p class="text-sm text-muted" style="margin-top:20px;text-align:center;">
      아직 계정이 없으신가요?
      <a th:href="@{/signup}" style="color:var(--wp-brand);font-weight:600;">회원가입</a>
    </p>
  </div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
