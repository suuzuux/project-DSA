<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    [와이어프레임] 아이디로 로그인
    - 아이디 찾기: 이름+이메일 인증 후 아이디 표시 (/find-id)
    - 비밀번호 찾기: 아이디+이메일 인증 후 새 비밀번호 설정 (/find-password)
  -->
  <title th:text="#{login.pageTitle}">WePlaNet – 아이디로 로그인</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
<div class="auth-card">
  <a class="auth-card__back" th:href="@{/login}" th:text="#{login.back}">← 뒤로</a>
  <div class="flex-between">
    <p class="auth-card__brand" style="margin:0;">We<span>Pla</span>Net</p>
  </div>

  <h1 class="auth-card__title mt-16" th:text="#{login.heading}">로그인</h1>

  <p th:if="${param.error}" class="text-sm" style="color:#c45c26;margin-top:8px;" th:text="#{login.error}">
    아이디 또는 비밀번호가 올바르지 않습니다.
  </p>
  <p th:if="${param.withdrawn}" class="text-sm" style="color:#63704a;margin-top:8px;" th:text="#{login.withdrawnNotice}">
    탈퇴가 완료되었습니다. 그동안 이용해주셔서 감사합니다.
  </p>
  <p th:if="${param.unlinked}" class="text-sm" style="color:#63704a;margin-top:8px;" th:text="#{login.unlinkedNotice}">
    연동이 해제되어 로그아웃되었습니다. 다시 로그인해주세요.
  </p>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label class="form-label" for="loginId" th:text="#{login.usernameLabel}">아이디</label>
      <input class="form-input" id="loginId" name="username" type="text" th:placeholder="#{login.usernamePlaceholder}" placeholder="아이디 입력" required autocomplete="username" />
    </div>
    <div class="form-group">
      <label class="form-label" for="loginPw" th:text="#{login.passwordLabel}">비밀번호</label>
      <input class="form-input" id="loginPw" name="password" type="password" th:placeholder="#{login.passwordPlaceholder}" placeholder="비밀번호 입력" required autocomplete="current-password" />
    </div>

    <div class="auth-links">
      <a th:href="@{/find-id}" th:text="#{login.forgotUsername}">아이디를 까먹었어요</a>
      <a th:href="@{/find-password}" th:text="#{login.forgotPassword}">비밀번호를 까먹었어요</a>
    </div>

    <button type="submit" class="btn btn--primary btn--block btn--lg" th:text="#{login.submitButton}">로그인하기</button>
  </form>

  <p class="text-sm text-muted" style="margin-top:20px;text-align:center;">
    <span th:text="#{login.noAccountPrompt}">아직 계정이 없으신가요?</span>
    <a th:href="@{/signup}" style="color:var(--wp-brand);font-weight:600;" th:text="#{login.signupLink}">회원가입</a>
  </p>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
