<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <title th:text="#{partnership.pageTitle}">아티스트·소속사 등록 신청 | WePlaNet</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}"
    />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>

<body class="auth-page">

<div
        class="auth-card"
        style="max-width: 560px;"
>
    <a
            th:href="@{/}"
            class="auth-card__back"
            th:text="#{partnership.backToMain}"
    >
        ← 메인으로
    </a>

    <!-- 신청 완료 화면 -->
    <div th:if="${param.submitted != null}">
        <h1 class="auth-card__title" th:text="#{partnership.submitted.title}">
            신청이 접수되었습니다
        </h1>

        <p
                class="auth-card__desc"
                style="line-height: 1.7;"
        >
            <span th:text="#{partnership.submitted.desc1}">담당자가 신청 내용을 확인한 뒤</span><br/>
            <span th:text="#{partnership.submitted.desc2}">입력해주신 이메일로 검토 결과를 안내드립니다.</span>
        </p>

        <p
                class="form-hint"
                style="margin-top: 16px;"
                th:text="#{partnership.submitted.hint}"
        >
            신청은 관리자 검토 전까지 ‘검토 대기’ 상태로
            안전하게 보관됩니다.
        </p>

        <a
                th:href="@{/}"
                class="btn btn--primary btn--block btn--lg"
                style="margin-top: 24px;"
                th:text="#{partnership.submitted.backButton}"
        >
            메인으로 돌아가기
        </a>
    </div>

    <!-- 신청 폼 -->
    <div th:unless="${param.submitted != null}">
        <h1 class="auth-card__title" th:text="#{partnership.heading}">
            아티스트·소속사 등록 신청
        </h1>

        <p class="auth-card__desc">
            <span th:text="#{partnership.intro1}">WePlaNet에서 활동할 아티스트 또는 소속사라면</span><br/>
            <span th:text="#{partnership.intro2}">아래 신청서를 작성해주세요.</span>
        </p>

        <p
                th:if="${errorMessage}"
                th:text="${errorMessage}"
                class="form-error"
                style="margin-bottom: 16px;"
        >
            오류 메시지
        </p>

        <form
                th:action="@{/partnership}"
                method="post"
        >
            <div class="form-group">
                <label
                        class="form-label"
                        for="applicantType"
                >
                    <th:block th:text="#{partnership.field.type}">신청 유형</th:block>
                    <span style="color: var(--wp-danger, #d33);">
                        *
                    </span>
                </label>

                <select
                        class="form-select"
                        id="applicantType"
                        name="applicantType"
                        required
                >
                    <option value="" th:text="#{partnership.field.typePlaceholder}">
                        신청 유형을 선택해주세요
                    </option>

                    <option
                            value="ARTIST"
                            th:selected="${
                                form != null
                                and form.applicantType == 'ARTIST'
                            }"
                            th:text="#{partnership.type.ARTIST}"
                    >
                        아티스트
                    </option>

                    <option
                            value="AGENCY"
                            th:selected="${
                                form != null
                                and form.applicantType == 'AGENCY'
                            }"
                            th:text="#{partnership.type.AGENCY}"
                    >
                        소속사
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label
                        class="form-label"
                        for="applicantName"
                >
                    <th:block th:text="#{partnership.field.name}">아티스트명 또는 소속사명</th:block>
                    <span style="color: var(--wp-danger, #d33);">
                        *
                    </span>
                </label>

                <input
                        class="form-input"
                        type="text"
                        id="applicantName"
                        name="applicantName"
                        maxlength="100"
                        placeholder="활동명 또는 소속사명을 입력해주세요"
                        th:placeholder="#{partnership.field.namePlaceholder}"
                        th:value="${
                            form != null
                            ? form.applicantName
                            : ''
                        }"
                        required
                />

                <p class="form-hint" th:text="#{partnership.field.nameHint}">
                    아티스트는 활동명, 소속사는 회사명을 입력해주세요.
                </p>
            </div>

            <div class="form-group">
                <label
                        class="form-label"
                        for="contactName"
                >
                    <th:block th:text="#{partnership.field.contactName}">담당자명</th:block>
                    <span style="color: var(--wp-danger, #d33);">
                        *
                    </span>
                </label>

                <input
                        class="form-input"
                        type="text"
                        id="contactName"
                        name="contactName"
                        maxlength="50"
                        placeholder="담당자 이름"
                        th:placeholder="#{partnership.field.contactNamePlaceholder}"
                        th:value="${
                            form != null
                            ? form.contactName
                            : ''
                        }"
                        required
                />
            </div>

            <div class="form-group">
                <label
                        class="form-label"
                        for="email"
                >
                    <th:block th:text="#{partnership.field.email}">회신받을 이메일</th:block>
                    <span style="color: var(--wp-danger, #d33);">
                        *
                    </span>
                </label>

                <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        maxlength="150"
                        placeholder="example@email.com"
                        th:value="${
                            form != null
                            ? form.email
                            : ''
                        }"
                        required
                />

                <p class="form-hint" th:text="#{partnership.field.emailHint}">
                    승인 또는 반려 결과가 이 이메일로 전송됩니다.
                </p>
            </div>

            <div class="form-group">
                <label
                        class="form-label"
                        for="phone"
                        th:text="#{partnership.field.phone}"
                >
                    연락처
                </label>

                <input
                        class="form-input"
                        type="text"
                        id="phone"
                        name="phone"
                        maxlength="30"
                        placeholder="010-0000-0000"
                        th:value="${
                            form != null
                            ? form.phone
                            : ''
                        }"
                />
            </div>

            <div class="form-group">
                <label
                        class="form-label"
                        for="message"
                >
                    <th:block th:text="#{partnership.field.message}">신청 내용</th:block>
                    <span style="color: var(--wp-danger, #d33);">
                        *
                    </span>
                </label>

                <textarea
                        class="form-textarea"
                        id="message"
                        name="message"
                        rows="7"
                        maxlength="2000"
                        placeholder="활동 이력, 소속 정보, WePlaNet 등록 목적 등을 작성해주세요."
                        th:placeholder="#{partnership.field.messagePlaceholder}"
                        th:text="${
                            form != null
                            ? form.message
                            : ''
                        }"
                        required
                ></textarea>

                <p class="form-hint" th:text="#{partnership.field.messageHint}">
                    최대 2,000자까지 입력할 수 있습니다.
                </p>
            </div>

            <button
                    type="submit"
                    class="btn btn--primary btn--block btn--lg"
                    th:text="#{partnership.submit}"
            >
                등록 신청하기
            </button>
        </form>
    </div>
</div>

</body>
</html>
