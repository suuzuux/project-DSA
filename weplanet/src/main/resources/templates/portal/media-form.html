<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미디어 등록 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-shell" th:classappend="${artistSelected} ? ' portal-shell--agency' : ' portal-shell--agency-pick'">
    <th:block th:replace="~{portal/fragments/sidebars :: sidebars}"></th:block>

    <main class="portal-main">
      <div class="portal-main__head">
        <h1>미디어 등록</h1>
        <a class="btn btn--ghost btn--sm" th:href="@{/portal/media}">← 뒤로 가기</a>
      </div>

      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>

      <form class="settings-block" style="max-width:800px;" th:action="@{/portal/media}" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label class="form-label" for="title">제목</label>
          <input class="form-input" id="title" name="title" placeholder="제목을 입력해주세요." required />
        </div>
        <div class="form-group">
          <label class="form-label" for="content">본문내용</label>
          <textarea class="form-textarea" id="content" name="content" placeholder="본문을 입력해주세요."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="files">첨부파일</label>
          <input class="form-input" id="files" name="files" type="file" multiple accept="image/*,video/*" required />
        </div>
        <div class="flex-center" style="justify-content:flex-end;">
          <button type="submit" class="btn btn--primary">바로등록</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
