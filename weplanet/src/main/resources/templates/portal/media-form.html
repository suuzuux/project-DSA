<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [와이어프레임] 미디어 등록 + 미리보기 -->
  <title>미디어 등록 | Artist Portal</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/portal.css" />
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-sidebar__org">
        <div class="agency">YG Entertainment.</div>
        <div class="artist">TREASURE</div>
      </div>
      <nav class="portal-sidebar__nav">
        <a href="dashboard.html">📊 대시보드</a>
        <a href="notices.html">📢 공지사항 관리</a>
        <a href="schedule.html">📆 스케줄 관리</a>
        <a class="is-active" href="media.html">🎬 미디어 관리</a>
        <a href="profile.html">👤 프로필 관리</a>
        <a href="reports.html">⚙ 신고함 / 차단</a>
      </nav>
    </aside>

    <main class="portal-main">
      <div class="portal-main__head">
        <h1>미디어 등록</h1>
        <a class="btn btn--ghost btn--sm" href="media.html">← 뒤로 가기</a>
      </div>

      <form class="settings-block" data-mock-submit="media.html" style="max-width:800px;">
        <div class="form-group">
          <label class="form-label">제목</label>
          <input class="form-input" placeholder="제목을 입력해주세요." />
        </div>
        <div class="form-group">
          <label class="form-label">본문내용</label>
          <textarea class="form-textarea" placeholder="본문을 입력해주세요."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">첨부파일</label>
          <div class="flex-center">
            <button type="button" class="btn btn--ghost btn--sm">사진</button>
            <button type="button" class="btn btn--ghost btn--sm">동영상</button>
            <button type="button" class="btn btn--ghost btn--sm">링크</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">카테고리</label>
            <select class="form-select">
              <option>VIDEO</option>
              <option>PHOTO</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">공개여부</label>
            <select class="form-select">
              <option>공개</option>
              <option>멤버십 전용</option>
              <option>비공개</option>
            </select>
          </div>
        </div>
        <div class="flex-center" style="justify-content:flex-end;">
          <button type="button" class="btn btn--ghost" data-modal-open="mediaPreview">미리보기</button>
          <button type="button" class="btn btn--ghost">예약등록</button>
          <button type="submit" class="btn btn--primary">바로등록</button>
        </div>
      </form>
    </main>
  </div>

  <div class="modal-backdrop" id="mediaPreview">
    <div class="modal">
      <div class="modal__head">
        <h2 class="modal__title">미리보기</h2>
        <button type="button" class="modal__close" data-modal-close>✕</button>
      </div>
      <div class="media-ph mb-16" style="aspect-ratio:16/9;border-radius:8px;">미디어 미리보기</div>
      <p class="text-sm text-muted">#TREASURE #트레저 #TREASUREMAP #EP_87 #WORKMAP</p>
    </div>
  </div>

  <script src="../../js/main.js"></script>
</body>
</html>
