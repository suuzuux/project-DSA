<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스케줄 관리 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-sidebar__org">
        <div class="agency">WePlaNet</div>
        <div class="artist" th:text="${artist.nickname}">아티스트</div>
      </div>
      <nav class="portal-sidebar__nav">
        <a th:href="@{/portal/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? ' is-active'">📊 대시보드</a>
        <a th:href="@{/portal/notices}" th:classappend="${activeMenu == 'notices'} ? ' is-active'">📢 공지사항 관리</a>
        <a th:href="@{/portal/schedule}" th:classappend="${activeMenu == 'schedule'} ? ' is-active'">📆 스케줄 관리</a>
        <a th:href="@{/portal/media}" th:classappend="${activeMenu == 'media'} ? ' is-active'">🎬 미디어 관리</a>
        <a th:href="@{/portal/profile}" th:classappend="${activeMenu == 'profile'} ? ' is-active'">👤 프로필 관리</a>
        <a th:href="@{/portal/reports}" th:classappend="${activeMenu == 'reports'} ? ' is-active'">⚙ 신고함 / 차단</a>
      </nav>
    </aside>

    <main class="portal-main">
      <div class="portal-main__head">
        <h1>스케줄 관리</h1>
        <div class="flex-center">
          <a class="btn btn--ghost btn--sm" th:href="@{/portal/schedule(month=${prevMonth})}">이전 달</a>
          <strong th:text="${selectedMonth}">2026-08</strong>
          <a class="btn btn--ghost btn--sm" th:href="@{/portal/schedule(month=${nextMonth})}">다음 달</a>
        </div>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:#1f7a52;margin-bottom:12px;" th:text="${msg}"></p>
      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>

      <form class="settings-block" style="max-width:800px;margin-bottom:20px;" th:action="@{/portal/schedules}" method="post">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="title">일정 제목</label>
            <input class="form-input" id="title" name="title" placeholder="예: 팬사인회" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="scheduleAt">일시</label>
            <input class="form-input" id="scheduleAt" name="scheduleAt" type="datetime-local" required />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="location">장소</label>
            <input class="form-input" id="location" name="location" placeholder="예: 서울 올림픽홀" />
          </div>
          <div class="form-group">
            <label class="form-label" for="description">설명</label>
            <input class="form-input" id="description" name="description" placeholder="간단한 설명" />
          </div>
        </div>
        <div class="flex-center" style="justify-content:flex-end;">
          <button type="submit" class="btn btn--primary">일정 추가</button>
        </div>
      </form>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>일시</th>
              <th>제목</th>
              <th>장소</th>
              <th>설명</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(schedules)}">
              <td colspan="5" class="text-sm text-muted">선택한 달에 등록된 일정이 없습니다.</td>
            </tr>
            <tr th:each="schedule : ${schedules}">
              <td th:text="${#temporals.format(schedule.scheduleAt, 'yyyy.MM.dd HH:mm')}">2026.08.25 19:00</td>
              <td th:text="${schedule.title}">일정 제목</td>
              <td th:text="${schedule.location != null ? schedule.location : '-'}">장소</td>
              <td th:text="${schedule.description != null ? schedule.description : '-'}">설명</td>
              <td>
                <form th:action="@{/portal/schedules/{id}/delete(id=${schedule.id})}" method="post">
                  <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
