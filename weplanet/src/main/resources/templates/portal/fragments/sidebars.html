<th:block th:fragment="sidebars">
  <aside class="portal-artists" th:if="${isAgency}">
    <div class="portal-artists__head">
      <div class="portal-artists__label">에이전시 포털</div>
      <div class="portal-artists__title">소속 아티스트</div>
    </div>
    <nav class="portal-artists__list" th:if="${!#lists.isEmpty(managedArtists)}">
      <a class="portal-artists__item"
         th:each="item : ${managedArtists}"
         th:href="@{/portal/select-artist(artistId=${item.id}, next=${activeMenu})}"
         th:classappend="${artistSelected and artist != null and item.id == artist.id} ? ' is-active'"
         th:text="${item.nickname}">아티스트</a>
    </nav>
    <p class="portal-artists__empty" th:if="${#lists.isEmpty(managedArtists)}">소속 아티스트가 없습니다.</p>
    <div class="portal-artists__footer">
      <!-- 아티스트 등록 - 웜그레이 채움 버튼 + 사람(user-plus) 아이콘 -->
      <a class="portal-artists__add" th:href="@{/portal/artists/new}"
         th:classappend="${activeMenu == 'artistNew'} ? ' is-active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" y1="8" x2="19" y2="14"></line>
          <line x1="22" y1="11" x2="16" y2="11"></line>
        </svg>
        <span>아티스트 등록</span>
      </a>
      <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="portal-logout-link">로그아웃</button>
      </form>
    </div>
  </aside>

  <aside class="portal-sidebar" th:if="${artistSelected}">
    <div class="portal-sidebar__org">
      <div class="agency" th:text="${isAgency} ? '관리 메뉴' : '아티스트 포털'">관리 메뉴</div>
      <div class="artist" th:text="${artist.nickname}">아티스트</div>
    </div>
    <nav class="portal-sidebar__nav">
      <th:block th:if="${isAgency}">
        <a th:href="@{/portal/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? ' is-active'">📊 대시보드</a>
        <a th:href="@{/portal/notices}" th:classappend="${activeMenu == 'notices'} ? ' is-active'">📢 공지사항 관리</a>
        <a th:href="@{/portal/schedule}" th:classappend="${activeMenu == 'schedule'} ? ' is-active'">📆 스케줄 관리</a>
        <a th:href="@{/portal/media}" th:classappend="${activeMenu == 'media'} ? ' is-active'">🎬 미디어 관리</a>
        <a th:href="@{/portal/goods}" th:classappend="${activeMenu == 'goods'} ? ' is-active'">🛒 굿즈 관리</a>
      </th:block>
      <a th:href="@{/portal/live}" th:classappend="${activeMenu == 'live'} ? ' is-active'">📡 방송</a>
      <th:block th:if="${isAgency}">
        <a th:href="@{/portal/profile}" th:classappend="${activeMenu == 'profile'} ? ' is-active'">👤 프로필 관리</a>
        <a th:href="@{/portal/members}" th:classappend="${activeMenu == 'members'} ? ' is-active'">👥 멤버 관리</a>
        <a th:href="@{/portal/reports}" th:classappend="${activeMenu == 'reports'} ? ' is-active'">⚙ 신고함 / 차단</a>
      </th:block>
    </nav>
    <div class="portal-sidebar__footer">
      <a th:href="@{/community/{artistId}(artistId=${artist.id})}">← 커뮤니티 이동</a><br th:if="${!isAgency}" /><br th:if="${!isAgency}" />
      <form th:if="${!isAgency}" th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="portal-logout-link">로그아웃</button>
      </form>
    </div>
  </aside>
</th:block>

<th:block th:fragment="pickHint(title)">
  <div class="portal-pick-hint" th:if="${!artistSelected}">
    <h1 th:text="${title}">관리</h1>
    <p>왼쪽에서 관리할 소속 아티스트를 선택하면 메뉴가 열립니다.</p>
  </div>
</th:block>
