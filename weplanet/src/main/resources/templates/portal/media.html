<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미디어 관리 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-sidebar__org">
        <div class="agency">WePlaNet</div>
        <div class="artist" th:text="${artist.nickname}">아티스트</div>
      </div>
      <nav class="portal-sidebar__nav">
        <a th:href="@{/portal/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? ' is-active'">📊 대시보드</a>
        <a th:href="@{/portal/notices}" th:classappend="${activeMenu == 'notices'} ? ' is-active'">📢 공지사항 관리</a>
        <a th:href="@{/portal/schedule}" th:classappend="${activeMenu == 'schedule'} ? ' is-active'">📆 스케줄 관리</a>
        <a th:href="@{/portal/media}" th:classappend="${activeMenu == 'media'} ? ' is-active'">🎬 미디어 관리</a>
        <a th:href="@{/portal/profile}" th:classappend="${activeMenu == 'profile'} ? ' is-active'">👤 프로필 관리</a>
        <a th:href="@{/portal/reports}" th:classappend="${activeMenu == 'reports'} ? ' is-active'">⚙ 신고함 / 차단</a>
      </nav>
      <div class="portal-sidebar__footer">
        <a th:href="@{/community/{artistId}(artistId=${artist.id})}">← 커뮤니티 이동</a><br /><br />
        <a th:href="@{/logout}">로그아웃</a>
      </div>
    </aside>

    <main class="portal-main">
      <div class="portal-main__head">
        <h1>미디어 관리</h1>
        <a class="btn btn--primary btn--sm" th:href="@{/portal/media/new}">등록하기</a>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:#1f7a52;margin-bottom:12px;" th:text="${msg}"></p>
      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>유형</th>
              <th>제목</th>
              <th>업로드일자</th>
              <th>파일 수</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(mediaList)}">
              <td colspan="5" class="text-sm text-muted">등록된 미디어가 없습니다.</td>
            </tr>
            <tr th:each="media : ${mediaList}">
              <td>
                <span class="tag tag--public"
                      th:text="${media.files != null && !media.files.isEmpty() ? media.files[0].mediaType : 'MEDIA'}">VIDEO</span>
              </td>
              <td th:text="${media.title}">미디어 제목</td>
              <td th:text="${#temporals.format(media.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.25 16:00</td>
              <td th:text="${media.fileCount}">1</td>
              <td>
                <div class="flex-center">
                  <a class="btn btn--ghost btn--sm" th:href="@{/community/{artistId}/media(artistId=${artist.id})}">보기</a>
                  <form th:action="@{/portal/media/{id}/delete(id=${media.id})}" method="post">
                    <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
