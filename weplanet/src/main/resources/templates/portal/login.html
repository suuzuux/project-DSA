<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{portalLogin.pageTitle}">Artist Portal – 로그인</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-login">
    <aside class="portal-login__visual">
      <p class="text-xs" style="letter-spacing:0.12em;text-transform:uppercase;opacity:.7;margin-bottom:12px;">
        ARTIST / AGENCY PORTAL
      </p>
      <h1 th:utext="#{portalLogin.visualHeading}">아티스트와 에이전시가<br />팬과 더 가까이 연결합니다.</h1>
      <p th:text="#{portalLogin.visualDesc}">공식 콘텐츠, 커뮤니티, 일정, 미디어를 하나의 공간에서 관리하세요.</p>
      <a th:href="@{/}" class="mt-24" style="color:#9fd;font-size:13px;" th:text="#{portalLogin.backToMain}">← 메인 사이트로 이동</a>
    </aside>

    <div class="portal-login__form-wrap">
      <div class="portal-login__form">
        <h2 id="portalLoginTitle" class="auth-card__title" style="margin-bottom:8px;" th:text="#{portalLogin.artist.title}">아티스트 로그인</h2>
        <p id="portalLoginLead" class="text-sm text-muted" style="margin-bottom:20px;" th:text="#{portalLogin.artist.lead}">
          아티스트 계정으로만 로그인할 수 있습니다.
        </p>

        <div class="role-tabs" role="radiogroup" th:attr="aria-label=#{portalLogin.roleTabsLabel}">
          <button type="button" class="is-active" data-portal-role="ARTIST" aria-pressed="true" th:text="#{portalLogin.tabArtist}">아티스트</button>
          <button type="button" data-portal-role="AGENCY" aria-pressed="false" th:text="#{portalLogin.tabAgency}">에이전시</button>
        </div>

        <p th:if="${param.error}" class="text-sm" style="color:#c45c26;margin-bottom:16px;"
           th:text="${param.error[0] == 'role'} ? #{portalLogin.errorRole} : #{portalLogin.errorCredentials}">
          아이디 또는 비밀번호가 올바르지 않습니다.
        </p>
        <p th:if="${param.expired}" class="text-sm" style="color:#c45c26;margin-bottom:16px;" th:text="#{portalLogin.expired}">
          세션이 만료되어 다시 로그인해주세요.
        </p>
        <p th:if="${param.duplicateLogin}" class="text-sm" style="color:#c45c26;margin-bottom:16px;" th:text="#{portalLogin.duplicateLogin}">
          다른 기기에서 로그인되어 로그아웃되었습니다.
        </p>

        <form th:action="@{/login}" method="post" id="portalLoginForm">
          <input type="hidden" name="portalLogin" value="true" />
          <input type="hidden" name="portalRole" id="portalRole" value="ARTIST" />
          <div class="form-group">
            <label class="form-label" for="artistId" id="portalIdLabel" th:text="#{portalLogin.artist.idLabel}">아티스트 아이디</label>
            <input class="form-input" id="artistId" name="username" type="text"
                   th:placeholder="#{portalLogin.artist.idPlaceholder}" placeholder="아티스트 아이디 입력" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label class="form-label" for="artistPw" th:text="#{portalLogin.passwordLabel}">비밀번호</label>
            <input class="form-input" id="artistPw" name="password" type="password"
                   th:placeholder="#{portalLogin.passwordPlaceholder}" placeholder="비밀번호 입력" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="portalSubmitBtn" th:text="#{portalLogin.artist.submit}">아티스트 로그인</button>
        </form>

        <p class="text-sm text-muted mt-16" style="text-align:center;" id="portalLoginHint" th:utext="#{portalLogin.artist.hint}">
          로그인 후 본인 커뮤니티로 이동합니다.<br />
          테스트 계정 예) <strong>artist_hyeseon</strong> / Test1234
        </p>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    (function () {
      var roleInput = document.getElementById("portalRole");
      var titleEl = document.getElementById("portalLoginTitle");
      var leadEl = document.getElementById("portalLoginLead");
      var idLabel = document.getElementById("portalIdLabel");
      var idInput = document.getElementById("artistId");
      var submitBtn = document.getElementById("portalSubmitBtn");
      var hintEl = document.getElementById("portalLoginHint");
      var tabs = document.querySelectorAll(".role-tabs [data-portal-role]");

      // 서버가 내려준 번역 문자열 - 원래 한국어 문자열은 각 값의 fallback으로 남겨둠
      var MSG = {
        titleSuffix: /*[[#{portalLogin.titleSuffix}]]*/ " | Artist Portal",
        ARTIST: {
          title: /*[[#{portalLogin.artist.title}]]*/ "아티스트 로그인",
          lead: /*[[#{portalLogin.artist.lead}]]*/ "아티스트 계정으로만 로그인할 수 있습니다.",
          idLabel: /*[[#{portalLogin.artist.idLabel}]]*/ "아티스트 아이디",
          placeholder: /*[[#{portalLogin.artist.idPlaceholder}]]*/ "아티스트 아이디 입력",
          submit: /*[[#{portalLogin.artist.submit}]]*/ "아티스트 로그인",
          hint: /*[[#{portalLogin.artist.hint}]]*/ "로그인 후 본인 커뮤니티로 이동합니다.<br />테스트 계정 예) <strong>artist_hyeseon</strong> / Test1234"
        },
        AGENCY: {
          title: /*[[#{portalLogin.agency.title}]]*/ "에이전시 로그인",
          lead: /*[[#{portalLogin.agency.lead}]]*/ "에이전시 계정으로만 로그인할 수 있습니다.",
          idLabel: /*[[#{portalLogin.agency.idLabel}]]*/ "에이전시 아이디",
          placeholder: /*[[#{portalLogin.agency.idPlaceholder}]]*/ "에이전시 아이디 입력",
          submit: /*[[#{portalLogin.agency.submit}]]*/ "에이전시 로그인",
          hint: /*[[#{portalLogin.agency.hint}]]*/ "로그인 후 포털 대시보드로 이동합니다.<br />테스트 계정 예) <strong>agency_wp</strong> / Test1234"
        }
      };

      function applyRole(role) {
        var c = MSG[role] || MSG.ARTIST;
        roleInput.value = role;
        titleEl.textContent = c.title;
        leadEl.textContent = c.lead;
        idLabel.textContent = c.idLabel;
        idInput.placeholder = c.placeholder;
        submitBtn.textContent = c.submit;
        hintEl.innerHTML = c.hint;
        document.title = c.title + MSG.titleSuffix;
        tabs.forEach(function (btn) {
          var on = btn.getAttribute("data-portal-role") === role;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      tabs.forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyRole(btn.getAttribute("data-portal-role"));
        });
      });

      var params = new URLSearchParams(window.location.search);
      var initial = (params.get("role") || "").toUpperCase();
      applyRole(initial === "AGENCY" ? "AGENCY" : "ARTIST");
    })();
  </script>
</body>
</html>
