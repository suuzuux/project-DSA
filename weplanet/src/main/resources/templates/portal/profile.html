<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{portalProfile.pageTitle}">프로필 관리 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
</head>
<body>
  <div class="portal-shell"
       th:classappend="${isAgency} ? (${artistSelected} ? ' portal-shell--agency' : ' portal-shell--agency-pick') : ''">
    <th:block th:replace="~{portal/fragments/sidebars :: sidebars}"></th:block>

    <main class="portal-main">
      <th:block th:replace="~{portal/fragments/sidebars :: pickHint(${#messages.msg('portalProfile.heading')})}"></th:block>
      <th:block th:if="${artistSelected}">
      <div class="portal-main__head">
        <h1 th:text="#{portalProfile.heading}">프로필 관리</h1>
        <a class="btn btn--ghost btn--sm" th:href="@{/community/{artistId}(artistId=${artist.id})}" th:text="#{portalProfile.openCommunity}">커뮤니티 열기</a>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:#63704a;margin-bottom:12px;" th:text="${msg}"></p>
      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>
      <p class="text-sm text-muted" style="margin-bottom:16px;" th:text="#{portalProfile.desc}">
        팬 프로필 편집과 같은 방식으로 사진을 등록하면, 커뮤니티명 왼쪽 아바타에 표시됩니다.
      </p>

      <form class="portal-profile-edit" style="max-width:520px;"
            th:action="@{/portal/profile}" method="post" enctype="multipart/form-data">

        <!-- 배경 이미지 미리보기 (3:1) -->
        <div class="pe-cover-preview pe-cover-preview--header" id="profileEditBackgroundPreview"
             th:classappend="${backgroundPublicUrl == null} ? ' is-empty'">
          <img th:if="${backgroundPublicUrl != null}" th:src="${backgroundPublicUrl}" alt=""/>
          <div class="pe-cover-preview__hint" th:if="${backgroundPublicUrl == null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7h3l2-2h8l2 2h3v13H3z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span th:text="#{portalProfile.coverEmptyHint}">배경 이미지를 추가해 주세요</span>
          </div>
        </div>

        <div style="text-align:center;margin-bottom:12px;">
          <div class="avatar" id="profileEditAvatarPreview"
               th:attr="data-initial=${#strings.substring(artist.nickname,0,1)}"
               style="width:96px;height:96px;margin:-96px auto 0;font-size:34px;
                      border:4px solid var(--wp-surface, #fff);position:relative;">
            <img th:if="${avatarPublicUrl != null}"
                 th:src="${avatarPublicUrl}" alt=""
                 style="width:100%;height:100%;object-fit:cover;display:block;"/>
            <span th:if="${avatarPublicUrl == null}"
                  th:text="${#strings.substring(artist.nickname,0,1)}">아</span>
          </div>
        </div>

        <div class="pe-field">
          <input type="text" id="profileEditNickname" name="nickname"
                 maxlength="50" autocomplete="off" required
                 th:attr="aria-label=#{portalProfile.nicknameAria}"
                 th:value="${artist.nickname}"/>
          <button type="button" class="pe-clear" th:attr="aria-label=#{portalProfile.nicknameClearAria}"
                  data-clear-for="profileEditNickname">✕</button>
        </div>
        <p class="text-xs text-muted pe-count" data-count-for="profileEditNickname">0 / 50</p>

        <div class="pe-field">
          <input type="text" id="profileEditBio" name="intro"
                 maxlength="30" autocomplete="off"
                 th:attr="aria-label=#{portalProfile.introAria}"
                 th:placeholder="#{portalProfile.introPlaceholder}"
                 placeholder="(선택) 커뮤니티 About에 노출될 소개글을 작성하세요"
                 th:value="${artistProfile.intro}"/>
          <button type="button" class="pe-clear" th:attr="aria-label=#{portalProfile.introClearAria}"
                  data-clear-for="profileEditBio">✕</button>
        </div>
        <p class="text-xs text-muted pe-count" data-count-for="profileEditBio">0 / 30</p>

        <input type="file" id="profileEditAvatar" name="avatar" accept="image/*" class="hidden"/>
        <input type="file" id="profileEditBackground" name="background" accept="image/*" class="hidden"/>
        <input type="hidden" name="removeAvatar" id="removeAvatarFlag" value="false"/>
        <input type="hidden" name="removeBackground" id="removeBackgroundFlag" value="false"/>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;">
          <div class="pe-imgbtn">
            <button type="button" class="btn btn--ghost btn--sm"
                    data-menu-toggle="peAvatarMenu" th:text="#{portalProfile.editAvatarButton}">프로필 이미지 편집</button>
            <div class="pe-menu hidden" id="peAvatarMenu">
              <button type="button" data-file-trigger="profileEditAvatar" th:text="#{portalProfile.loadFromGallery}">사진첩에서 불러오기</button>
              <button type="button" class="is-danger" data-image-remove="Avatar"
                      th:attr="data-has-image=${hasAvatarImage}" th:text="#{portalProfile.deleteImage}">이미지 삭제하기</button>
            </div>
          </div>
          <div class="pe-imgbtn">
            <button type="button" class="btn btn--ghost btn--sm"
                    data-menu-toggle="peBackgroundMenu" th:text="#{portalProfile.editBackgroundButton}">배경 이미지 편집</button>
            <div class="pe-menu hidden" id="peBackgroundMenu">
              <button type="button" data-file-trigger="profileEditBackground" th:text="#{portalProfile.loadFromGallery}">사진첩에서 불러오기</button>
              <button type="button" class="is-danger" data-image-remove="Background"
                      th:attr="data-has-image=${hasBackgroundImage}" th:text="#{portalProfile.deleteImage}">이미지 삭제하기</button>
            </div>
          </div>
        </div>
        <p class="text-xs text-muted" style="text-align:center;" data-file-name-for="profileEditAvatar"></p>
        <p class="text-xs text-muted" style="text-align:center;margin-bottom:20px;" data-file-name-for="profileEditBackground"></p>

        <div class="portal-profile-extra">
          <div class="form-group">
            <label class="form-label" for="realName"><th:block th:text="#{portalProfile.realNameLabel}">본명</th:block> <span class="text-xs text-muted" th:text="#{portalProfile.optionalHint}">(선택)</span></label>
            <input class="form-input" id="realName" name="realName" maxlength="50"
                   th:placeholder="#{portalProfile.realNamePlaceholder}" placeholder="미입력 시 기존 값 유지"
                   th:value="${artist.realName}" />
          </div>
          <div class="form-group">
            <label class="form-label" for="email" th:text="#{portalProfile.emailLabel}">이메일</label>
            <input class="form-input" id="email" name="email" type="email" th:value="${artist.email}" required />
          </div>
          <div class="form-group">
            <span class="form-label" th:text="#{portalProfile.genderLabel}">성별</span>
            <div class="portal-gender-options">
              <label class="portal-gender-option">
                <input type="radio" name="gender" value="MALE"
                       th:checked="${artist.gender != null and artist.gender.name() == 'MALE'}" /> <span th:text="#{portalProfile.genderMale}">남</span>
              </label>
              <label class="portal-gender-option">
                <input type="radio" name="gender" value="FEMALE"
                       th:checked="${artist.gender != null and artist.gender.name() == 'FEMALE'}" /> <span th:text="#{portalProfile.genderFemale}">여</span>
              </label>
              <label class="portal-gender-option">
                <input type="radio" name="gender" value="OTHER"
                       th:checked="${artist.gender == null or artist.gender.name() == 'OTHER'}" /> <span th:text="#{portalProfile.genderOther}">미상</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="birthDate" th:text="#{portalProfile.birthDateLabel}">생일</label>
            <input class="form-input" id="birthDate" name="birthDate" type="date"
                   th:value="${artist.birthDate}" />
            <p class="text-xs text-muted mt-8" th:text="#{portalProfile.birthDateHint}">저장 시 캘린더에 생일 일정이 자동 등록·갱신됩니다.</p>
          </div>
        </div>

        <div style="border-top:1px solid var(--wp-hairline, #e5e5e5);margin:16px 0 0;padding:16px 0;">
          <button type="submit" class="btn btn--primary btn--block" th:text="#{portalProfile.saveButton}">저장</button>
        </div>
      </form>
      </th:block>
    </main>
  </div>

  <!-- 이미지 크롭 모달 (아바타·배경 공용) -->
  <div class="modal-backdrop" id="imageCropModal">
    <div class="modal" style="width:min(100%, 760px);">
      <div class="modal__head">
        <strong class="modal__title" id="imageCropModalTitle" th:text="#{portalProfile.cropModalTitle}">이미지 편집</strong>
        <button type="button" class="modal__close" data-crop-cancel th:attr="aria-label=#{portalProfile.close}">✕</button>
      </div>
      <div class="crop-stage" id="imageCropStage">
        <img id="imageCropTarget" alt=""/>
      </div>
      <div class="crop-zoom-row">
        <span class="text-xs text-muted" th:text="#{portalProfile.zoomOut}">축소</span>
        <input type="range" id="imageCropZoom" min="0" max="1" step="0.01" value="0" th:attr="aria-label=#{portalProfile.zoomAria}"/>
        <span class="text-xs text-muted" th:text="#{portalProfile.zoomIn}">확대</span>
      </div>
      <div class="crop-actions">
        <button type="button" class="btn btn--ghost btn--sm" data-crop-cancel th:text="#{portalProfile.cancel}">취소</button>
        <button type="button" class="btn btn--primary btn--sm" id="imageCropApply" th:text="#{portalProfile.apply}">적용</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script th:inline="javascript">
    // 크롭 모달 제목을 화면 언어로 덮어쓴다 (공용 profile-image-crop.js).
    window.WEPLANET_PROFILE_CROP_TITLES = {
      Avatar: /*[[#{portalProfile.js.avatarEditTitle}]]*/ "프로필 이미지 편집",
      Background: /*[[#{portalProfile.js.backgroundEditTitle}]]*/ "배경 이미지 편집",
      HeaderImage: /*[[#{portalProfile.js.headerEditTitle}]]*/ "헤더 이미지 편집"
    };
  </script>
  <script th:src="@{/js/common/profile-image-crop.js(v=10)}"></script>
  <script th:inline="javascript">
    (function () {
      "use strict";

      var MSG = {
        avatarLabel: /*[[#{portalProfile.js.avatarLabel}]]*/ "프로필 이미지",
        backgroundLabel: /*[[#{portalProfile.js.backgroundLabel}]]*/ "배경 이미지",
        noImageToDelete: /*[[#{portalProfile.js.noImageToDelete}]]*/ "삭제할 {0}가 없습니다.",
        confirmDelete: /*[[#{portalProfile.js.confirmDelete}]]*/ "{0}를 삭제하시겠습니까?\n저장을 눌러야 실제로 적용됩니다.",
        deletedPending: /*[[#{portalProfile.js.deletedPending}]]*/ "{0} 삭제 예정 · 저장을 눌러야 적용됩니다",
        coverEmptyHint: /*[[#{portalProfile.coverEmptyHint}]]*/ "배경 이미지를 추가해 주세요"
      };

      function format(template, value) {
        return template.replace("{0}", value);
      }

      document.querySelectorAll("[data-count-for]").forEach(function (label) {
        var input = document.getElementById(label.getAttribute("data-count-for"));
        if (!input) return;
        var max = input.getAttribute("maxlength");
        var render = function () {
          label.textContent = (input.value || "").length + " / " + max;
        };
        input.addEventListener("input", render);
        render();
      });

      document.querySelectorAll("[data-clear-for]").forEach(function (btn) {
        var input = document.getElementById(btn.getAttribute("data-clear-for"));
        if (!input) return;
        btn.addEventListener("click", function () {
          input.value = "";
          input.dispatchEvent(new Event("input"));
          input.focus();
        });
      });

      function closeAllMenus() {
        document.querySelectorAll(".pe-menu").forEach(function (m) {
          m.classList.add("hidden");
        });
      }
      document.querySelectorAll("[data-menu-toggle]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var menu = document.getElementById(btn.getAttribute("data-menu-toggle"));
          var willOpen = menu.classList.contains("hidden");
          closeAllMenus();
          if (willOpen) menu.classList.remove("hidden");
        });
      });
      document.addEventListener("click", closeAllMenus);
      document.querySelectorAll(".pe-menu").forEach(function (menu) {
        menu.addEventListener("click", function (e) { e.stopPropagation(); });
      });

      document.querySelectorAll("[data-file-trigger]").forEach(function (btn) {
        var input = document.getElementById(btn.getAttribute("data-file-trigger"));
        if (!input) return;
        btn.addEventListener("click", function () {
          closeAllMenus();
          input.click();
        });
      });

      document.querySelectorAll("[data-image-remove]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var kind = btn.getAttribute("data-image-remove");
          var label = kind === "Avatar" ? MSG.avatarLabel : MSG.backgroundLabel;
          var notice = document.querySelector('[data-file-name-for="profileEdit' + kind + '"]');
          if (btn.getAttribute("data-has-image") !== "true") {
            closeAllMenus();
            alert(format(MSG.noImageToDelete, label));
            return;
          }
          if (!confirm(format(MSG.confirmDelete, label))) return;
          closeAllMenus();
          var fileInput = document.getElementById("profileEdit" + kind);
          if (fileInput) fileInput.value = "";
          document.getElementById("remove" + kind + "Flag").value = "true";
          if (notice) notice.textContent = format(MSG.deletedPending, label);
          if (kind === "Avatar") {
            var preview = document.getElementById("profileEditAvatarPreview");
            if (preview) {
              preview.innerHTML = "<span>" + (preview.getAttribute("data-initial") || "") + "</span>";
            }
          } else if (kind === "Background") {
            var bgPreview = document.getElementById("profileEditBackgroundPreview");
            if (bgPreview) {
              bgPreview.classList.add("is-empty");
              bgPreview.innerHTML =
                '<div class="pe-cover-preview__hint">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
                'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<path d="M3 7h3l2-2h8l2 2h3v13H3z"></path><circle cx="12" cy="13" r="4"></circle></svg>' +
                '<span>' + MSG.coverEmptyHint + '</span></div>';
            }
          }
        });
      });

      document.querySelectorAll("[data-file-name-for]").forEach(function (label) {
        var id = label.getAttribute("data-file-name-for");
        var input = document.getElementById(id);
        if (!input) return;
        var kind = id.replace("profileEdit", "");
        // 배경 이미지는 HeaderImage 크롭 설정(3:1)
        var cropConfigKind = kind === "Background" ? "HeaderImage" : kind;
        input.addEventListener("change", function () {
          var file = input.files && input.files[0];
          if (!file) {
            label.textContent = "";
            return;
          }

          var flag = document.getElementById("remove" + kind + "Flag");
          if (flag) flag.value = "false";

          var previewEl = document.getElementById("profileEdit" + kind + "Preview");

          if (window.ProfileImageCrop && window.ProfileImageCrop.open(kind, file, input, previewEl, label, cropConfigKind)) {
            return;
          }

          label.textContent = file.name;
          if (previewEl) previewEl.classList.remove("is-empty");
          if (previewEl && kind === "Avatar") {
            previewEl.innerHTML =
              '<img src="' + URL.createObjectURL(file) +
              '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">';
          }
          if (previewEl && kind === "Background") {
            previewEl.innerHTML = '<img src="' + URL.createObjectURL(file) + '" alt="">';
          }
        });
      });
    })();
  </script>
</body>
</html>
