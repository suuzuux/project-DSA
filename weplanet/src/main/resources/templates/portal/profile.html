<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 관리 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-shell"
       th:classappend="${isAgency} ? (${artistSelected} ? ' portal-shell--agency' : ' portal-shell--agency-pick') : ''">
    <th:block th:replace="~{portal/fragments/sidebars :: sidebars}"></th:block>

    <main class="portal-main">
      <th:block th:replace="~{portal/fragments/sidebars :: pickHint('프로필 관리')}"></th:block>
      <th:block th:if="${artistSelected}">
      <div class="portal-main__head">
        <h1>프로필 관리</h1>
        <a class="btn btn--ghost btn--sm" th:href="@{/community/{artistId}(artistId=${artist.id})}">커뮤니티 열기</a>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:#1f7a52;margin-bottom:12px;" th:text="${msg}"></p>
      <p th:if="${error}" class="text-sm" style="color:#c45c26;margin-bottom:12px;" th:text="${error}"></p>

      <form class="settings-block" style="max-width:640px;" th:action="@{/portal/profile}" method="post">
        <div class="form-group">
          <label class="form-label" for="nickname">표시 이름</label>
          <input class="form-input" id="nickname" name="nickname" th:value="${artist.nickname}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input class="form-input" id="email" name="email" type="email" th:value="${artist.email}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="intro">소개글</label>
          <textarea class="form-textarea" id="intro" name="intro"
                    placeholder="커뮤니티 About에 표시됩니다"
                    th:text="${artistProfile.intro != null ? artistProfile.intro : ''}"></textarea>
          <p class="text-xs text-muted mt-8">저장하면 해당 아티스트 커뮤니티 Highlight의 About 소개란에 반영됩니다.</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="headerImageUrl">헤더 이미지 URL</label>
          <input class="form-input" id="headerImageUrl" name="headerImageUrl"
                 th:value="${artistProfile.headerImageUrl != null ? artistProfile.headerImageUrl : ''}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="logoImageUrl">로고 이미지 URL</label>
          <input class="form-input" id="logoImageUrl" name="logoImageUrl"
                 th:value="${artistProfile.logoImageUrl != null ? artistProfile.logoImageUrl : ''}" />
        </div>
        <div class="flex-center" style="justify-content:flex-end;">
          <button type="submit" class="btn btn--primary">저장</button>
        </div>
      </form>
      </th:block>
    </main>
  </div>
</body>
</html>
