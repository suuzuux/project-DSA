<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신고함 / 차단 | Artist Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/portal.css}" />
</head>
<body>
  <div class="portal-shell"
       th:classappend="${isAgency} ? (${artistSelected} ? ' portal-shell--agency' : ' portal-shell--agency-pick') : ''">
    <th:block th:replace="~{portal/fragments/sidebars :: sidebars}"></th:block>

    <main class="portal-main">
      <th:block th:replace="~{portal/fragments/sidebars :: pickHint('신고함 / 차단 관리')}"></th:block>
      <th:block th:if="${artistSelected}">
      <div class="portal-main__head">
        <h1>신고함 / 차단 관리</h1>
        <a class="btn btn--ghost btn--sm" th:href="@{/portal/dashboard}">← 대시보드</a>
      </div>

      <p th:if="${msg}" class="text-sm" style="color:#1f7a52;margin-bottom:12px;" th:text="${msg}"></p>

      <section class="panel mb-16">
        <h2 class="panel__title">게시글 신고</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>작성자</th>
                <th>게시글</th>
                <th>사유</th>
                <th>접수일</th>
                <th>조치</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(postReports)}">
                <td colspan="5" class="text-sm text-muted">접수된 게시글 신고가 없습니다.</td>
              </tr>
              <tr th:each="report : ${postReports}">
                <td th:text="${authorNicknames.get(report.post.author.id)}">팬닉네임</td>
                <td th:text="${report.post.title}">게시글 제목</td>
                <td th:text="${report.reason}">SPAM</td>
                <td th:text="${#temporals.format(report.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.25 16:00</td>
                <td>
                  <form th:action="@{/portal/reports/post/{id}/block(id=${report.id})}" method="post">
                    <button type="submit" class="btn btn--ghost btn--sm">차단</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel mb-16">
        <h2 class="panel__title">댓글 신고</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>작성자</th>
                <th>댓글</th>
                <th>사유</th>
                <th>접수일</th>
                <th>조치</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(commentReports)}">
                <td colspan="5" class="text-sm text-muted">접수된 댓글 신고가 없습니다.</td>
              </tr>
              <tr th:each="report : ${commentReports}">
                <td th:text="${authorNicknames.get(report.comment.author.id)}">팬닉네임</td>
                <td th:text="${report.comment.content}">댓글 내용</td>
                <td th:text="${report.reason}">SPAM</td>
                <td th:text="${#temporals.format(report.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.25 16:00</td>
                <td>
                  <form th:action="@{/portal/reports/comment/{id}/block(id=${report.id})}" method="post">
                    <button type="submit" class="btn btn--ghost btn--sm">차단</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel__title">차단 목록</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>차단 계정</th>
                <th>사유</th>
                <th>차단일</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(blocks)}">
                <td colspan="4" class="text-sm text-muted">차단된 계정이 없습니다.</td>
              </tr>
              <tr th:each="block : ${blocks}">
                <td th:text="${block.blockedUser.nickname}">팬닉네임</td>
                <td th:text="${block.reason != null ? block.reason : '-'}">사유</td>
                <td th:text="${#temporals.format(block.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.25 16:00</td>
                <td>
                  <form th:action="@{/portal/blocks/{id}/delete(id=${block.id})}" method="post">
                    <button type="submit" class="btn btn--ghost btn--sm">해제</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      </th:block>
    </main>
  </div>
</body>
</html>
