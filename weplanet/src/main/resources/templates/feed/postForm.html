<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글쓰기</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
</head>
<body>

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
</header>

<div class="container container--narrow section">
    <!-- ${post} != null : 수정 화면으로 왔으면 post에 값이 채워져 있고, 새 글쓰기 화면이면 null임.
         이 하나의 화면(postForm.html)을 "글쓰기"와 "수정" 두 가지 용도로 같이 씀 -->
    <h1 class="section__title" style="margin-bottom:20px;"
        th:text="${post} != null ? '게시글 수정' : ${boardType} + ' 게시판 글쓰기'"></h1>

    <!--
        enctype="multipart/form-data" : 이 폼으로 "파일"도 같이 전송하겠다는 표시.
        이게 없으면 텍스트(제목/내용)만 전송되고, 파일 첨부(input type="file")는 서버에 전달되지 않음
    -->
    <form th:action="${post} != null ? @{/posts/detail/{id}/edit(id=${post.id})} : @{/posts/{boardType}/new(boardType=${boardType})}"
          method="post" enctype="multipart/form-data" id="postForm">

        <div class="form-group">
            <label class="form-label">테스트 작성자</label>
            <select name="testUserId" class="form-select">
                <option value="1">1번 - 팬 계정</option>
                <option value="2">2번 - 아티스트 계정</option>
                <option value="3">3번 - 관리자 계정</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">제목</label>
            <input type="text" class="form-input" name="title" th:value="${post} != null ? ${post.title} : ''">
        </div>

        <div class="form-group">
            <label class="form-label">내용</label>
            <!-- Toast UI Editor(외부 마크다운 에디터 라이브러리)가 이 자리에 화면을 그려줌 -->
            <div id="editor"></div>
            <p class="text-xs text-muted" style="text-align:right;margin-top:4px;">
                <span id="contentCharCount">0</span> / 1000
            </p>
        </div>

        <!--
            hidden : "이 태그를 화면에 안 보이게 숨겨라"는 뜻의 순수 HTML 속성 (CSS의 display:none과 달리
            style 속성이 아니라 진짜 HTML 표준 속성임).
            사용자 눈에는 위쪽의 예쁜 에디터만 보이지만, 실제로 서버에 전송되는 값은 이 textarea에 담긴 값임.
            폼을 제출하기 직전에, 아래 스크립트가 에디터 내용을 이 textarea에 복사해 넣어줌
        -->
        <textarea name="content" id="contentInput" hidden
                  th:text="${post} != null ? ${post.content} : ''"></textarea>

        <!-- 첨부파일 입력창 - 새 글 작성할 때만 보여줌 (수정 화면에서는 파일 첨부 기능 미지원) -->
        <div class="form-group" th:if="${post} == null">
            <label class="form-label">첨부파일 (이미지/일반파일, 최대 10개)</label>
            <input type="file" name="files" id="filesInput" multiple>
            <p id="fileLimitWarning" class="form-error" style="display:none;color:var(--wp-danger);">이미지는 최대 10개까지 첨부할 수 있어요.</p>
        </div>

        <button type="submit" id="submitButton" class="btn btn--primary btn--block" th:text="${post} != null ? '수정' : '작성'" disabled></button>
    </form>
</div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
    const contentInput = document.getElementById('contentInput');
    const submitButton = document.getElementById('submitButton');
    const charCountEl = document.getElementById('contentCharCount');
    const CONTENT_MAX_LEN = 1000;

    // Toast UI Editor 초기화 - 수정 화면이면 기존 내용을(contentInput.value), 새 글이면 빈 값을 넣어서 시작함
    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '400px',
        initialEditType: 'wysiwyg', // 워드처럼 서식이 바로 보이는 편집 모드로 시작
        previewStyle: 'vertical',
        initialValue: contentInput.value
    });

    // 글자수 세기 + 등록 버튼 활성/비활성 처리
    // - 공백(0자)이면 버튼 비활성화 (와이어프레임: 공백 상태에서 등록하기 버튼 비활성화)
    // - 1,000자(공백/줄바꿈 포함) 넘으면 버튼 비활성화 + 안내
    function refreshCharCount() {
        const text = editor.getMarkdown();
        const len = text.length;

        charCountEl.textContent = len;
        charCountEl.style.color = len > CONTENT_MAX_LEN ? 'var(--wp-danger)' : '';

        const isEmpty = text.trim().length === 0;
        const isTooLong = len > CONTENT_MAX_LEN;
        submitButton.disabled = isEmpty || isTooLong;
    }

    editor.on('change', refreshCharCount);
    refreshCharCount(); // 처음 화면 진입 시(수정 화면일 때 기존 내용 기준)에도 한 번 계산

    // 폼이 제출되기 "직전"에, 에디터 안의 내용을 마크다운 문자열로 꺼내서
    // 숨겨진 textarea(contentInput)에 넣어줌. 그래야 서버로 실제 값이 전송됨
    document.getElementById('postForm').addEventListener('submit', function () {
        contentInput.value = editor.getMarkdown();
    });

    // 첨부파일 최대 10개 제한 - 그 이상 고르면 안내 문구를 보여주고 선택을 비움
    const filesInput = document.getElementById('filesInput');
    if (filesInput) {
        filesInput.addEventListener('change', function () {
            const warning = document.getElementById('fileLimitWarning');
            if (filesInput.files.length > 10) {
                warning.style.display = 'block';
                filesInput.value = '';
            } else {
                warning.style.display = 'none';
            }
        });
    }
</script>

</body>
</html>
