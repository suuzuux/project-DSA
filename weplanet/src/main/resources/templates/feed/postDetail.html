<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
</head>
<body>

<header class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">W</span>
        <span class="brand__text">We<span>Pla</span>Net</span>
    </a>
</header>

<div class="community-body" style="grid-template-columns:minmax(0,1fr) 380px;width:min(100% - 40px, 1160px);margin:16px auto;align-items:start;">

<div class="community-main">
<article class="post-card">
    <div class="post-card__head">
        <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
        <div class="post-card__meta">
            <div class="post-card__name">
                <span th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></span>
                <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
            </div>
            <div class="post-card__time"
                 th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                 th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
        </div>
    </div>

    <h1 style="font-size:var(--wp-fs-lg);margin:12px 0 6px;" th:text="${post.title}"></h1>

    <!-- 와이어프레임 기준: 본문 위에 번역보기 링크 (Gemini로 영어 번역) -->
    <a href="javascript:void(0)" id="postTranslateLink" class="translate-link" style="margin-top:0;">번역보기</a>
    <p id="postTranslatedText" class="text-sm" style="display:none;margin:6px 0 0;color:var(--wp-ink-soft);"></p>

    <!-- Toast UI Editor(외부 라이브러리)가 여기에 마크다운 본문을 예쁘게 그려줌 (아래 스크립트 참고) -->
    <div id="contentViewer" class="post-card__body"></div>

    <!-- 첨부파일 - 이미지는 와이어프레임처럼 큼직한 "사진" 영역으로, 그 외 파일(pdf 등)은 다운로드 링크로 보여줌 -->
    <div th:if="${not #lists.isEmpty(attachments)}" class="post-card__media" style="margin-top:12px;">
        <div th:each="file : ${attachments}">
            <img th:if="${file.image}" th:src="@{'/uploads/' + ${file.storedName}}" th:alt="${file.originalName}"
                 style="width:100%;border-radius:var(--wp-radius-sm);margin-bottom:6px;">
            <a th:unless="${file.image}" class="translate-link" th:href="@{'/uploads/' + ${file.storedName}}"
               th:text="${file.originalName}" download></a>
        </div>
    </div>

    <!-- 와이어프레임 기준: 하단에 좋아요/댓글/북마크 아이콘 고정, 숫자는 0이면 표시 안 함 -->
    <div class="post-card__actions">
        <span style="display:flex;align-items:center;gap:6px;">
            <select id="likeUserId" class="form-select" style="min-height:28px;padding:2px 6px;font-size:12px;width:auto;">
                <option value="1">1번 - 팬 계정</option>
                <option value="2">2번 - 아티스트 계정</option>
            </select>
            <button id="likeButton" type="button" style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;">
                ♥ <span id="likeCount" th:text="${post.likeCount > 0 ? post.likeCount : ''}"></span>
            </button>
        </span>
        <span th:if="${#lists.size(comments) > 0}">💬 <span th:text="${#lists.size(comments)}"></span></span>
        <span th:unless="${#lists.size(comments) > 0}">💬</span>

        <!-- 북마크 - 좋아요와 같은 testUserId 선택값을 그대로 씀 -->
        <button id="bookmarkButton" type="button"
                th:classappend="${bookmarked} ? ' is-active'"
                style="background:none;border:none;cursor:pointer;color:inherit;font-size:inherit;margin-left:auto;">
            <span id="bookmarkIcon" th:text="${bookmarked} ? '🔖' : '📑'"></span>
        </button>
    </div>
</article>

<!-- 테스트/관리용 도구 - 실제 서비스 화면(와이어프레임)엔 없는, testUserId 기반 개발용 버튼 모음 -->
<div class="post-card" style="margin-top:12px;">
    <p class="text-xs text-muted" style="margin-bottom:10px;">테스트 도구 (실제 화면에는 없음)</p>
    <div class="post-card__actions" style="flex-wrap:wrap;border-top:none;padding-top:0;">
        <a class="btn btn--ghost btn--sm" th:href="@{/posts/detail/{id}/edit(id=${post.id})}">게시글 수정</a>

        <form th:action="@{/posts/detail/{id}/delete(id=${post.id})}" method="post" style="display:flex;gap:6px;align-items:center;">
            <select name="testUserId" class="form-select" style="min-height:34px;padding:4px 8px;">
                <option value="1">1번(팬)으로 삭제 시도</option>
                <option value="2">2번(아티스트)으로 삭제 시도</option>
            </select>
            <button type="submit" class="btn btn--ghost btn--sm">게시글 삭제</button>
        </form>

        <form id="postReportForm" th:action="@{/posts/detail/{id}/report(id=${post.id})}" method="post" style="display:flex;gap:6px;align-items:center;">
            <select name="testUserId" class="form-select" style="min-height:34px;padding:4px 8px;">
                <option value="1">1번(팬)으로 신고</option>
                <option value="2">2번(아티스트)으로 신고</option>
            </select>
            <select name="reason" class="form-select" style="min-height:34px;padding:4px 8px;">
                <option value="SPAM">스팸</option>
                <option value="ABUSE">욕설/혐오</option>
                <option value="SEXUAL">음란물</option>
                <option value="ETC">기타</option>
            </select>
            <button type="submit" class="btn btn--ghost btn--sm">게시글 신고</button>
        </form>
        <b id="postReportMsg" class="text-xs"></b>

        <button id="summarizeButton" type="button" class="btn btn--soft btn--sm">AI 요약보기</button>
    </div>
    <div id="summaryArea"></div>
</div>
</div>

<aside class="community-aside" id="commentSection" th:fragment="commentsFragment">
    <div class="post-card">
        <p class="form-label" style="margin-bottom:8px;">댓글 작성</p>
        <form id="commentForm" th:action="@{/posts/detail/{id}/comment(id=${post.id})}" method="post">
            <select name="testUserId" class="form-select" style="margin-bottom:8px;">
                <option value="1">1번 - 팬 계정</option>
                <option value="2">2번 - 아티스트 계정</option>
            </select>
            <input type="text" name="content" id="commentContentInput" class="form-input" maxlength="100"
                   placeholder="댓글을 입력하세요.">
            <p class="text-xs text-muted" style="text-align:right;margin-top:4px;">
                <span id="commentCharCount">0</span> / 100
            </p>
            <button type="submit" class="btn btn--primary btn--block btn--sm" style="margin-top:6px;">등록</button>
        </form>
        <script>
            // 댓글 입력창 글자수 카운터 (댓글 목록이 fetch로 통째로 바뀔 때마다 이 script도 같이 다시 실행됨)
            (function () {
                const input = document.getElementById('commentContentInput');
                const counter = document.getElementById('commentCharCount');
                if (input && counter) {
                    input.addEventListener('input', function () {
                        counter.textContent = input.value.length;
                    });
                }
            })();
        </script>
    </div>

    <!-- 아티스트 댓글 - 와이어프레임: 항상 최상단 별도 박스, 화살표로 접기/펼치기 -->
    <div th:if="${not #lists.isEmpty(artistComments)}" class="post-card" style="margin-top:12px;">
        <div class="flex-between" style="cursor:pointer;" onclick="document.getElementById('artistCommentBox').classList.toggle('is-collapsed'); this.querySelector('.collapse-arrow').textContent = this.querySelector('.collapse-arrow').textContent === '▲' ? '▼' : '▲';">
            <strong class="text-sm">아티스트 댓글 <span th:text="${#lists.size(artistComments)}"></span></strong>
            <span class="collapse-arrow text-sm">▲</span>
        </div>
        <div id="artistCommentBox" class="stack" style="margin-top:8px;">
            <div class="comment-item" th:each="comment : ${artistComments}"
                 style="background:var(--wp-brand-soft);border-radius:8px;padding:10px 12px;">
                <div class="avatar avatar--sm" th:text="${#strings.substring(comment.author.nickname,0,1)}"></div>
                <div class="comment-item__body">
                    <div class="comment-item__meta">
                        <strong th:text="${comment.author.nickname}"></strong> <span class="badge-verified">✓</span>
                        · <span th:with="y=${#temporals.year(comment.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                                th:text="${y == curY} ? ${#temporals.format(comment.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    <p class="comment-item__text" th:text="${comment.content}"></p>
                    <a href="javascript:void(0)" class="comment-translate-link translate-link" th:attr="data-comment-id=${comment.id}">번역보기</a>
                    <p th:id="'commentTranslated-' + ${comment.id}" class="text-xs" style="display:none;margin:4px 0 0;color:var(--wp-ink-soft);"></p>
                    <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
                        <form class="comment-delete-form" style="display:flex;gap:4px;"
                              th:action="@{/posts/detail/{id}/comment/{commentId}/delete(id=${post.id}, commentId=${comment.id})}"
                              method="post">
                            <select name="testUserId" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="1">1번(팬)</option>
                                <option value="2">2번(아티스트)</option>
                            </select>
                            <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
                        </form>
                        <form class="comment-report-form" style="display:flex;gap:4px;"
                              th:action="@{/posts/detail/{id}/comment/{commentId}/report(id=${post.id}, commentId=${comment.id})}"
                              method="post">
                            <select name="testUserId" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="1">1번(팬)</option>
                                <option value="2">2번(아티스트)</option>
                            </select>
                            <select name="reason" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="SPAM">스팸</option>
                                <option value="ABUSE">욕설/혐오</option>
                                <option value="SEXUAL">음란물</option>
                                <option value="ETC">기타</option>
                            </select>
                            <button type="submit" class="btn btn--ghost btn--sm">신고</button>
                        </form>
                        <b class="comment-report-msg text-xs"></b>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 전체 댓글 (아티스트 댓글 제외) -->
    <div class="post-card" style="margin-top:12px;">
        <strong class="text-sm">전체 댓글 <span th:text="${#lists.size(otherComments)}"></span></strong>
        <div class="stack" style="margin-top:8px;" th:if="${not #lists.isEmpty(otherComments)}">
            <div class="comment-item" th:each="comment : ${otherComments}">
                <div class="avatar avatar--sm" th:text="${#strings.substring(comment.author.nickname,0,1)}"></div>
                <div class="comment-item__body">
                    <div class="comment-item__meta">
                        <strong th:text="${comment.author.nickname}"></strong>
                        · <span th:with="y=${#temporals.year(comment.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                                th:text="${y == curY} ? ${#temporals.format(comment.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    <p class="comment-item__text" th:text="${comment.content}"></p>
                    <a href="javascript:void(0)" class="comment-translate-link translate-link" th:attr="data-comment-id=${comment.id}">번역보기</a>
                    <p th:id="'commentTranslated-' + ${comment.id}" class="text-xs" style="display:none;margin:4px 0 0;color:var(--wp-ink-soft);"></p>
                    <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
                        <form class="comment-delete-form" style="display:flex;gap:4px;"
                              th:action="@{/posts/detail/{id}/comment/{commentId}/delete(id=${post.id}, commentId=${comment.id})}"
                              method="post">
                            <select name="testUserId" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="1">1번(팬)</option>
                                <option value="2">2번(아티스트)</option>
                            </select>
                            <button type="submit" class="btn btn--ghost btn--sm">삭제</button>
                        </form>
                        <form class="comment-report-form" style="display:flex;gap:4px;"
                              th:action="@{/posts/detail/{id}/comment/{commentId}/report(id=${post.id}, commentId=${comment.id})}"
                              method="post">
                            <select name="testUserId" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="1">1번(팬)</option>
                                <option value="2">2번(아티스트)</option>
                            </select>
                            <select name="reason" class="form-select" style="min-height:28px;padding:2px 6px;font-size:11px;">
                                <option value="SPAM">스팸</option>
                                <option value="ABUSE">욕설/혐오</option>
                                <option value="SEXUAL">음란물</option>
                                <option value="ETC">기타</option>
                            </select>
                            <button type="submit" class="btn btn--ghost btn--sm">신고</button>
                        </form>
                        <b class="comment-report-msg text-xs"></b>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(otherComments)}" class="text-muted" style="margin-top:8px;"><i>등록된 댓글이 없습니다.</i></p>
    </div>
</aside>
</div>

<style>
    /* 아티스트 댓글 접기 상태 - JS가 이 클래스를 토글해서 여닫음 */
    #artistCommentBox.is-collapsed { display: none; }
</style>

<script th:inline="javascript">
    // Thymeleaf가 이 부분(/*[[${post.id}]]*/)을 서버에서 실제 게시글 번호로 바꿔치기해줌.
    // 그래서 자바스크립트에서도 "지금 보고 있는 게시글이 몇 번인지" 알 수 있음
    const postId = /*[[${post.id}]]*/ 0;

    // ----- 좋아요 버튼 -----
    document.getElementById('likeButton').addEventListener('click', function () {
        const testUserId = document.getElementById('likeUserId').value;

        fetch(`/posts/detail/${postId}/like?testUserId=${testUserId}`, {method: 'POST'})
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                document.getElementById('likeCount').textContent = data.likeCount > 0 ? data.likeCount : '';
            });
    });

    // ----- 북마크 버튼 (좋아요와 같은 testUserId 선택값을 그대로 씀) -----
    document.getElementById('bookmarkButton').addEventListener('click', function () {
        const testUserId = document.getElementById('likeUserId').value;
        const btn = this;

        fetch(`/posts/detail/${postId}/bookmark?testUserId=${testUserId}`, {method: 'POST'})
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                document.getElementById('bookmarkIcon').textContent = data.bookmarked ? '🔖' : '📑';
                btn.classList.toggle('is-active', data.bookmarked);
            });
    });

    // ----- 게시글 번역보기 (Gemini) -----
    document.getElementById('postTranslateLink').addEventListener('click', function () {
        const link = this;
        const textArea = document.getElementById('postTranslatedText');

        // 이미 번역문이 보이는 상태면, 다시 누를 때 원문만 보이게 접어줌 (토글)
        if (textArea.style.display !== 'none') {
            textArea.style.display = 'none';
            link.textContent = '번역보기';
            return;
        }

        link.textContent = '번역 중...';

        fetch(`/posts/detail/${postId}/translate`, {method: 'POST'})
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                textArea.textContent = data.translated;
                textArea.style.display = 'block';
                link.textContent = '원문보기';
            });
    });

    // ----- 댓글 번역보기 (아티스트 댓글/전체 댓글 공통, 이벤트 위임으로 처리) -----
    document.addEventListener('click', function (e) {
        if (!e.target.classList.contains('comment-translate-link')) {
            return;
        }
        const link = e.target;
        const commentId = link.getAttribute('data-comment-id');
        const textArea = document.getElementById('commentTranslated-' + commentId);

        if (textArea.style.display !== 'none') {
            textArea.style.display = 'none';
            link.textContent = '번역보기';
            return;
        }

        link.textContent = '번역 중...';

        fetch(`/posts/detail/${postId}/comment/${commentId}/translate`, {method: 'POST'})
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                textArea.textContent = data.translated;
                textArea.style.display = 'block';
                link.textContent = '원문보기';
            });
    });

    // ----- 게시글 신고 폼 -----
    document.getElementById('postReportForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const form = e.target;
        const msg = document.getElementById('postReportMsg');

        fetch(form.action, {
            method: 'POST',
            headers: {'X-Requested-With': 'fetch'},
            body: new URLSearchParams(new FormData(form))
        })
            .then(function (response) {
                return response.json().then(function (data) {
                    return {ok: response.ok, data: data};
                });
            })
            .then(function (result) {
                msg.textContent = (result.ok ? '[성공] ' : '[실패] ') + result.data.message;
            });
    });

    // ----- AI 요약 버튼 -----
    document.getElementById('summarizeButton').addEventListener('click', function () {
        const area = document.getElementById('summaryArea');
        area.innerHTML = '<p>AI가 요약을 만들고 있어요...</p>';

        fetch(`/posts/detail/${postId}/summarize`, {
            method: 'POST',
            headers: {'X-Requested-With': 'fetch'}
        })
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                area.innerHTML = '<hr><h4>AI 요약</h4><p id="summaryText"></p>';
                document.getElementById('summaryText').textContent = data.summary;
            });
    });

    // 댓글 작성 폼과 댓글 삭제 폼은 여러 개(댓글 개수만큼) 반복해서 화면에 생기고,
    // 댓글 목록이 갱신될 때마다 새로 만들어지므로, 폼 하나하나에 직접 이벤트를 걸지 않고
    // "document 전체에 이벤트를 걸어두고, 그 안에서 어떤 폼이 제출됐는지 확인하는" 방식(이벤트 위임)을 씀.
    document.addEventListener('submit', function (e) {
        const form = e.target;

        if (form.id === 'commentForm' || form.classList.contains('comment-delete-form')) {
            e.preventDefault();

            fetch(form.action, {
                method: 'POST',
                headers: {'X-Requested-With': 'fetch'},
                body: new URLSearchParams(new FormData(form))
            })
                .then(function (response) {
                    return response.text();
                })
                .then(function (html) {
                    document.getElementById('commentSection').outerHTML = html;
                });
        }

        if (form.classList.contains('comment-report-form')) {
            e.preventDefault();
            const msg = form.nextElementSibling;

            fetch(form.action, {
                method: 'POST',
                headers: {'X-Requested-With': 'fetch'},
                body: new URLSearchParams(new FormData(form))
            })
                .then(function (response) {
                    return response.json().then(function (data) {
                        return {ok: response.ok, data: data};
                    });
                })
                .then(function (result) {
                    msg.textContent = (result.ok ? '[성공] ' : '[실패] ') + result.data.message;
                });
        }
    });
</script>

<p style="width:min(100% - 40px, 1160px);margin:16px auto;"><a class="section__link" th:href="@{/}">&lt;&lt; 홈으로</a></p>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<style>
    /* 유튜브 링크가 본문에 있으면 이 박스 안에 실제 영상 플레이어로 바꿔서 보여줌 (16:9 반응형) */
    .video-embed {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        margin: 10px 0;
        border-radius: var(--wp-radius-sm);
        background: #000;
    }
    .video-embed iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: 0;
    }
</style>
<script th:inline="javascript">
    // 게시글 본문(마크다운 문법으로 저장된 텍스트)을, 사람이 보기 좋은 형태로 그려주는
    // 외부 라이브러리(Toast UI Editor)를 "뷰어 모드"로 초기화하는 코드
    new toastui.Editor.factory({
        el: document.querySelector('#contentViewer'),
        viewer: true,
        initialValue: /*[[${post.content}]]*/ ''
    });

    // 와이어프레임 기준: 본문에 유튜브 링크가 있으면 링크 대신 실제 영상을 띄워줌.
    setTimeout(embedYoutubeLinks, 0);

    function embedYoutubeLinks() {
        const container = document.getElementById('contentViewer');
        const ytPattern = /^https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=([\w-]{11})|youtu\.be\/([\w-]{11}))/;

        function makeEmbed(videoId) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-embed';
            wrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '" ' +
                'title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            return wrapper;
        }

        container.querySelectorAll('a').forEach(function (a) {
            const m = a.href.match(ytPattern);
            if (m) {
                a.replaceWith(makeEmbed(m[1] || m[2]));
            }
        });

        const globalYtPattern = /(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=[\w-]{11}[^\s<]*|youtu\.be\/[\w-]{11}[^\s<]*))/g;
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        textNodes.forEach(function (node) {
            const text = node.nodeValue;
            globalYtPattern.lastIndex = 0;
            if (!globalYtPattern.test(text)) return;
            globalYtPattern.lastIndex = 0;

            const frag = document.createDocumentFragment();
            let lastIndex = 0;
            let match;
            while ((match = globalYtPattern.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }
                const single = match[0].match(ytPattern);
                if (single) {
                    frag.appendChild(makeEmbed(single[1] || single[2]));
                } else {
                    frag.appendChild(document.createTextNode(match[0]));
                }
                lastIndex = globalYtPattern.lastIndex;
            }
            if (lastIndex < text.length) {
                frag.appendChild(document.createTextNode(text.slice(lastIndex)));
            }
            node.parentNode.replaceChild(frag, node);
        });
    }
</script>

</body>
