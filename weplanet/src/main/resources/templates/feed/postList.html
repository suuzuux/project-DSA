<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{feed.pageTitle}">게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body>

<header class="community-top">
    <div class="community-top__left">
        <a class="home-link" th:href="@{/}">🏠</a>
        <h1 class="community-top__name" th:text="#{feed.boardTitle(${boardType})}"></h1>
    </div>
</header>

<nav class="tabs" style="width:min(100% - 40px, 1120px);margin:16px auto 0;">
    <span class="text-muted">Highlight</span>
    <span class="text-muted">Notice</span>
    <a th:classappend="${boardType.name() == 'FAN'} ? ' is-active'" th:href="@{/posts/fan}">Fan</a>
    <a th:classappend="${boardType.name() == 'ARTIST'} ? ' is-active'" th:href="@{/posts/artist}">Artist</a>
    <span class="text-muted">Media</span>
    <span class="text-muted">Live</span>
</nav>

<div class="community-body" style="grid-template-columns:220px minmax(0,1fr);width:min(100% - 40px, 1120px);margin:16px auto 0;">

    <aside class="community-aside">
        <button type="button" class="btn btn--primary btn--block" id="openWriteModalBtn" th:text="#{feed.write}">포스트 작성하기</button>
    </aside>

    <div class="community-main">
        <!-- 글쓰기 모달 -->
        <div class="modal-backdrop" id="writeModalBackdrop">
            <div class="modal modal--wide" onclick="event.stopPropagation()">
                <div class="modal__head">
                    <span class="modal__title" th:text="#{feed.write}">포스트 작성하기</span>
                    <button type="button" class="modal__close" id="closeWriteModalBtn">✕</button>
                </div>

                <form id="writeModalForm" th:action="@{/posts/{boardType}/new(boardType=${boardType})}" method="post" enctype="multipart/form-data">
                    <!-- 제목 입력칸이 없어 등록 직전 본문 앞부분으로 채운다 (DB 필수 컬럼). -->
                    <input type="hidden" name="title" id="writeModalTitle">

                    <textarea name="content" id="writeModalContent" class="form-textarea" maxlength="1000"
                              placeholder="포스트를 남겨보세요…" th:placeholder="#{feed.writePlaceholder}" style="min-height:220px;"></textarea>
                    <p class="text-xs text-muted" style="text-align:right;margin-top:4px;">
                        <span id="writeModalCharCount">0</span> / 1000
                    </p>
                    <p id="writeModalError" class="form-error" style="display:none;"></p>

                    <div class="flex-between" style="margin-top:10px;">
                        <label style="cursor:pointer;font-size:20px;" title="이미지 첨부" th:title="#{feed.attachImage}">
                            🖼️
                            <input type="file" name="files" id="writeModalFiles" multiple accept="image/*,application/pdf,.txt,.zip" style="display:none;">
                        </label>
                        <span id="writeModalFileCount" class="text-xs text-muted"></span>
                    </div>

                    <button type="submit" class="btn btn--primary btn--block" style="margin-top:14px;" id="writeModalSubmit" th:text="#{feed.submit}" disabled>등록하기</button>
                </form>
            </div>
        </div>

        <div class="flex-between" style="margin-bottom:12px;">
            <a class="section__link" th:href="@{/}" th:text="#{feed.backHome}">&lt;&lt; 홈으로</a>
            <div class="flex-center">
                <a class="sort-link btn btn--ghost btn--sm" th:href="@{/posts/{boardType}(boardType=${boardType}, sort='latest')}"
                   th:classappend="${sort == 'latest'} ? ' btn--soft'" th:text="#{feed.sort.latest}">전체순</a>
                <a class="sort-link btn btn--ghost btn--sm" th:href="@{/posts/{boardType}(boardType=${boardType}, sort='popular')}"
                   th:classappend="${sort == 'popular'} ? ' btn--soft'" th:text="#{feed.sort.popular}">인기순</a>
            </div>
        </div>

        <!-- 정렬 변경 시 이 fragment 만 fetch 로 받아 교체한다. -->
        <div id="postListArea" th:fragment="postListFragment">
            <div class="feed" th:if="${not #lists.isEmpty(posts)}">
                <article class="post-card" th:each="post : ${posts}">
                    <a th:href="@{/posts/detail/{id}(id=${post.id})}" style="display:block;color:inherit;">
                        <div class="post-card__head">
                            <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
                            <div class="post-card__meta">
                                <div class="post-card__name">
                                    <span th:text="${post.author != null} ? ${post.author.nickname} : #{feed.unknownAuthor}"></span>
                                    <span th:if="${post.author != null and post.author.artistSide}" class="badge-verified">✓</span>
                                </div>
                                <div class="post-card__time"
                                     th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                                     th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                            </div>
                        </div>
                        <p class="post-card__body" th:text="${post.title}"></p>
                        <!-- 첫 번째 이미지 첨부를 썸네일로 표시 -->
                        <div th:if="${thumbnailUrls.get(post.id)} != null" class="post-card__media">
                            <img th:src="@{'/uploads/' + ${thumbnailUrls.get(post.id)}}" alt="" style="width:100%;border-radius:var(--wp-radius-sm);max-height:320px;object-fit:cover;">
                        </div>
                    </a>
                    <div class="post-card__actions">
                        <span th:if="${post.likeCount > 0}">♥ <span th:text="${post.likeCount}"></span></span>
                        <span th:unless="${post.likeCount > 0}">♥</span>
                        <span th:with="cc=${commentCounts.get(post.id)}">
                            <span th:if="${cc > 0}">💬 <span th:text="${cc}"></span></span>
                            <span th:unless="${cc > 0}">💬</span>
                        </span>
                    </div>
                </article>
            </div>

            <p th:if="${#lists.isEmpty(posts)}" class="list-empty" th:text="#{feed.empty}">등록된 게시글이 없습니다.</p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const FEED_I18N = {
        fileLimit: /*[[#{feed.fileLimit}]]*/ '이미지는 최대 10개까지 첨부할 수 있어요.',
        filesSelected: /*[[#{feed.filesSelected}]]*/ '{0}개 선택됨',
        submitFailed: /*[[#{feed.submitFailed}]]*/ '등록에 실패했어요.'
    };
</script>
<script>
    // 비동기(fetch) 정렬 전환

    // 정렬된 목록을 받아 화면을 갱신한다 (pushHistory: 주소·뒤로가기 기록 남김 여부).
    function loadList(url, pushHistory) {

        // X-Requested-With: fetch 면 서버가 목록 fragment 만 돌려준다.
        fetch(url, {headers: {'X-Requested-With': 'fetch'}})
            .then(function (response) {
                // 응답 HTML 텍스트
                return response.text();
            })
            .then(function (html) {
                // 받은 fragment 로 기존 목록 교체
                document.getElementById('postListArea').outerHTML = html;

                // 정렬 버튼 활성 표시 갱신
                const sortValue = new URL(url, window.location.origin).searchParams.get('sort') || 'latest';
                document.querySelectorAll('.sort-link').forEach(function (link) {
                    const isActive = new URL(link.href).searchParams.get('sort') === sortValue;
                    link.classList.toggle('btn--soft', isActive);
                });

                if (pushHistory) {
                    // 새로고침·뒤로가기에도 정렬 상태가 유지되게 주소를 바꾼다.
                    history.pushState({}, '', url);
                }
            });
    }

    // 정렬 링크는 페이지 이동 대신 loadList() 로 처리
    document.querySelectorAll('.sort-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
            e.preventDefault(); // 기본 페이지 이동 막기
            loadList(this.getAttribute('href'), true);
        });
    });

    // 뒤로가기·앞으로가기 시 목록만 다시 불러온다.
    window.addEventListener('popstate', function () {
        loadList(window.location.href, false);
    });

    // 글쓰기 모달
    const writeModalBackdrop = document.getElementById('writeModalBackdrop');
    const writeModalForm = document.getElementById('writeModalForm');
    const writeModalContent = document.getElementById('writeModalContent');
    const writeModalCharCount = document.getElementById('writeModalCharCount');
    const writeModalSubmit = document.getElementById('writeModalSubmit');
    const writeModalError = document.getElementById('writeModalError');
    const writeModalFiles = document.getElementById('writeModalFiles');
    const writeModalFileCount = document.getElementById('writeModalFileCount');

    function openWriteModal() {
        writeModalForm.reset();
        writeModalCharCount.textContent = '0';
        writeModalFileCount.textContent = '';
        writeModalError.style.display = 'none';
        writeModalSubmit.disabled = true;
        writeModalBackdrop.classList.add('is-open');
        writeModalContent.focus();
    }

    function closeWriteModal() {
        writeModalBackdrop.classList.remove('is-open');
    }

    document.getElementById('openWriteModalBtn').addEventListener('click', openWriteModal);
    document.getElementById('closeWriteModalBtn').addEventListener('click', closeWriteModal);
    // 배경 클릭 시 닫기 (모달 박스 클릭은 전파 중단)
    writeModalBackdrop.addEventListener('click', closeWriteModal);

    // 글자 수 표시 (공백이거나 1000자 초과면 등록 비활성)
    writeModalContent.addEventListener('input', function () {
        const text = writeModalContent.value;
        writeModalCharCount.textContent = text.length;
        writeModalSubmit.disabled = text.trim().length === 0 || text.length > 1000;
    });

    // 첨부파일 10개 제한
    writeModalFiles.addEventListener('change', function () {
        if (writeModalFiles.files.length > 10) {
            writeModalError.textContent = FEED_I18N.fileLimit;
            writeModalError.style.display = 'block';
            writeModalFiles.value = '';
            writeModalFileCount.textContent = '';
        } else {
            writeModalError.style.display = 'none';
            writeModalFileCount.textContent = writeModalFiles.files.length > 0 ? FEED_I18N.filesSelected.replace('{0}', writeModalFiles.files.length) : '';
        }
    });

    // fetch 로 등록하고 성공하면 목록만 다시 그린다.
    writeModalForm.addEventListener('submit', function (e) {
        e.preventDefault();

        // 본문 앞 30자를 제목으로 쓴다.
        const content = writeModalContent.value.trim();
        document.getElementById('writeModalTitle').value = content.length > 30 ? content.slice(0, 30) + '…' : content;

        writeModalSubmit.disabled = true;

        fetch(writeModalForm.action, {
            method: 'POST',
            headers: {'X-Requested-With': 'fetch'},
            body: new FormData(writeModalForm) // 첨부파일까지 multipart 로 전송
        })
            .then(function (response) {
                if (response.ok) {
                    return response.text().then(function (html) {
                        document.getElementById('postListArea').outerHTML = html;
                        closeWriteModal();
                    });
                }
                // 실패 시 GlobalExceptionHandler 가 JSON 에러 메시지를 돌려준다.
                return response.json().then(function (data) {
                    writeModalError.textContent = data.message || FEED_I18N.submitFailed;
                    writeModalError.style.display = 'block';
                    writeModalSubmit.disabled = false;
                });
            });
    });
</script>

</body>
</html>
