<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body>

<header class="community-top">
    <div class="community-top__left">
        <a class="home-link" th:href="@{/}">🏠</a>
        <h1 class="community-top__name" th:text="${boardType} + ' 게시판'"></h1>
    </div>
</header>

<nav class="tabs" style="width:min(100% - 40px, 1120px);margin:16px auto 0;">
    <span class="text-muted">Highlight</span>
    <span class="text-muted">Notice</span>
    <a th:classappend="${boardType.name() == 'FAN'} ? ' is-active'" th:href="@{/posts/fan}">Fan</a>
    <a th:classappend="${boardType.name() == 'ARTIST'} ? ' is-active'" th:href="@{/posts/artist}">Artist</a>
    <span class="text-muted">Media</span>
    <span class="text-muted">Live</span>
</nav>

<div class="community-body" style="grid-template-columns:220px minmax(0,1fr);width:min(100% - 40px, 1120px);margin:16px auto 0;">

    <aside class="community-aside">
        <a class="btn btn--primary btn--block" th:href="@{/posts/{boardType}/new(boardType=${boardType})}">포스트 작성하기</a>
    </aside>

    <div class="community-main">
        <div class="flex-between" style="margin-bottom:12px;">
            <a class="section__link" th:href="@{/}">&lt;&lt; 홈으로</a>
            <div class="flex-center">
                <a class="sort-link btn btn--ghost btn--sm" th:href="@{/posts/{boardType}(boardType=${boardType}, sort='latest')}"
                   th:classappend="${sort == 'latest'} ? ' btn--soft'">전체순</a>
                <a class="sort-link btn btn--ghost btn--sm" th:href="@{/posts/{boardType}(boardType=${boardType}, sort='popular')}"
                   th:classappend="${sort == 'popular'} ? ' btn--soft'">인기순</a>
            </div>
        </div>

        <!--
            이 div 안쪽(카드 목록)이 "postListFragment"라는 이름표가 붙은 부분임.
            정렬 버튼을 누르면, 페이지 전체가 아니라 이 div 안쪽 내용만 서버에서 새로 받아와서 통째로 바꿔치기함.
        -->
        <div id="postListArea" th:fragment="postListFragment">
            <div class="feed" th:if="${not #lists.isEmpty(posts)}">
                <article class="post-card" th:each="post : ${posts}">
                    <a th:href="@{/posts/detail/{id}(id=${post.id})}" style="display:block;color:inherit;">
                        <div class="post-card__head">
                            <div class="avatar" th:text="${post.author != null ? #strings.substring(post.author.nickname,0,1) : '?'}"></div>
                            <div class="post-card__meta">
                                <div class="post-card__name">
                                    <span th:text="${post.author != null ? post.author.nickname : '(알 수 없음)'}"></span>
                                    <span th:if="${post.author != null and post.author.role.name() == 'ARTIST'}" class="badge-verified">✓</span>
                                </div>
                                <div class="post-card__time"
                                     th:with="y=${#temporals.year(post.createdAt)}, curY=${#temporals.year(#temporals.createNow())}"
                                     th:text="${y == curY} ? ${#temporals.format(post.createdAt, 'MM-dd HH:mm')} : ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                            </div>
                        </div>
                        <p class="post-card__body" th:text="${post.title}"></p>
                        <!-- 와이어프레임: 첫 번째 이미지 첨부파일을 카드 안 "사진 영역"으로 표시 -->
                        <div th:if="${thumbnailUrls.get(post.id)} != null" class="post-card__media">
                            <img th:src="@{'/uploads/' + ${thumbnailUrls.get(post.id)}}" alt="" style="width:100%;border-radius:var(--wp-radius-sm);max-height:320px;object-fit:cover;">
                        </div>
                    </a>
                    <div class="post-card__actions">
                        <span th:if="${post.likeCount > 0}">♥ <span th:text="${post.likeCount}"></span></span>
                        <span th:unless="${post.likeCount > 0}">♥</span>
                        <span th:with="cc=${commentCounts.get(post.id)}">
                            <span th:if="${cc > 0}">💬 <span th:text="${cc}"></span></span>
                            <span th:unless="${cc > 0}">💬</span>
                        </span>
                    </div>
                </article>
            </div>

            <p th:if="${#lists.isEmpty(posts)}" class="text-muted" style="padding:24px 0;"><i>등록된 게시글이 없습니다.</i></p>
        </div>
    </div>
</div>

<script>
    // ===================================================================
    // 아래는 "비동기(fetch) 정렬 전환" 기능의 자바스크립트 코드.
    // web1~5 과정에서는 <a href="...">를 누르면 브라우저가 그 주소로 페이지 전체를 새로 불러왔는데,
    // 여기서는 fetch()라는 자바스크립트 기능을 이용해서, 페이지 이동 없이
    // "서버한테 살짝 물어보고, 그 결과로 화면 일부만 바꿔치기"하는 방식을 씀.
    // ===================================================================

    // url 주소로 서버에 정렬된 목록을 요청하고, 받아온 결과로 화면을 갱신하는 함수.
    // pushHistory : 브라우저 주소창의 URL과 "뒤로가기 기록"을 남길지 여부
    function loadList(url, pushHistory) {

        // fetch(주소, 옵션) : 페이지 이동 없이 그 주소로 요청을 보내는 자바스크립트 내장 기능.
        // headers에 X-Requested-With: fetch 를 실어 보내면, 서버(PostController)가
        // "아, 이건 화면 전체가 아니라 목록 부분만 원하는 요청이구나"라고 알아채고
        // postList.html 전체가 아니라 위 div(postListFragment) 부분만 돌려줌
        fetch(url, {headers: {'X-Requested-With': 'fetch'}})
            .then(function (response) {
                // response : 서버가 돌려준 응답 전체. .text()로 그 안의 HTML 텍스트만 꺼냄
                return response.text();
            })
            .then(function (html) {
                // 서버가 돌려준 HTML 조각(html)으로, 기존 div를 통째로 교체함
                document.getElementById('postListArea').outerHTML = html;

                // 정렬 버튼(전체순/인기순)의 활성 표시(btn--soft)도 같이 갱신
                const sortValue = new URL(url, window.location.origin).searchParams.get('sort') || 'latest';
                document.querySelectorAll('.sort-link').forEach(function (link) {
                    const isActive = new URL(link.href).searchParams.get('sort') === sortValue;
                    link.classList.toggle('btn--soft', isActive);
                });

                if (pushHistory) {
                    // history.pushState(...) : 페이지를 새로 불러오지 않으면서,
                    // 브라우저 주소창의 URL만 바꾸고 "뒤로가기 기록"에 한 페이지를 추가하는 기능.
                    // 이걸 해줘야 새로고침해도 정렬 상태가 유지되고, 뒤로가기도 자연스럽게 동작함
                    history.pushState({}, '', url);
                }
            });
    }

    // "최신순" / "인기순" 링크를 누르면, 원래 동작(페이지 이동) 대신 loadList()가 실행되게 함
    document.querySelectorAll('.sort-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
            e.preventDefault(); // 링크의 원래 동작(페이지 이동)을 막음
            loadList(this.getAttribute('href'), true);
        });
    });

    // 브라우저 뒤로가기/앞으로가기 버튼을 눌렀을 때 발생하는 이벤트.
    // 이때도 페이지를 통째로 새로 불러오는 대신, 목록 부분만 다시 fetch로 불러옴
    window.addEventListener('popstate', function () {
        loadList(window.location.href, false);
    });
</script>

</body>
</html>
