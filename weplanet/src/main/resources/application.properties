spring.application.name=weplanet

# 소스 코드(HTML, JS, CSS 등 정적 리소스)가 바꼈을 때, 브라우저를 자동으로 새로고침 해주는 기능
spring.devtools.livereload.enabled=true

# url
server.port=9999
server.servlet.context-path=/

# log
logging.level.root=info
logging.level.megane6.weplanet=debug

## MySQL ####################################################
# 인텔리제이 플러그인(EnvFile) 도움 없이, 스프링 부트가 스스로 .env 파일을 직접 읽어서 연동하게 만드는 설정
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

## Gemini API (FEED-09 AI 자동 요약) ##########################
gemini.api.key=${GEMINI_API_KEY}

## 게시글 첨부파일 업로드 용량 제한 (파일 하나당 20MB, 요청 전체 50MB) ##########################
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB


