spring.application.name=weplanet

# 소스 코드(HTML, JS, CSS 등 정적 리소스)가 바꼈을 때, 브라우저를 자동으로 새로고침 해주는 기능
spring.devtools.livereload.enabled=true

# url
server.port=9999
server.servlet.context-path=/

# log
logging.level.root=info
logging.level.6megane.weplanet=debug

## MySQL ####################################################
# 인텔리제이 플러그인(EnvFile) 도움 없이, 스프링 부트가 스스로 .env 파일을 직접 읽어서 연동하게 만드는 설정
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/weplanet?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

