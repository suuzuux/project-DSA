spring.application.name=weplanet

# 정적 리소스가 바뀌면 브라우저 자동 새로고침
spring.devtools.livereload.enabled=true

# 다국어 (messages.properties 기본 한국어, _ja, _en)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# 키가 없으면 시스템 로케일이 아닌 messages.properties(한국어)로 떨어지게 한다.
spring.messages.fallback-to-system-locale=false

# url
server.port=9999
server.servlet.context-path=/
server.servlet.session.timeout=1h
# 외부 사이트의 POST 요청에는 세션 쿠키를 붙이지 않는다 (CSRF 1차 방어).
server.servlet.session.cookie.same-site=lax
# 리버스 프록시(HTTPS) 뒤에서도 리다이렉트 주소가 올바르게 잡히게 한다.
server.forward-headers-strategy=native

# log
logging.level.root=info
logging.level.megane6.weplanet=info

# MySQL - .env 파일을 직접 읽어 접속 정보를 가져온다.
spring.config.import=optional:file:.env[.properties]
fan-project.account.encryption-key=${FAN_PROJECT_ACCOUNT_ENCRYPTION_KEY}
fan-project.account.hmac-key=${FAN_PROJECT_ACCOUNT_HMAC_KEY}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Gemini API (AI 자동 요약, AI 팬 채팅)
gemini.api.key=${GEMINI_API_KEY}
# 배너·공지 번역 전용 키 (없으면 위 키 사용, 한도 분리용)
gemini.translation.api.key=${GEMINI_TRANSLATION_API_KEY:}

# 첨부파일 업로드 용량 (파일당 200MB, 요청 전체 220MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

# 이메일 인증 (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# 결제 - 토스페이먼츠 가상계좌 (키는 환경변수로만)
toss.client-key=${TOSS_CLIENT_KEY}
toss.secret-key=${TOSS_SECRET_KEY}

## 소셜 로그인 - Google ##########################
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

## 소셜 로그인 - Kakao  ##########################
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

## 소셜 로그인 - LINE  ##########################
spring.security.oauth2.client.registration.line.client-id=${LINE_CLIENT_ID}
spring.security.oauth2.client.registration.line.client-secret=${LINE_CLIENT_SECRET}
spring.security.oauth2.client.registration.line.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.line.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.line.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.line.client-name=LINE
spring.security.oauth2.client.registration.line.scope=profile
spring.security.oauth2.client.provider.line.authorization-uri=https://access.line.me/oauth2/v2.1/authorize
spring.security.oauth2.client.provider.line.token-uri=https://api.line.me/oauth2/v2.1/token
spring.security.oauth2.client.provider.line.user-info-uri=https://api.line.me/v2/profile
spring.security.oauth2.client.provider.line.user-name-attribute=userId


# Hibernate SQL 로그 (필요할 때만 debug)
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
spring.jpa.hibernate.ddl-auto=validate
# dialect 는 Hibernate 가 JDBC 연결 정보로 자동 인식한다.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
# 에러 처리 - Whitelabel 페이지를 끄고 GlobalExceptionHandler 가 처리한다.
server.error.whitelabel.enabled=false
# 404 도 예외로 던져 NoHandlerFoundException 핸들러가 잡게 한다.
spring.mvc.throw-exception-if-no-handler-found=true
# SMTP 응답 지연 시 타임아웃 (밀리초)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 에러 응답에 스택 트레이스·내부 메시지 노출 차단
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# 메일 활성화 링크의 기준 주소
weplanet.base-url=${WEPLANET_BASE_URL:http://localhost:9999}